<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="SHADOW FALL — Atmosferik siluet-platform. Limbo tarzı fizik ve bulmaca.">
<link rel="icon" href="data:,">
<title>SHADOW FALL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden; background:#050507;
  touch-action:none; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  font-family:'Inter',sans-serif;
}
button { font-family:inherit; -webkit-user-select:none; user-select:none; }
#game-container { position:fixed; inset:0; }
#game-container canvas { display:block; }

/* ---------- cinematic letterbox ---------- */
.bar { position:fixed; left:0; right:0; height:0; background:#000; z-index:15; transition:height 1.2s cubic-bezier(.7,0,.3,1); pointer-events:none; }
#bar-top { top:0; } #bar-bot { bottom:0; }
body.cine #bar-top, body.cine #bar-bot { height:9vh; }

/* ---------- subtitles ---------- */
#subtitle {
  position:fixed; left:50%; bottom:calc(12vh + env(safe-area-inset-bottom)); transform:translateX(-50%);
  max-width:min(640px,86vw); text-align:center; z-index:16; pointer-events:none;
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(17px,3.4vw,24px);
  color:rgba(216,214,210,0.92); text-shadow:0 1px 12px rgba(0,0,0,0.9);
  opacity:0; transition:opacity 0.9s ease; letter-spacing:0.04em; line-height:1.5;
}
#subtitle.show { opacity:1; }

/* ---------- touch controls ---------- */
#controls {
  position:fixed; left:0; right:0; bottom:0;
  display:none; justify-content:space-between; align-items:flex-end;
  padding:0 14px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  padding-left:calc(14px + env(safe-area-inset-left));
  padding-right:calc(14px + env(safe-area-inset-right));
  pointer-events:none; z-index:20;
}
.cluster { display:flex; gap:10px; pointer-events:auto; align-items:flex-end; }
.ctl {
  width:clamp(48px,11vh,66px); height:clamp(48px,11vh,66px);
  border-radius:50%; background:rgba(255,255,255,0.045);
  border:1px solid rgba(255,255,255,0.09); color:#B8B4AE;
  font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center;
  opacity:0.3; touch-action:none; transition:opacity 0.1s, transform 0.1s; outline:none; position:relative;
}
.ctl.active { opacity:0.65; transform:scale(0.94); }
#btn-act.glow { box-shadow:0 0 22px rgba(220,216,205,0.35); opacity:0.7; border-color:rgba(220,216,205,0.4); }
#btn-act .act-label {
  position:absolute; top:-22px; left:50%; transform:translateX(-50%);
  font-size:10px; letter-spacing:0.2em; color:rgba(220,216,205,0.8); white-space:nowrap; display:none;
}
#btn-act.glow .act-label { display:block; }

/* ---------- HUD ---------- */
#hud {
  position:fixed; top:calc(10px + env(safe-area-inset-top)); left:calc(16px + env(safe-area-inset-left));
  display:none; align-items:center; gap:14px; z-index:21; pointer-events:none;
}
#hp-row { display:flex; gap:5px; align-items:center; }
.hp-cell {
  width:22px; height:8px; border-radius:2px; background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1); transition:background 0.4s;
}
.hp-cell.full { background:rgba(205,200,190,0.75); }
.hp-cell.hurt { animation:hpFlash 0.5s; }
@keyframes hpFlash { 0%{background:rgba(230,225,215,1);} 100%{background:rgba(255,255,255,0.07);} }
#inv-row { display:flex; gap:8px; align-items:center; }
.inv-slot {
  width:34px; height:34px; border-radius:8px; background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1); display:none; align-items:center; justify-content:center;
}
.inv-slot.show { display:flex; animation:invPop 0.35s cubic-bezier(.3,1.6,.5,1); }
.inv-slot svg { width:22px; height:22px; }
@keyframes invPop { 0%{transform:scale(0.3);} 100%{transform:scale(1);} }
.hud-chip {
  display:none; align-items:center; gap:6px; height:34px; padding:0 10px;
  border-radius:8px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
  color:#C9C5BE; font-size:12px; font-family:'Inter',sans-serif;
}
.hud-chip svg { width:18px; height:18px; }
.hud-chip .num { letter-spacing:0.06em; }
/* pil göstergesi */
#battery-box { display:none; }
#bat-bar { width:54px; height:8px; border-radius:3px; background:rgba(255,255,255,0.08); overflow:hidden; }
#bat-fill { height:100%; width:100%; background:rgba(205,200,190,0.75); transition:width 0.4s linear; }
#battery-box.on #bat-icon { opacity:1; }
#bat-icon { opacity:0.35; transition:opacity 0.3s; }
#bat-spares { font-size:10px; color:#8E8A82; }
/* nefes barı */
#breath-bar {
  position:fixed; left:50%; top:18vh; transform:translateX(-50%);
  width:160px; height:6px; border-radius:3px; background:rgba(255,255,255,0.08);
  display:none; z-index:21; overflow:hidden;
}
#breath-fill { height:100%; background:rgba(150,190,214,0.8); transition:width 0.2s linear; }
/* boss barı */
#boss-bar {
  position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  width:min(420px,60vw); display:none; z-index:21; pointer-events:none; text-align:center;
}
#boss-bar .boss-name {
  font-family:'Cormorant Garamond',serif; font-size:14px; letter-spacing:0.4em;
  color:#C9A295; margin-bottom:5px;
}
#boss-bar .boss-track { height:7px; border-radius:3px; background:rgba(255,255,255,0.07); overflow:hidden; border:1px solid rgba(214,160,140,0.25); }
#boss-bar .boss-fill { height:100%; width:100%; background:rgba(190,120,100,0.8); transition:width 0.3s; }

#pause-btn {
  position:fixed; top:calc(10px + env(safe-area-inset-top)); right:calc(14px + env(safe-area-inset-right));
  width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  color:#B8B4AE; font-size:13px; display:none; align-items:center; justify-content:center;
  opacity:0.35; z-index:21; cursor:pointer;
}
#pause-btn:active { opacity:0.8; }

/* ---------- sahne atlama (sinematiklerde) ---------- */
#skip-btn {
  position:fixed;
  bottom:calc(11vh + env(safe-area-inset-bottom));
  right:calc(20px + env(safe-area-inset-right));
  display:none; align-items:center; gap:7px;
  padding:9px 16px; border-radius:20px;
  background:rgba(10,10,14,0.55); border:1px solid rgba(255,255,255,0.16);
  color:rgba(216,214,210,0.82); font-family:'Inter',sans-serif;
  font-size:11px; letter-spacing:0.26em; cursor:pointer; z-index:22;
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  opacity:0; transition:opacity 0.5s ease, background 0.25s, color 0.25s;
}
#skip-btn.show { display:flex; opacity:0.55; }
#skip-btn:hover, #skip-btn:active { opacity:1; background:rgba(20,20,26,0.8); color:#E8E4DC; }
#skip-btn .skip-ico { font-size:13px; letter-spacing:0; }

/* ---------- overlays ---------- */
.overlay {
  position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
  z-index:30; background:radial-gradient(ellipse at 50% 60%, rgba(5,5,7,0.6) 0%, rgba(5,5,7,0.96) 82%);
  opacity:0; transition:opacity 0.7s ease;
}
.overlay.visible { display:flex; opacity:1; }
.panel-title {
  font-family:'Cormorant Garamond',serif; font-weight:400; font-size:clamp(24px,5.5vw,36px);
  letter-spacing:0.3em; margin-left:0.3em; color:#C9C5BE; margin-bottom:26px;
}
.text-btn {
  background:none; border:none; font-weight:300; font-size:14px;
  letter-spacing:0.4em; margin-left:0.4em; color:#8E8A82; padding:14px 26px; cursor:pointer;
  transition:color 0.4s, letter-spacing 0.4s;
}
.text-btn:hover, .text-btn:active { color:#E8E4DC; letter-spacing:0.48em; }
.text-btn.dim { color:#5A5750; font-size:11px; }

/* ---------- main menu ---------- */
#menu { z-index:32; background:transparent; }
#menu .menu-inner { display:flex; flex-direction:column; align-items:center; }
#menu h1 {
  font-family:'Cormorant Garamond',serif; font-weight:400; font-size:clamp(38px,10vw,84px);
  letter-spacing:0.42em; margin-left:0.42em; color:#D6D2CA;
  text-shadow:0 0 60px rgba(200,196,188,0.12); animation:menuBreathe 7s ease-in-out infinite;
}
#menu .sub {
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(13px,3vw,17px);
  color:#6A665E; margin:6px 0 52px; letter-spacing:0.18em;
}
#menu .menu-buttons { display:flex; flex-direction:column; align-items:center; gap:4px; }
#menu .version {
  position:absolute; bottom:calc(14px + env(safe-area-inset-bottom));
  font-size:9px; letter-spacing:0.3em; color:#3A3833;
}
@keyframes menuBreathe {
  0%,100% { text-shadow:0 0 50px rgba(200,196,188,0.08); opacity:0.92; }
  50%     { text-shadow:0 0 90px rgba(200,196,188,0.22); opacity:1; }
}

/* ---------- chapter select (150 bölüm) ---------- */
#chapters-panel { overflow-y:auto; }
#chapters-grid {
  display:flex; flex-direction:column; gap:4px; margin-bottom:24px;
  max-height:62vh; overflow-y:auto; padding:0 18px;
}
.act-head {
  font-size:10px; letter-spacing:0.32em; color:#6A665E; margin:12px 0 4px;
  font-family:'Inter',sans-serif; text-align:left;
}
.act-row { display:flex; gap:5px; flex-wrap:wrap; }
.lv-btn {
  width:38px; height:38px; border-radius:8px; cursor:pointer;
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
  color:#A8A49C; font-size:12px; font-family:'Inter',sans-serif;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.25s, color 0.25s;
}
.lv-btn:hover { background:rgba(255,255,255,0.1); color:#E8E4DC; }
.lv-btn.locked { opacity:0.2; cursor:default; }
.lv-btn.locked:hover { background:rgba(255,255,255,0.04); color:#A8A49C; }
.lv-btn.bosslv { border-color:rgba(214,160,140,0.4); color:#C9A295; }

/* ---------- options ---------- */
#options-body { display:flex; flex-direction:column; gap:18px; width:min(360px,84vw); margin-bottom:28px; }
.opt-row { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.opt-row label { font-size:12px; letter-spacing:0.22em; color:#A8A49C; font-weight:300; }
.opt-row input[type=range] { width:140px; accent-color:#A8A49C; }

/* ---------- death / chapter end ---------- */
#death-text {
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(18px,4.4vw,26px);
  color:#7A766E; margin-bottom:34px; letter-spacing:0.1em;
}
.end-line {
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(16px,3.4vw,22px);
  color:#C9C5BE; opacity:0; transform:translateY(8px); transition:opacity 1.8s ease, transform 1.8s ease;
  letter-spacing:0.06em; line-height:1.5;
}
.end-line.in { opacity:0.92; transform:translateY(0); }
#chapter-card {
  position:fixed; inset:0; z-index:28; display:none; align-items:center; justify-content:center;
  flex-direction:column; pointer-events:none; opacity:0; transition:opacity 1.4s ease; background:#000;
}
#chapter-card.visible { display:flex; opacity:1; }
#chapter-card .num { font-size:11px; letter-spacing:0.55em; margin-left:0.55em; color:#5A5750; margin-bottom:14px; }
#chapter-card .name {
  font-family:'Cormorant Garamond',serif; font-size:clamp(26px,6.5vw,44px);
  letter-spacing:0.32em; margin-left:0.32em; color:#C9C5BE;
}

/* ---------- fade ---------- */
#fader { position:fixed; inset:0; background:#000; z-index:40; opacity:1; transition:opacity 1.6s ease; pointer-events:none; }
#fader.clear { opacity:0; }

#rotate-hint {
  position:fixed; inset:0; z-index:60; background:#050507; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  color:#8E8A82; font-size:13px; letter-spacing:0.2em; text-align:center; padding:0 30px;
}
@media (orientation:portrait) and (pointer:coarse) { #rotate-hint { display:flex; } }
</style>
</head>
<body>

<div id="game-container"></div>

<div class="bar" id="bar-top"></div>
<div class="bar" id="bar-bot"></div>
<div id="subtitle"></div>
<div id="fader"></div>

<!-- HUD -->
<div id="hud">
  <div id="hp-row"></div>
  <div id="inv-row">
    <div class="inv-slot" id="inv-crowbar" title="Levye">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9C5BE" stroke-width="1.6" stroke-linecap="round">
        <path d="M4 20 L15 9 M15 9 q4 -4 5 -5 q1 1 -1 4 q-1 1.5 -3 2.5"/>
      </svg>
    </div>
    <div class="inv-slot" id="inv-key" title="Anahtar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9C5BE" stroke-width="1.6" stroke-linecap="round">
        <circle cx="8" cy="8" r="3.4"/><path d="M10.5 10.5 L19 19 M16 16 l2.6 -2.6 M13.4 13.4 l2 -2"/>
      </svg>
    </div>
    <div class="inv-slot" id="inv-carkey" title="Araba Anahtarı">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9C5BE" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="8" r="4"/><path d="M12 12 v8 M12 17 h3 M12 20 h2"/>
      </svg>
    </div>
    <div class="hud-chip" id="cnt-bandage" title="Bandaj">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9C5BE" stroke-width="1.6" stroke-linecap="round">
        <rect x="3" y="8" width="18" height="8" rx="4"/><path d="M9 8 l2 8 M13 8 l2 8"/>
      </svg>
      <span class="num">0</span><span style="font-size:9px;color:#6A665E">[Q]</span>
    </div>
    <div class="hud-chip" id="ammo-box" title="Mermi">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9C5BE" stroke-width="1.6" stroke-linecap="round">
        <path d="M5 14 h12 l3 -2 -3 -2 H5 z M8 14 v4 M12 14 v4"/>
      </svg>
      <span class="num">0 · 0</span>
    </div>
    <div class="hud-chip" id="battery-box" title="El Feneri">
      <svg id="bat-icon" viewBox="0 0 24 24" fill="none" stroke="#E8E0C8" stroke-width="1.6" stroke-linecap="round">
        <path d="M4 10 h6 l8 -4 v12 l-8 -4 H4 z M20 9 l2 -1 M20 15 l2 1 M21 12 h2"/>
      </svg>
      <div id="bat-bar"><div id="bat-fill"></div></div>
      <span id="bat-spares">×0</span>
    </div>
  </div>
</div>

<!-- nefes -->
<div id="breath-bar"><div id="breath-fill"></div></div>

<!-- boss -->
<div id="boss-bar">
  <div class="boss-name"></div>
  <div class="boss-track"><div class="boss-fill"></div></div>
</div>

<button id="pause-btn" aria-label="Duraklat">▮▮</button>
<button id="skip-btn" aria-label="Sahneyi atla">ATLA<span class="skip-ico">▸▸</span></button>

<!-- touch controls -->
<div id="controls">
  <div class="cluster">
    <button class="ctl" id="btn-left" aria-label="Sol">◂</button>
    <button class="ctl" id="btn-right" aria-label="Sağ">▸</button>
  </div>
  <div class="cluster">
    <button class="ctl" id="btn-flash" aria-label="Fener" style="font-size:15px">⌁</button>
    <button class="ctl" id="btn-fire" aria-label="Ateş" style="font-size:15px">✛</button>
    <button class="ctl" id="btn-crouch" aria-label="Eğil">⌄</button>
    <button class="ctl" id="btn-act" aria-label="Etkileşim">●<span class="act-label"></span></button>
    <button class="ctl" id="btn-jump" aria-label="Zıpla">▲</button>
  </div>
</div>

<!-- main menu -->
<div class="overlay" id="menu">
  <div class="menu-inner">
    <h1>SHADOW FALL</h1>
    <div class="sub">araf'ta bir söz: seni bulacağım</div>
    <div class="menu-buttons">
      <button class="text-btn" id="m-continue" style="display:none">DEVAM ET</button>
      <button class="text-btn" id="m-newgame">YENİ OYUN</button>
      <button class="text-btn" id="m-chapters">BÖLÜMLER</button>
      <button class="text-btn" id="m-options">AYARLAR</button>
    </div>
  </div>
  <div class="version">SHADOW FALL · v4.0 · ARAF · 150 BÖLÜM</div>
</div>

<!-- chapter select -->
<div class="overlay" id="chapters-panel">
  <div class="panel-title">BÖLÜMLER</div>
  <div id="chapters-grid"></div>
  <button class="text-btn dim" id="ch-back">GERİ</button>
</div>

<!-- options -->
<div class="overlay" id="options-panel">
  <div class="panel-title">AYARLAR</div>
  <div id="options-body">
    <div class="opt-row"><label>SES</label><input type="range" id="opt-vol" min="0" max="100" value="80"></div>
    <div class="opt-row"><label>MÜZİK</label><input type="range" id="opt-music" min="0" max="100" value="70"></div>
    <div class="opt-row"><label>FİLM GRENİ</label><input type="range" id="opt-grain" min="0" max="100" value="55"></div>
  </div>
  <button class="text-btn dim" id="opt-back">GERİ</button>
</div>

<!-- pause -->
<div class="overlay" id="pause-panel">
  <div class="panel-title">DURAKLADI</div>
  <button class="text-btn" id="p-resume">DEVAM</button>
  <button class="text-btn" id="p-restart">YENİDEN BAŞLA</button>
  <button class="text-btn dim" id="p-menu">ANA MENÜ</button>
</div>

<!-- death -->
<div class="overlay" id="death-panel">
  <div id="death-text">karanlık seni aldı</div>
  <button class="text-btn" id="d-retry">TEKRAR DENE</button>
  <button class="text-btn dim" id="d-menu">ANA MENÜ</button>
</div>

<!-- chapter title card -->
<div id="chapter-card">
  <div class="num"></div>
  <div class="name"></div>
</div>

<!-- ending -->
<div class="overlay" id="ending-panel" style="background:#000">
  <div id="ending-text" style="display:flex;flex-direction:column;gap:14px;max-width:min(640px,86vw);text-align:center"></div>
  <button class="text-btn dim" id="end-menu" style="margin-top:40px;transition:opacity 1.5s">ANA MENÜ</button>
</div>

<div id="rotate-hint">
  <div style="font-size:34px">⟳</div>
  <div>TELEFONU YAN ÇEVİR</div>
</div>

<script src="js/audio.js"></script>
<script src="js/atmosphere.js"></script>
<script src="js/human.js"></script>
<script src="js/physics.js"></script>
<script src="js/items.js"></script>
<script src="js/creatures.js"></script>
<script src="js/story.js"></script>
<script src="js/levelgen.js"></script>
<script src="js/main.js"></script>
</body>
</html>
