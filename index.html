<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="SHADOW FALL — Purgatory platformer / Araf'ta geçen atmosferik platform oyunu.">
<title>SHADOW FALL — Araf</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden; background:#08080D;
  touch-action:none; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  font-family:'Inter',sans-serif;
}
button { font-family:inherit; -webkit-user-select:none; user-select:none; }
#game-container { position:fixed; inset:0; }
#game-container canvas { display:block; }

/* ---------- touch controls ---------- */
#controls {
  position:fixed; left:0; right:0; bottom:0;
  display:none; justify-content:space-between; align-items:flex-end;
  padding:0 16px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  padding-left:calc(16px + env(safe-area-inset-left));
  padding-right:calc(16px + env(safe-area-inset-right));
  pointer-events:none; z-index:20;
}
.cluster { display:flex; gap:12px; pointer-events:auto; }
.ctl {
  width:clamp(46px,10.5vh,64px); height:clamp(46px,10.5vh,64px);
  border-radius:16px; background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12); color:#D8D0C8;
  font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center;
  opacity:0.35; touch-action:none; transition:opacity 0.08s; outline:none; position:relative;
}
.ctl.active { opacity:0.7; }
#btn-action.search-mode { box-shadow:0 0 18px rgba(212,196,240,0.5); opacity:0.85; }
#btn-lantern.lit { box-shadow:0 0 16px rgba(232,201,122,0.55); opacity:0.7; }
#btn-lantern .flare-dot {
  position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; border-radius:9px;
  background:rgba(232,90,90,0.85); color:#fff; font-size:11px; line-height:18px; padding:0 4px;
  display:none;
}

/* ---------- pause button ---------- */
#pause-btn {
  position:fixed; top:calc(12px + env(safe-area-inset-top)); right:calc(14px + env(safe-area-inset-right));
  width:42px; height:42px; border-radius:12px;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  color:#D8D0C8; font-size:15px; display:none; align-items:center; justify-content:center;
  opacity:0.4; z-index:21; cursor:pointer;
}
#pause-btn:active { opacity:0.8; }

/* ---------- overlays ---------- */
.overlay {
  position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
  z-index:30; background:radial-gradient(ellipse at 50% 60%, rgba(8,8,13,0.55) 0%, rgba(8,8,13,0.94) 80%);
  opacity:0; transition:opacity 0.5s ease;
}
.overlay.visible { display:flex; opacity:1; }
.panel-title {
  font-family:'Playfair Display',serif; font-weight:500; font-size:clamp(22px,5.5vw,34px);
  letter-spacing:0.22em; margin-left:0.22em; color:#D8D0C8; margin-bottom:22px;
}
.text-btn {
  background:none; border:none; font-weight:500; font-size:15px;
  letter-spacing:0.35em; margin-left:0.35em; color:#C8B48C; padding:13px 24px; cursor:pointer;
  border-bottom:1px solid transparent; transition:border-color 0.3s,color 0.3s;
}
.text-btn:hover, .text-btn:active { color:#FFF4D6; border-bottom-color:#C8B48C; }
.text-btn.dim { color:#807870; font-size:12px; }
.text-btn.dim:hover { color:#C8B48C; border-bottom-color:transparent; }

/* ---------- main menu ---------- */
#menu { z-index:32; background:radial-gradient(ellipse at 50% 65%, rgba(8,8,13,0.25) 0%, rgba(8,8,13,0.82) 78%); }
#menu h1 {
  font-family:'Playfair Display',serif; font-weight:500; font-size:clamp(34px,9vw,66px);
  letter-spacing:0.3em; margin-left:0.3em; color:#D8D0C8;
  text-shadow:0 0 36px rgba(212,196,240,0.25); animation:menuBreathe 5s ease-in-out infinite;
}
#menu .sub {
  font-family:'Playfair Display',serif; font-style:italic; font-size:clamp(13px,3.2vw,18px);
  color:#807870; margin-bottom:36px;
}
#menu .menu-buttons { display:flex; flex-direction:column; align-items:center; gap:2px; }
#menu .version {
  position:absolute; bottom:calc(14px + env(safe-area-inset-bottom));
  font-size:10px; letter-spacing:0.2em; color:#4A4640;
}
@keyframes menuBreathe {
  0%,100% { text-shadow:0 0 36px rgba(212,196,240,0.18); }
  50%     { text-shadow:0 0 56px rgba(212,196,240,0.38); }
}

/* ---------- level select ---------- */
#levels-panel .panel-title { margin-bottom:10px; }
#levels-sub { font-size:11px; letter-spacing:0.25em; color:#807870; margin-bottom:18px; }
#levels-grid {
  display:grid; grid-template-columns:repeat(6,1fr); gap:8px;
  width:min(440px,90vw); margin-bottom:16px;
}
.lvl-btn {
  aspect-ratio:1; border-radius:10px; background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1); color:#C8B48C; font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background 0.15s;
}
.lvl-btn:hover, .lvl-btn:active { background:rgba(212,196,240,0.12); }
.lvl-btn.done { border-color:rgba(232,201,122,0.45); color:#E8C97A; }
.lvl-btn.current { border-color:rgba(212,196,240,0.7); box-shadow:0 0 12px rgba(212,196,240,0.25); color:#F0E8FF; }
.lvl-btn.locked { opacity:0.22; cursor:default; color:#807870; }
.lvl-btn.boss { border-color:rgba(194,58,74,0.55); }
#levels-pager { display:flex; align-items:center; gap:18px; margin-bottom:10px; }
#pg-label { font-size:11px; letter-spacing:0.2em; color:#807870; min-width:90px; text-align:center; }
.pg-btn {
  background:none; border:1px solid rgba(255,255,255,0.14); border-radius:10px;
  color:#C8B48C; width:40px; height:34px; font-size:15px; cursor:pointer;
}
.pg-btn:disabled { opacity:0.2; }

/* ---------- options ---------- */
#options-body { display:flex; flex-direction:column; gap:16px; width:min(370px,86vw); margin-bottom:24px; }
.opt-row { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.opt-row label { font-size:13px; letter-spacing:0.12em; color:#D8D0C8; }
.opt-row input[type=range] { width:140px; accent-color:#C8B48C; }
.opt-toggle {
  width:46px; height:26px; border-radius:13px; background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.14); position:relative; cursor:pointer; transition:background 0.2s;
}
.opt-toggle::after {
  content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
  background:#807870; transition:left 0.2s,background 0.2s;
}
.opt-toggle.on { background:rgba(232,201,122,0.25); }
.opt-toggle.on::after { left:22px; background:#E8C97A; }
.lang-btn {
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); border-radius:10px;
  color:#E8C97A; font-size:13px; letter-spacing:0.2em; padding:7px 18px; cursor:pointer;
}

/* ---------- HUD ---------- */
#hud-hearts {
  position:fixed; top:calc(14px + env(safe-area-inset-top)); left:calc(16px + env(safe-area-inset-left));
  display:none; gap:5px; z-index:19; pointer-events:none;
  filter:drop-shadow(0 1px 6px rgba(0,0,0,0.9));
}
#hud-hearts span { font-size:19px; color:#E84A5F; transition:transform 0.15s, color 0.2s, opacity 0.2s; }
#hud-hearts span.empty { color:rgba(255,255,255,0.14); }
#hud-hearts span.pop { transform:scale(1.45); }

#hud-level {
  position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  font-size:11px; letter-spacing:0.3em; color:#807870; z-index:19; pointer-events:none;
  display:none; text-shadow:0 1px 6px rgba(0,0,0,0.9);
}

#hud-battery {
  position:fixed; right:calc(16px + env(safe-area-inset-right));
  bottom:calc(104px + env(safe-area-inset-bottom));
  display:none; align-items:center; gap:8px; z-index:19; pointer-events:none;
}
#hud-battery .lamp { font-size:16px; filter:drop-shadow(0 0 6px rgba(232,201,122,0.7)); transition:filter 0.4s, opacity 0.4s; }
#hud-battery.dead .lamp, #hud-battery.off .lamp { filter:none; opacity:0.3; }
#batt-track {
  width:120px; height:9px; border-radius:5px; background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.14); overflow:hidden;
}
#batt-fill {
  height:100%; width:80%; border-radius:4px;
  background:linear-gradient(90deg,#E8C97A,#FFF4D6); transition:width 0.25s linear, opacity 0.3s;
}
#hud-battery.off #batt-fill { opacity:0.35; }
#hud-battery.low #batt-fill { background:linear-gradient(90deg,#B33A3A,#E8745A); animation:battBlink 0.9s infinite; }
@keyframes battBlink { 0%,100%{opacity:1;} 50%{opacity:0.45;} }

#hud-weapon {
  position:fixed; left:calc(16px + env(safe-area-inset-left));
  bottom:calc(104px + env(safe-area-inset-bottom));
  display:none; align-items:center; gap:7px; z-index:19; pointer-events:none;
  font-size:12px; letter-spacing:0.15em; color:#C8B48C; text-shadow:0 1px 6px rgba(0,0,0,0.9);
}
#hud-weapon .w-icon { font-size:17px; }

#boss-bar {
  position:fixed; top:calc(44px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  width:min(320px,72vw); display:none; z-index:19; pointer-events:none;
}
#boss-bar .b-name { font-size:10px; letter-spacing:0.35em; color:#B07880; text-align:center; margin-bottom:4px; }
#boss-track { height:7px; border-radius:4px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,0,40,0.25); overflow:hidden; }
#boss-fill { height:100%; width:100%; background:linear-gradient(90deg,#7A1E2B,#C23A4A); transition:width 0.2s; }

/* farkındalık (kör boss) / awareness (blind boss) */
#aware-bar {
  position:fixed; top:calc(74px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  width:min(220px,56vw); display:none; z-index:19; pointer-events:none; align-items:center; gap:8px;
}
#aware-bar .eye { font-size:14px; transition:transform 0.2s; }
#aware-track { flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,0.07); border:1px solid rgba(232,201,122,0.3); overflow:hidden; }
#aware-fill { height:100%; width:0%; background:linear-gradient(90deg,#6A5A2A,#E8C97A,#E8745A); transition:width 0.2s; }
#aware-bar.hunting .eye { transform:scale(1.4); filter:drop-shadow(0 0 8px rgba(232,90,90,0.9)); }

/* ---------- cutscene ---------- */
#cine-sub {
  position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  max-width:84vw; font-family:'Playfair Display',serif; font-style:italic;
  font-size:clamp(16px,4.2vw,24px); color:#D8D0C8; text-align:center;
  text-shadow:0 2px 16px rgba(0,0,0,0.95); opacity:0; transition:opacity 0.45s ease;
  pointer-events:none; z-index:26;
}
#cine-sub.show { opacity:1; }
#cine-skip {
  position:fixed; top:calc(14px + env(safe-area-inset-top)); right:calc(16px + env(safe-area-inset-right));
  background:none; border:none; color:#807870; font-size:11px; letter-spacing:0.3em;
  display:none; z-index:27; cursor:pointer; padding:10px;
}
#cine-bars-top, #cine-bars-bot {
  position:fixed; left:0; right:0; height:0; background:#000; z-index:25; transition:height 0.8s ease; pointer-events:none;
}
#cine-bars-top { top:0; } #cine-bars-bot { bottom:0; }
body.cinema #cine-bars-top, body.cinema #cine-bars-bot { height:9vh; }

/* ---------- toast & monologue ---------- */
#toast {
  position:fixed; top:-80px; left:50%; transform:translateX(-50%);
  background:rgba(12,12,20,0.92); border:1px solid rgba(212,196,240,0.3); border-radius:14px;
  padding:11px 26px; z-index:40; transition:top 0.5s cubic-bezier(0.2,0.9,0.3,1.1); pointer-events:none;
  font-size:13px; letter-spacing:0.2em; color:#D4C4F0; text-align:center;
}
#toast.show { top:calc(16px + env(safe-area-inset-top)); }

#monologue {
  position:fixed; left:50%; bottom:calc(128px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  max-width:80vw; font-family:'Caveat',cursive; font-size:clamp(20px,4.5vw,27px);
  color:#D8D0C8; text-align:center; text-shadow:0 1px 14px rgba(0,0,0,0.9);
  opacity:0; transition:opacity 0.5s ease; pointer-events:none; z-index:25;
}
#monologue.show { opacity:0.92; }

#level-card {
  position:fixed; top:24vh; left:0; right:0; text-align:center; pointer-events:none; z-index:24;
  opacity:0; transition:opacity 1.2s ease;
}
#level-card.show { opacity:1; }
#level-card .lc-num { font-size:11px; letter-spacing:0.5em; color:#807870; margin-bottom:8px; }
#level-card .lc-name {
  font-family:'Playfair Display',serif; font-size:clamp(24px,6vw,40px);
  letter-spacing:0.2em; color:#D8D0C8; text-shadow:0 2px 22px rgba(0,0,0,0.9);
}

/* boss uyarısı / boss warning */
#boss-warn {
  position:fixed; top:36vh; left:0; right:0; text-align:center; pointer-events:none; z-index:24;
  opacity:0; transition:opacity 1s ease;
}
#boss-warn.show { opacity:1; }
#boss-warn .bw-title {
  font-family:'Playfair Display',serif; font-size:clamp(20px,5vw,32px);
  letter-spacing:0.25em; color:#C23A4A; text-shadow:0 0 24px rgba(194,58,74,0.5); margin-bottom:8px;
}
#boss-warn .bw-sub { font-size:12px; letter-spacing:0.2em; color:#B07880; max-width:80vw; margin:0 auto; line-height:1.7; }

#fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity 0.5s ease; z-index:28; }
#fade.dark { opacity:1; }

#kb-hint {
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  color:#807870; font-size:12px; letter-spacing:0.05em; z-index:15; pointer-events:none;
  opacity:0.7; display:none;
}
</style>
</head>
<body>

<div id="game-container"></div>

<!-- ============ MENU ============ -->
<div id="menu" class="overlay visible">
  <h1>SHADOW FALL</h1>
  <p class="sub" data-i18n="menu_sub"></p>
  <div class="menu-buttons">
    <button class="text-btn" id="btn-menu-continue" data-i18n="menu_continue"></button>
    <button class="text-btn" id="btn-menu-story" data-i18n="menu_story"></button>
    <button class="text-btn" id="btn-menu-action" data-i18n="menu_action"></button>
    <button class="text-btn dim" id="btn-menu-options" data-i18n="menu_options"></button>
  </div>
  <div class="version">SHADOW FALL · ARAF · v3.0</div>
</div>

<!-- ============ LEVEL SELECT ============ -->
<div id="levels-panel" class="overlay">
  <div class="panel-title" id="levels-title"></div>
  <div id="levels-sub"></div>
  <div id="levels-grid"></div>
  <div id="levels-pager">
    <button class="pg-btn" id="pg-prev">‹</button>
    <div id="pg-label"></div>
    <button class="pg-btn" id="pg-next">›</button>
  </div>
  <button class="text-btn dim" id="btn-levels-back" data-i18n="back"></button>
</div>

<!-- ============ OPTIONS ============ -->
<div id="options-panel" class="overlay">
  <div class="panel-title" data-i18n="opt_title"></div>
  <div id="options-body">
    <div class="opt-row"><label data-i18n="opt_lang"></label><button class="lang-btn" id="opt-lang">TÜRKÇE</button></div>
    <div class="opt-row"><label data-i18n="opt_master"></label><input type="range" id="opt-master" min="0" max="100" value="80"></div>
    <div class="opt-row"><label data-i18n="opt_music"></label><input type="range" id="opt-music" min="0" max="100" value="70"></div>
    <div class="opt-row"><label data-i18n="opt_sfx"></label><input type="range" id="opt-sfx" min="0" max="100" value="100"></div>
    <div class="opt-row"><label data-i18n="opt_haptics"></label><div class="opt-toggle on" id="opt-haptics"></div></div>
    <div class="opt-row"><label data-i18n="opt_reduced"></label><div class="opt-toggle" id="opt-reduced"></div></div>
  </div>
  <button class="text-btn dim" id="btn-options-reset" data-i18n="opt_erase"></button>
  <button class="text-btn dim" id="btn-options-back" data-i18n="back"></button>
</div>

<!-- ============ PAUSE ============ -->
<div id="pause-panel" class="overlay">
  <div class="panel-title" data-i18n="pause_title"></div>
  <div class="menu-buttons">
    <button class="text-btn" id="btn-pause-resume" data-i18n="pause_resume"></button>
    <button class="text-btn dim" id="btn-pause-restart" data-i18n="pause_restart"></button>
    <button class="text-btn dim" id="btn-pause-menu" data-i18n="pause_menu"></button>
  </div>
</div>

<!-- ============ HUD ============ -->
<button id="pause-btn" aria-label="pause">⏸</button>
<div id="hud-hearts"></div>
<div id="hud-level"></div>
<div id="hud-battery"><span class="lamp">🔦</span><div id="batt-track"><div id="batt-fill"></div></div></div>
<div id="hud-weapon"><span class="w-icon">👊</span><span class="w-label"></span></div>
<div id="boss-bar"><div class="b-name"></div><div id="boss-track"><div id="boss-fill"></div></div></div>
<div id="aware-bar"><span class="eye">👁</span><div id="aware-track"><div id="aware-fill"></div></div></div>

<!-- ============ CUTSCENE ============ -->
<div id="cine-bars-top"></div><div id="cine-bars-bot"></div>
<div id="cine-sub"></div>
<button id="cine-skip" data-i18n="skip"></button>

<div id="level-card"><div class="lc-num"></div><div class="lc-name"></div></div>
<div id="boss-warn"><div class="bw-title"></div><div class="bw-sub"></div></div>
<div id="monologue"></div>
<div id="toast"></div>
<div id="fade"></div>

<!-- ============ TOUCH ============ -->
<div id="controls">
  <div class="cluster">
    <button class="ctl" id="btn-left">◀</button>
    <button class="ctl" id="btn-right">▶</button>
  </div>
  <div class="cluster">
    <button class="ctl lit" id="btn-lantern">🔦<span class="flare-dot"></span></button>
    <button class="ctl" id="btn-action">⚔</button>
    <button class="ctl" id="btn-jump">▲</button>
  </div>
</div>

<div id="kb-hint"></div>

<script>
/* ==================================================================
   SHADOW FALL — ARAF (v3.0)
   ------------------------------------------------------------------
   Tek dosyalık atmosferik aksiyon-platform / korku oyunu. Phaser 3.60.
   v3: gerçekçi fizik (düşüş ivmesi, tepe asılması, sarkaç fener,
   verlet atkı), gizlilik (fener söndürme + gürültü), TR/EN dil,
   6 düşman türü + karanlıkta parlayan gözler, 4 farklı boss
   (20/50/80/100), ışık ve sesle avlanan kör final boss, her 10
   bölümde hikâye, güçlü uzunluk/zorluk ölçekleme.
   ================================================================== */
'use strict';

/* ============================ FİZİK ============================ */

const PHYS = {
  GRAVITY: 2000,
  FALL_MULT: 1.42,          // düşüş, yükselişten hızlı (gerçekçi his)
  APEX_GRAV: 0.52,          // tepe noktasında kısa asılma
  APEX_VY: 110,
  JUMP_VY: -660,
  JUMP_CUT_VY: -200,
  MOVE_SPEED: 252,
  ACCEL_GROUND: 2800,
  DECEL_GROUND: 3400,
  ACCEL_AIR: 1350,
  DRAG_AIR: 230,
  WALL_SLIDE: 85,
  WALL_JUMP_VX: 360,
  WALL_JUMP_VY: -590,
  WALL_LOCK_MS: 140,
  COYOTE_MS: 110,
  BUFFER_MS: 140,
  MAX_FALL: 1150,
  LAND_RECOVER_MS: 130
};

const BAL = {
  MAX_HEARTS: 6,
  START_HEARTS: 3,
  BATT_MAX: 100,
  BATT_START: 85,
  BATT_DRAIN: 1.0,
  BATT_PICKUP: 50,
  IFRAMES_MS: 1000,
  SEARCH_MS: 700,
  LIGHT_R_MIN: 44,
  LIGHT_R_MAX: 138,
  LIGHT_R_OFF: 15,
  STEALTH_SIGHT: 0.32,      // fener kapalıyken görülme çarpanı
  FLARE_BURN_MS: 6500,
  FLARE_LIGHT_R: 150
};

/* aletler: yakın dövüş + ateşli + işaret fişeği */

function mulberry(seed) {
  let s = seed >>> 0;
  return () => {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function levelSeed(mode, n) {
  return ((mode === 'story' ? 0x9E3779B9 : 0x85EBCA6B) ^ Math.imul(n, 2654435761)) >>> 0;
}

const SaveSystem = {
  KEY: 'shadowfall_araf_v2',
  data: null,
  defaults() {
    return {
      story:  { unlocked:1, introSeen:false, finished:false },
      action: { unlocked:1 },
      gear:   { melee:'fist', gun:'none', ammo:0, flares:0 },
      settings: { masterVolume:0.8, musicVolume:0.7, sfxVolume:1.0, haptics:true, reducedMotion:false, lang:'tr' }
    };
  },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const d = this.defaults(), p = JSON.parse(raw);
        this.data = Object.assign(d, p);
        this.data.story = Object.assign(d.story, p.story || {});
        this.data.action = Object.assign(d.action, p.action || {});
        this.data.gear = Object.assign(d.gear, p.gear || {});
        this.data.settings = Object.assign(d.settings, p.settings || {});
      } else this.data = this.defaults();
    } catch (e) { this.data = this.defaults(); }
    I18N.lang = this.data.settings.lang || 'tr';
    return this.data;
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {} },
  erase() {
    try { localStorage.removeItem(this.KEY); } catch (e) {}
    const lang = this.data.settings.lang;
    this.data = this.defaults();
    this.data.settings.lang = lang;
  },
  maxLevel(mode) { return mode === 'story' ? 100 : 1000; },
  unlocked(mode) { return this.data[mode].unlocked; },
  completeLevel(mode, n) {
    const max = this.maxLevel(mode);
    if (n >= this.data[mode].unlocked && n < max) this.data[mode].unlocked = n + 1;
    if (mode === 'story' && n === 100) this.data.story.finished = true;
    this.save();
  }
};
SaveSystem.load();

<script>
/* ========================= SES YÖNETİCİSİ =========================
   Tamamı Web Audio API. v3: zıplama sesi YOK — hareket sessiz,
   yalnızca darbeler/silahlar/yaratıklar konuşur. Katmanlı, gerçekçi
   vuruş sesleri (tok + çatırtı + gövde rezonansı).
   ================================================================== */

const AudioManager = {
  ctx:null, master:null, musicBus:null, sfxBus:null,
  ambientNodes:[], ambientTimers:[], humOsc:null, humGain:null,
  heartbeatTimer:null, started:false, ambientKey:'',

  start() {
    if (this.started) return;
    this.started = true;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new Ctx();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.master = this.ctx.createGain();
    this.musicBus = this.ctx.createGain();
    this.sfxBus = this.ctx.createGain();
    this.musicBus.connect(this.master);
    this.sfxBus.connect(this.master);
    this.master.connect(this.ctx.destination);
    this.applyVolumes();
    this.humOsc = this.ctx.createOscillator();
    this.humOsc.type = 'sine';
    this.humOsc.frequency.value = 58;
    this.humGain = this.ctx.createGain();
    this.humGain.gain.value = 0;
    this.humOsc.connect(this.humGain).connect(this.sfxBus);
    this.humOsc.start();
  },

  applyVolumes() {
    if (!this.started) return;
    const s = SaveSystem.data.settings;
    this.master.gain.value = s.masterVolume;
    this.musicBus.gain.value = s.musicVolume;
    this.sfxBus.gain.value = s.sfxVolume;
  },

  now() { return this.ctx ? this.ctx.currentTime : 0; },

  tone(freq, dur, { type='sine', vol=0.1, bus=null, slideTo=null, delay=0 } = {}) {
    if (!this.started) return;
    const t0 = this.now() + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1), t0+dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + Math.min(0.015, dur*0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g).connect(bus || this.sfxBus);
    osc.start(t0); osc.stop(t0+dur+0.05);
  },

  noiseBuffer(seconds) {
    const len = Math.floor(this.ctx.sampleRate * seconds);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return buf;
  },

  noiseHit(dur, { freq=1000, q=1, vol=0.08, delay=0, type='bandpass', slideTo=null } = {}) {
    if (!this.started) return;
    const t0 = this.now() + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer(dur+0.05);
    const f = this.ctx.createBiquadFilter();
    f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (slideTo !== null) f.frequency.exponentialRampToValueAtTime(Math.max(slideTo,20), t0+dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f).connect(g).connect(this.sfxBus);
    src.start(t0); src.stop(t0+dur+0.05);
  },

  rnd(a,b) { return a + Math.random()*(b-a); },

  /* --- hareket: yalnızca temaslar --- */
  footstep()  { this.noiseHit(0.045, { freq:this.rnd(340,460), q:1.5, vol:0.016 }); },
  landSoft()  { this.tone(this.rnd(130,160), 0.05, { vol:0.035, slideTo:85 }); },
  landHard()  {
    this.tone(95, 0.11, { vol:0.1, slideTo:48 });
    this.noiseHit(0.09, { freq:240, q:0.8, vol:0.05, type:'lowpass' });
  },

  /* --- yakın dövüş: savruluş + katmanlı darbeler --- */
  whoosh() { this.noiseHit(0.12, { freq:1400, q:0.5, vol:0.035, slideTo:500 }); },
  hitFlesh() {
    this.tone(this.rnd(85,105), 0.12, { vol:0.1, slideTo:55 });
    this.noiseHit(0.07, { freq:600, q:1, vol:0.06 });
    this.noiseHit(0.05, { freq:2200, q:0.8, vol:0.02, delay:0.005 });
  },
  hitBat() {
    this.noiseHit(0.04, { freq:this.rnd(1100,1400), q:2.2, vol:0.09 });   // ahşap çatırtı
    this.tone(72, 0.16, { vol:0.12, slideTo:42 });                        // gövde
    this.noiseHit(0.1, { freq:300, q:0.7, vol:0.05, type:'lowpass' });
  },
  hitMachete() {
    this.noiseHit(0.07, { freq:3400, q:0.6, vol:0.06, slideTo:900 });     // keskin dilim
    this.tone(110, 0.09, { vol:0.07, slideTo:60 });
    this.noiseHit(0.09, { freq:500, q:1, vol:0.05, delay:0.01 });
  },

  /* --- ateşli silahlar --- */
  pistol() {
    const p = this.rnd(0.95, 1.05);
    this.noiseHit(0.05, { freq:3200*p, q:0.4, vol:0.12 });                // patlama çatlağı
    this.tone(120*p, 0.1, { vol:0.12, slideTo:50 });                      // gövde tok sesi
    this.noiseHit(0.18, { freq:700, q:0.6, vol:0.03, slideTo:200, delay:0.02 }); // kuyruk
  },
  shotgun() {
    this.noiseHit(0.09, { freq:2400, q:0.3, vol:0.16 });
    this.tone(58, 0.22, { vol:0.18, slideTo:30 });
    this.noiseHit(0.35, { freq:500, q:0.5, vol:0.05, slideTo:120, delay:0.03 });
  },
  dryFire() { this.tone(900, 0.03, { type:'square', vol:0.025 }); },

  /* --- fişek --- */
  flareThrow() { this.noiseHit(0.16, { freq:900, q:0.6, vol:0.04, slideTo:2200 }); },
  flareBurn()  {
    this.noiseHit(0.5, { freq:2600, q:0.4, vol:0.04 });
    this.tone(440, 0.3, { type:'triangle', vol:0.025, slideTo:660 });
  },

  /* --- yaratıklar --- */
  growl() {
    this.tone(this.rnd(52,64), 0.7, { type:'sawtooth', vol:0.05, slideTo:34 });
    this.noiseHit(0.5, { freq:220, q:0.8, vol:0.03, type:'lowpass' });
  },
  screech() {
    this.tone(this.rnd(900,1200), 0.35, { type:'sawtooth', vol:0.04, slideTo:2400 });
    this.noiseHit(0.3, { freq:2800, q:1.2, vol:0.03 });
  },
  gurgle() {
    this.tone(90, 0.4, { type:'sawtooth', vol:0.04, slideTo:60 });
    this.noiseHit(0.4, { freq:300, q:2.4, vol:0.04, slideTo:140 });
  },
  explode() {
    this.tone(50, 0.5, { vol:0.18, slideTo:26 });
    this.noiseHit(0.4, { freq:900, q:0.4, vol:0.12, slideTo:150 });
  },
  enemyHit()  { this.tone(this.rnd(220,280), 0.08, { type:'square', vol:0.04, slideTo:140 }); },
  enemyDie()  { this.tone(200, 0.5, { type:'sawtooth', vol:0.05, slideTo:40 }); this.noiseHit(0.3, { freq:400, q:1, vol:0.04 }); },
  enemyShoot() {
    this.noiseHit(0.06, { freq:2600, q:0.5, vol:0.09 });
    this.tone(140, 0.08, { type:'sawtooth', vol:0.05, slideTo:60 });
  },

  /* --- oyuncu --- */
  hurt()  { this.tone(220, 0.18, { type:'sawtooth', vol:0.05, slideTo:90 }); this.noiseHit(0.12, { freq:500, q:1, vol:0.05 }); },
  death() { this.tone(80, 2.0, { vol:0.1, slideTo:40 }); },

  /* --- dünya --- */
  heart()   { [523.3,659.3,784.0].forEach((f,i)=>this.tone(f,0.3,{type:'triangle',vol:0.05-i*0.01,delay:i*0.08})); },
  battery() { this.tone(330,0.07,{type:'square',vol:0.03}); this.tone(660,0.09,{type:'square',vol:0.03,delay:0.08}); this.tone(990,0.14,{type:'triangle',vol:0.04,delay:0.16}); },
  searchTick() { this.tone(500, 0.03, { type:'triangle', vol:0.02 }); },
  chestOpen() {
    this.tone(90, 0.4, { vol:0.07, slideTo:60 });
    this.noiseHit(0.25, { freq:300, q:1, vol:0.04, delay:0.05 });
    this.tone(880, 0.5, { type:'triangle', vol:0.04, delay:0.3 });
  },
  weaponFound() { [392,523.3,659.3,784].forEach((f,i)=>this.tone(f,0.3,{vol:0.05,delay:i*0.1})); },
  checkpoint() { [261.6,329.6,392.0,523.3].forEach((f,i)=>this.tone(f,0.32,{vol:0.05,delay:i*0.15})); },
  gate()       { [261.6,392.0,523.3,784.0].forEach((f,i)=>this.tone(f,0.5,{type:'triangle',vol:0.05,delay:i*0.12})); },
  uiTick()    { this.tone(600, 0.04, { type:'triangle', vol:0.03 }); },
  uiConfirm() { this.tone(500, 0.06, { vol:0.04 }); this.tone(700, 0.06, { vol:0.04, delay:0.07 }); },
  chime()     { this.tone(1500, 0.3, { vol:0.02 }); },

  /* --- bosslar --- */
  bossRoar() {
    this.tone(70, 1.6, { type:'sawtooth', vol:0.12, slideTo:28 });
    this.noiseHit(1.2, { freq:160, q:0.6, vol:0.08, type:'lowpass' });
  },
  golemStomp() {
    this.tone(48, 0.4, { vol:0.16, slideTo:24 });
    this.noiseHit(0.3, { freq:200, q:0.5, vol:0.09, type:'lowpass' });
  },
  choirScream() {
    [392, 415, 466, 932].forEach((f,i) =>
      this.tone(f, 1.1, { type:'sawtooth', vol:0.018, slideTo:f*1.4, delay:i*0.04 }));
    this.noiseHit(0.9, { freq:1800, q:2, vol:0.025 });
  },
  deepPulse() {
    this.tone(36, 0.5, { vol:0.14, slideTo:22 });
  },
  tentacleSlam() {
    this.tone(60, 0.4, { vol:0.13, slideTo:30 });
    this.noiseHit(0.35, { freq:240, q:0.7, vol:0.08, type:'lowpass' });
  },
  splash() { this.noiseHit(0.5, { freq:700, q:0.5, vol:0.06 }); },
  whisper() {
    this.noiseHit(0.7, { freq:this.rnd(1200,2200), q:3, vol:0.02, slideTo:this.rnd(800,1600) });
  },
  hugBloom() {
    [261.6,329.6,392.0,523.3,659.3,784.0].forEach((f,i)=>this.tone(f,1.6,{type:'triangle',vol:0.035,delay:i*0.22,bus:this.musicBus}));
  },

  setHumLevel(level) {
    if (!this.started || !this.humGain) return;
    const target = Math.max(0, Math.min(1, level)) * 0.05;
    this.humGain.gain.setTargetAtTime(target, this.now(), 0.12);
  },

  setHeartbeat(active) {
    if (!this.started) return;
    if (active && !this.heartbeatTimer) {
      const beat = () => {
        this.tone(120, 0.09, { vol:0.07, slideTo:70 });
        this.tone(110, 0.08, { vol:0.05, slideTo:65, delay:0.18 });
      };
      beat();
      this.heartbeatTimer = setInterval(beat, 1100);
    } else if (!active && this.heartbeatTimer) {
      clearInterval(this.heartbeatTimer);
      this.heartbeatTimer = null;
    }
  },

  stopAmbient() {
    for (const n of this.ambientNodes) { try { n.stop ? n.stop() : n.disconnect(); } catch (e) {} }
    for (const t of this.ambientTimers) clearInterval(t);
    this.ambientNodes = []; this.ambientTimers = [];
    this.ambientKey = '';
  },

  setAmbience(mode, levelN) {
    if (!this.started) return;
    const band = Math.min(9, Math.floor((levelN-1) / (mode==='story'?10:100)));
    const key = mode + '_' + band;
    if (this.ambientKey === key && this.ambientNodes.length) return;
    this.stopAmbient();
    this.ambientKey = key;
    const ctx = this.ctx, t0 = this.now();

    const addDrone = (freq, vol, lfoFreq) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      const g = ctx.createGain(); g.gain.value = vol;
      const lfo = ctx.createOscillator(); lfo.frequency.value = lfoFreq;
      const lfoG = ctx.createGain(); lfoG.gain.value = vol*0.45;
      lfo.connect(lfoG).connect(g.gain);
      osc.connect(g).connect(this.musicBus);
      osc.start(t0); lfo.start(t0);
      this.ambientNodes.push(osc, lfo, g);
    };
    addDrone(54 - band*2.2, 0.05, 0.022);
    addDrone(108 - band*4, 0.015, 0.04);

    /* Araf rüzgârı — nefes alan alçak gürültü */
    const wind = ctx.createBufferSource();
    wind.buffer = this.noiseBuffer(4); wind.loop = true;
    const wf = ctx.createBiquadFilter();
    wf.type = 'lowpass'; wf.frequency.value = 300 - band*10; wf.Q.value = 0.5;
    const wg = ctx.createGain(); wg.gain.value = 0.035;
    const wLfo = ctx.createOscillator(); wLfo.frequency.value = 0.06;
    const wLfoG = ctx.createGain(); wLfoG.gain.value = 160;
    wLfo.connect(wLfoG).connect(wf.frequency);
    const wLfo2 = ctx.createOscillator(); wLfo2.frequency.value = 0.045;
    const wLfo2G = ctx.createGain(); wLfo2G.gain.value = 0.015;
    wLfo2.connect(wLfo2G).connect(wg.gain);
    wind.connect(wf).connect(wg).connect(this.musicBus);
    wind.start(t0); wLfo.start(t0); wLfo2.start(t0);
    this.ambientNodes.push(wind, wg, wLfo, wLfo2);

    /* uzak çan */
    this.ambientTimers.push(setInterval(() => {
      if (Math.random() < 0.45) {
        const f = (392 - band*12) + Math.floor(Math.random()*3) * 65;
        this.tone(f, 3.2, { type:'sine', vol:0.013, bus:this.musicBus });
        this.tone(f*1.5, 2.4, { type:'sine', vol:0.006, bus:this.musicBus, delay:0.02 });
      }
    }, 11000));

    /* soluk koro — derinleştikçe daha sık */
    this.ambientTimers.push(setInterval(() => {
      if (Math.random() < 0.35 + band*0.05) {
        const f = 180 + Math.random()*70 - band*6;
        this.tone(f, 4.5, { vol:0.012, bus:this.musicBus });
        this.tone(f+1.7, 4.5, { vol:0.012, bus:this.musicBus });
      }
    }, 14000 - band*600));

    if (mode === 'action') {
      this.ambientTimers.push(setInterval(() => {
        this.tone(46, 0.18, { vol:0.05, slideTo:30, bus:this.musicBus });
      }, 1400));
    }
  }
};

const Input = {
  tLeft:false, tRight:false, tJump:false, tAction:false,
  evToggleLantern:0, evFlare:0
};

function bindButton(id, prop) {
  const el = document.getElementById(id);
  const on = (e) => { e.preventDefault(); Input[prop] = true; el.classList.add('active'); };
  const off = (e) => { e.preventDefault(); if (!Input[prop]) return; Input[prop] = false; el.classList.remove('active'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
bindButton('btn-left', 'tLeft');
bindButton('btn-right', 'tRight');
bindButton('btn-jump', 'tJump');
bindButton('btn-action', 'tAction');

/* fener butonu: dokun = aç/kapat · basılı tut (450ms) = fişek at */
(() => {
  const el = document.getElementById('btn-lantern');
  let holdTimer = null, held = false;
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    held = false;
    el.classList.add('active');
    holdTimer = setTimeout(() => { held = true; Input.evFlare++; }, 450);
  });
  const end = (e) => {
    e.preventDefault();
    el.classList.remove('active');
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (!held) Input.evToggleLantern++;
    held = false;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
})();

/* yukarı kaydırma = zıpla */
(() => {
  const area = document.getElementById('game-container');
  let startY = 0, startT = 0, tracking = false;
  area.addEventListener('pointerdown', (e) => { tracking = true; startY = e.clientY; startT = performance.now(); });
  area.addEventListener('pointerup', (e) => {
    if (!tracking) return;
    tracking = false;
    if (startY - e.clientY > 40 && performance.now() - startT < 300) {
      Input.tJump = true;
      setTimeout(() => { Input.tJump = false; }, 120);
    }
  });
  area.addEventListener('pointercancel', () => { tracking = false; });
})();

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.key === 'f' || e.key === 'F') Input.evToggleLantern++;
  if (e.key === 'q' || e.key === 'Q') Input.evFlare++;
});

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ========================= ARAYÜZ DENETİMİ ======================== */

window.gameState = 'menu';

const UI = {
  el(id) { return document.getElementById(id); },

  optionsReturnTo:'menu', levelsMode:'story', levelsPage:0,
  currentMode:'story', currentLevel:1,
  monologueTimer:null, monoDelayTimer:null, cardTimer:null, toastTimer:null, warnTimer:null,
  PAGE_SIZE: 30,

  setState(s) {
    window.gameState = s;
    const inPlay = s === 'play';
    this.el('controls').style.display = ((inPlay || s === 'cutscene') && isTouch) ? 'flex' : 'none';
    this.el('kb-hint').style.display = (inPlay && !isTouch) ? 'block' : 'none';
    this.el('pause-btn').style.display = inPlay ? 'flex' : 'none';
    const hud = inPlay ? 'flex' : 'none';
    this.el('hud-hearts').style.display = hud;
    this.el('hud-battery').style.display = hud;
    this.el('hud-weapon').style.display = hud;
    this.el('hud-level').style.display = inPlay ? 'block' : 'none';
    if (!inPlay) { this.el('boss-bar').style.display = 'none'; this.el('aware-bar').style.display = 'none'; }
    document.body.classList.toggle('cinema', s === 'cutscene');
    this.el('cine-skip').style.display = s === 'cutscene' ? 'block' : 'none';
    if (s !== 'cutscene') this.subHide();
  },

  show(id) { this.el(id).classList.add('visible'); },
  hide(id) { this.el(id).classList.remove('visible'); },
  hideAllOverlays() {
    ['menu','levels-panel','options-panel','pause-panel'].forEach((id) => this.hide(id));
  },

  scene() {
    try { return window.game.scene.getScene('GameScene'); } catch (e) { return null; }
  },

  showMenu() {
    this.hideAllOverlays();
    this.setState('menu');
    this.show('menu');
    const sc = this.scene();
    if (sc) sc.enterAttract();
  },

  /* ---------- bölüm seçme ---------- */
  isBossLevel(mode, n) {
    return mode === 'story' ? [20,50,80,100].includes(n) : (n % 50 === 0);
  },

  openLevels(mode) {
    this.levelsMode = mode;
    this.levelsPage = Math.floor((SaveSystem.unlocked(mode) - 1) / this.PAGE_SIZE);
    this.renderLevels();
    this.hide('menu');
    this.show('levels-panel');
    this.setState('levels');
  },

  renderLevels() {
    const mode = this.levelsMode;
    const max = SaveSystem.maxLevel(mode);
    const unlocked = SaveSystem.unlocked(mode);
    const pages = Math.ceil(max / this.PAGE_SIZE);
    this.levelsPage = Math.max(0, Math.min(pages-1, this.levelsPage));
    const start = this.levelsPage * this.PAGE_SIZE;

    this.el('levels-title').textContent = T(mode === 'story' ? 'panel_story' : 'panel_action');
    this.el('levels-sub').textContent =
      T(mode === 'story' ? 'levels_sub_story' : 'levels_sub_action') + ' · ' + T('unlocked') + ': ' + unlocked;
    this.el('pg-label').textContent = T('page') + ' ' + (this.levelsPage+1) + ' / ' + pages;
    this.el('pg-prev').disabled = this.levelsPage === 0;
    this.el('pg-next').disabled = this.levelsPage >= pages-1;

    const grid = this.el('levels-grid');
    grid.innerHTML = '';
    for (let i = start+1; i <= Math.min(start+this.PAGE_SIZE, max); i++) {
      const b = document.createElement('button');
      b.className = 'lvl-btn';
      b.textContent = this.isBossLevel(mode, i) ? '☠' + i : i;
      if (this.isBossLevel(mode, i)) b.classList.add('boss');
      if (i < unlocked) b.classList.add('done');
      else if (i === unlocked) b.classList.add('current');
      else b.classList.add('locked');
      if (i <= unlocked) {
        b.addEventListener('click', () => { AudioManager.uiConfirm(); this.startLevel(mode, i); });
      }
      grid.appendChild(b);
    }
  },

  /* ---------- akış ---------- */
  startLevel(mode, n) {
    this.hideAllOverlays();
    this.currentMode = mode;
    this.currentLevel = n;
    this.setState('transition');
    this.fadeToBlack(() => {
      const sc = this.scene();
      if (sc) sc.scene.restart({ mode, level:n, attract:false });
    }, 350);
  },

  levelReady(scene) {
    if (scene.attract) return;
    AudioManager.setAmbience(scene.mode, scene.levelN);
    if (scene.mode === 'story' && scene.levelN === 1 && !SaveSystem.data.story.introSeen) {
      this.setState('cutscene');
      scene.runIntroCutscene();
      return;
    }
    const beat = scene.mode === 'story' && scene.levelN % 10 === 0 && scene.levelN < 100
      ? I18N.beat(scene.levelN) : null;
    if (beat) {
      this.setState('cutscene');
      scene.runBeatCutscene(beat);
      return;
    }
    this.beginPlay(scene);
  },

  beginPlay(scene) {
    this.setState('play');
    scene.beginPlay();
    const card = this.el('level-card');
    card.querySelector('.lc-num').textContent =
      T(scene.mode === 'story' ? 'mode_story' : 'mode_action') + ' · ' + T('level') + ' ' + scene.levelN;
    card.querySelector('.lc-name').textContent = this.levelName(scene.mode, scene.levelN);
    card.classList.add('show');
    clearTimeout(this.cardTimer);
    this.cardTimer = setTimeout(() => card.classList.remove('show'), 2800);

    /* boss bölümü uyarısı */
    if (scene.data0.boss) {
      const key = 'boss_warn_' + (scene.data0.boss.warnKey || '20');
      setTimeout(() => this.bossWarn(T('boss_warn_title'), T(key)), 3000);
    }
  },

  levelName(mode, n) {
    const names = I18N.arr('zone_names');
    if (mode === 'story' && n === 100) return T('b100');
    return names[Math.floor((n-1) / Math.ceil(SaveSystem.maxLevel(mode)/names.length)) % names.length];
  },

  levelComplete(mode, n) {
    SaveSystem.completeLevel(mode, n);
    AudioManager.gate();
    if (mode === 'story' && n === 100) return;
    this.toast(T('t_level_done', { n }));
    if (n < SaveSystem.maxLevel(mode)) this.startLevel(mode, n+1);
    else this.showMenu();
  },

  /* ---------- ayarlar ---------- */
  openOptions(returnTo) {
    this.optionsReturnTo = returnTo || 'menu';
    const s = SaveSystem.data.settings;
    this.el('opt-master').value = Math.round(s.masterVolume*100);
    this.el('opt-music').value = Math.round(s.musicVolume*100);
    this.el('opt-sfx').value = Math.round(s.sfxVolume*100);
    this.el('opt-haptics').classList.toggle('on', s.haptics);
    this.el('opt-reduced').classList.toggle('on', s.reducedMotion);
    this.resetEraseButton();
    this.hide('menu'); this.hide('pause-panel');
    this.show('options-panel');
    this.setState('options');
  },
  closeOptions() {
    SaveSystem.save();
    this.hide('options-panel');
    if (this.optionsReturnTo === 'pause') { this.show('pause-panel'); this.setState('paused'); }
    else this.showMenu();
  },
  resetEraseButton() {
    const b = this.el('btn-options-reset');
    b.textContent = T('opt_erase');
    b.dataset.confirm = '';
  },

  pause() {
    if (window.gameState !== 'play') return;
    this.setState('paused');
    this.show('pause-panel');
    const sc = this.scene();
    if (sc) sc.setPaused(true);
    AudioManager.uiTick();
  },
  resume() {
    this.hide('pause-panel');
    this.setState('play');
    const sc = this.scene();
    if (sc) sc.setPaused(false);
  },

  /* ---------- HUD ---------- */
  setHearts(cur, max) {
    const c = this.el('hud-hearts');
    if (c.childElementCount !== max) {
      c.innerHTML = '';
      for (let i=0;i<max;i++) c.appendChild(document.createElement('span'));
    }
    [...c.children].forEach((s,i) => { s.textContent = '♥'; s.classList.toggle('empty', i >= cur); });
  },
  popHeart(i) {
    const s = this.el('hud-hearts').children[i];
    if (!s) return;
    s.classList.add('pop');
    setTimeout(() => s.classList.remove('pop'), 200);
  },
  setBattery(pct, lanternOn) {
    const c = this.el('hud-battery');
    this.el('batt-fill').style.width = Math.max(0, Math.min(100, pct)) + '%';
    c.classList.toggle('low', lanternOn && pct > 0 && pct < 22);
    c.classList.toggle('dead', pct <= 0);
    c.classList.toggle('off', !lanternOn);
    document.getElementById('btn-lantern').classList.toggle('lit', lanternOn && pct > 0);
  },
  setGear(gear) {
    const icons = { fist:'👊', bat:'🏏', machete:'🔪', pistol:'🔫', shotgun:'💥' };
    const hasGun = gear.gun && gear.gun !== 'none';
    const main = hasGun ? gear.gun : gear.melee;
    this.el('hud-weapon').querySelector('.w-icon').textContent = icons[main] || '👊';
    let label = T('w_' + gear.melee);
    if (hasGun) label = T('w_' + gear.gun) + ' · ' + gear.ammo + '  /  ' + label;
    this.el('hud-weapon').querySelector('.w-label').textContent = label;
    const dot = document.querySelector('#btn-lantern .flare-dot');
    dot.style.display = gear.flares > 0 ? 'block' : 'none';
    dot.textContent = gear.flares;
  },
  setLevelLabel(mode, n) {
    this.el('hud-level').textContent = T(mode === 'story' ? 'mode_story' : 'mode_action') + ' · ' + n;
  },
  setBoss(pct, show, name) {
    const bar = this.el('boss-bar');
    bar.style.display = show ? 'block' : 'none';
    if (name) bar.querySelector('.b-name').textContent = name;
    this.el('boss-fill').style.width = Math.max(0, pct*100) + '%';
  },
  setAware(pct, hunting, show) {
    const bar = this.el('aware-bar');
    bar.style.display = show ? 'flex' : 'none';
    this.el('aware-fill').style.width = Math.max(0, Math.min(100, pct*100)) + '%';
    bar.classList.toggle('hunting', !!hunting);
  },
  setActionMode(search) {
    this.el('btn-action').classList.toggle('search-mode', !!search);
    this.el('btn-action').textContent = search ? '🔍' : '⚔';
  },

  /* ---------- metinler ---------- */
  showMonologue(text) {
    const el = this.el('monologue');
    el.textContent = text;
    el.classList.add('show');
    AudioManager.chime();
    clearTimeout(this.monologueTimer);
    this.monologueTimer = setTimeout(() => el.classList.remove('show'), 3800);
  },
  toast(text) {
    const t = this.el('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  },
  bossWarn(title, sub) {
    const w = this.el('boss-warn');
    w.querySelector('.bw-title').textContent = title;
    w.querySelector('.bw-sub').textContent = sub;
    w.classList.add('show');
    AudioManager.bossRoar();
    Haptics.boss();
    clearTimeout(this.warnTimer);
    this.warnTimer = setTimeout(() => w.classList.remove('show'), 4500);
  },
  sub(text) {
    const el = this.el('cine-sub');
    el.textContent = text;
    el.classList.add('show');
  },
  subHide() { this.el('cine-sub').classList.remove('show'); },

  fadeToBlack(cb, holdMs) {
    const f = this.el('fade');
    f.classList.add('dark');
    setTimeout(() => {
      if (cb) cb();
      setTimeout(() => f.classList.remove('dark'), 150);
    }, holdMs || 500);
  }
};

UI.el('opt-lang').addEventListener('click', () => {

  g.fillCircle(22,14,9);
  g.fillTriangle(10,54, 34,54, 22,18);
  g.fillStyle(0x1A1828,1);
  g.fillCircle(22,16,7);                              // eğik baş gölgesi
  g.fillStyle(0x2E2A48,1);
  g.fillTriangle(13,30, 18,26, 16,44);                // kanat/kol
  g.fillTriangle(31,30, 26,26, 28,44);
  g.generateTexture('statueTex',44,64);

  /* kırık sokak feneri (ortam ışığı) */
  g.clear();
  g.fillStyle(0x232038,1);
  g.fillRect(10,12,4,58);
  g.fillRect(4,68,16,5);
  g.fillRoundedRect(5,0,14,16,4);
  g.fillStyle(0xE8C97A,0.85);
  g.fillRect(8,4,8,9);
  g.generateTexture('lampTex',24,73);

  /* asılı kafes */
  g.clear();
  g.lineStyle(2,0x35304A,1);
  g.lineBetween(16,0,16,8);
  g.strokeEllipse(16,26,24,34);
  for (let i=0;i<4;i++) g.lineBetween(7+i*6,12, 9+i*6,42);
  g.fillStyle(0x35304A,1);
  g.fillEllipse(16,10,16,5); g.fillEllipse(16,42,18,5);
  g.generateTexture('cageTex',32,48);

  /* kemik yığını */
  g.clear();
  g.fillStyle(0x6B6478,0.9);
  g.fillEllipse(20,16,36,10);
  g.fillStyle(0x8F8AA0,0.85);
  g.fillRect(6,10,14,3); g.fillRect(22,12,12,2.5);
  g.fillCircle(30,8,5);
  g.fillStyle(0x0A0A14,1); g.fillCircle(28.5,7,1.5); g.fillCircle(32,7,1.5);
  g.generateTexture('bonesTex',42,20);

  /* dikilitaş */
  g.clear();
  g.fillStyle(0x232038,1);
  g.fillTriangle(4,80, 26,80, 15,0);
  g.fillStyle(0xD4C4F0,0.25);
  for (let i=0;i<5;i++) g.fillRect(12,14+i*13,6,2);
  g.generateTexture('obeliskTex',30,80);

  g.destroy();

  /* ---------- gradyanlar ---------- */
  const mkRadial = (key, size, stops) => {
    const t = scene.textures.createCanvas(key, size, size);
    const c = t.getContext();
    const gr = c.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    stops.forEach(([o,col]) => gr.addColorStop(o,col));
    c.fillStyle = gr; c.fillRect(0,0,size,size);
    t.refresh();
  };
  mkRadial('spotTex', 512, [
    [0,'rgba(255,255,255,1)'],[0.5,'rgba(255,255,255,1)'],
    [0.75,'rgba(255,255,255,0.4)'],[1,'rgba(255,255,255,0)']
  ]);
  mkRadial('glowTex', 256, [
    [0,'rgba(255,236,190,0.55)'],[0.25,'rgba(232,201,122,0.28)'],
    [0.6,'rgba(180,150,90,0.08)'],[1,'rgba(0,0,0,0)']
  ]);
  mkRadial('memGlowTex', 128, [
    [0,'rgba(212,196,240,0.5)'],[0.5,'rgba(212,196,240,0.16)'],[1,'rgba(212,196,240,0)']
  ]);
  mkRadial('warmGlowTex', 128, [
    [0,'rgba(232,201,122,0.5)'],[0.5,'rgba(232,201,122,0.14)'],[1,'rgba(232,201,122,0)']
  ]);
  mkRadial('redGlowTex', 128, [
    [0,'rgba(232,90,90,0.5)'],[0.5,'rgba(194,58,74,0.16)'],[1,'rgba(194,58,74,0)']
  ]);
  mkRadial('fogTex', 256, [
    [0,'rgba(150,140,180,0.16)'],[0.6,'rgba(150,140,180,0.06)'],[1,'rgba(150,140,180,0)']
  ]);
  mkRadial('eyeTex', 16, [
    [0,'rgba(255,200,120,1)'],[0.4,'rgba(255,160,80,0.8)'],[1,'rgba(255,120,60,0)']
  ]);

  const vig = scene.textures.createCanvas('vignetteTex',512,512);
  const vc = vig.getContext();
  const vg = vc.createRadialGradient(256,256,120,256,256,362);
  vg.addColorStop(0,'rgba(40,18,24,0)');
  vg.addColorStop(0.6,'rgba(40,18,24,0.3)');
  vg.addColorStop(1,'rgba(40,18,24,0.92)');
  vc.fillStyle = vg; vc.fillRect(0,0,512,512);
  vig.refresh();

  const sky = scene.textures.createCanvas('skyTex',32,720);
  const sc2 = sky.getContext();
  const sg = sc2.createLinearGradient(0,0,0,720);
  sg.addColorStop(0,'#110F20');
  sg.addColorStop(0.4,'#0C0B16');
  sg.addColorStop(0.75,'#09090F');
  sg.addColorStop(1,'#08080D');
  sc2.fillStyle = sg; sc2.fillRect(0,0,32,720);
  sky.refresh();

  const ecl = scene.textures.createCanvas('eclipseTex',240,240);
  const ec = ecl.getContext();
  const eg = ec.createRadialGradient(120,120,60,120,120,120);
  eg.addColorStop(0,'rgba(190,180,210,0)');
  eg.addColorStop(0.6,'rgba(190,180,210,0)');
  eg.addColorStop(0.7,'rgba(205,195,230,0.45)');
  eg.addColorStop(0.78,'rgba(190,180,210,0.14)');
  eg.addColorStop(1,'rgba(190,180,210,0)');
  ec.fillStyle = eg; ec.fillRect(0,0,240,240);
  // halo çizgileri
  ec.strokeStyle = 'rgba(190,180,210,0.08)';
  ec.lineWidth = 1;
  ec.beginPath(); ec.arc(120,120,104,0,Math.PI*2); ec.stroke();
  ecl.refresh();
}

/* ---------- 4 katmanlı Araf paralaksı ---------- */
function generateParallax(scene) {
  if (scene.textures.exists('bgRidge')) return;
  const g = scene.make.graphics({ add:false });

  /* en uzak: dağ silüetleri + asılı dev zincirler */
  g.clear();
  const r0 = mulberry(303);
  g.fillStyle(0x0C0C16,1);
  const pts = [{x:0,y:300}];
  let mx = 0, my = 180;
  while (mx < 1024) {
    mx += 70 + r0()*110;
    my = Math.max(60, Math.min(260, my + (r0()-0.5)*130));
    pts.push({ x:Math.min(mx,1024), y:my });
  }
  pts.push({x:1024,y:300});
  g.fillPoints(pts, true);
  g.lineStyle(1.5,0x12121E,1);
  for (let i=0;i<4;i++) {
    const cx = r0()*1024;
    g.beginPath();
    g.moveTo(cx, 0);
    for (let yy=0; yy<=120; yy+=12) g.lineTo(cx + Math.sin(yy*0.08+i)*6, yy);
    g.strokePath();
  }
  g.generateTexture('bgFar2',1024,300);

  /* uzak: yüzen adalar + sivri kuleler */
  g.clear();
  const r1 = mulberry(404);
  g.fillStyle(0x0F0F18,1);
  for (let i=0;i<7;i++) {
    const x = 40 + r1()*920, y = 60 + r1()*180;
    const w = 70 + r1()*150, h = 18 + r1()*26;
    g.fillEllipse(x,y,w,h);
    g.fillTriangle(x-w*0.2,y+h*0.3, x+w*0.2,y+h*0.3, x,y+h*0.3+30+r1()*50);
    if (r1() < 0.6) {
      const sx = x + (r1()-0.5)*w*0.5;
      g.fillRect(sx, y+h*0.3+8, 2, 16+r1()*22);
      g.fillEllipse(sx+1, y+h*0.3+30+r1()*16, 8+r1()*10, 6);
    }
    if (r1() < 0.5) {
      g.fillRect(x-2, y-h*0.3-12-r1()*16, 4, 12+r1()*16);   // ada üstü harabe
      g.fillRect(x-7, y-h*0.3-4, 14, 5);
    }
  }
  for (let i=0;i<10;i++) {
    const x = r1()*1024, h = 60+r1()*160, w = 8+r1()*18;
    g.fillTriangle(x,320, x+w,320, x+w/2,320-h);
  }
  g.generateTexture('bgRidge',1024,320);

  /* orta: ölü ağaçlar + kemik kemerler + çan kuleleri + asılı kafesler */
  g.clear();
  const r2 = mulberry(808);
  for (let i=0;i<11;i++) {
    const x = 30 + r2()*964, h = 160 + r2()*220;
    g.fillStyle(0x161625,1);
    g.fillTriangle(x-5,420, x+5,420, x+(r2()-0.5)*10,420-h);
    g.lineStyle(2.5,0x161625,1);
    for (let b=0;b<5;b++) {
      const by = 420-h*(0.4+r2()*0.55);
      const dir = r2()>0.5?1:-1, bl = 16+r2()*40;
      g.lineBetween(x,by, x+dir*bl, by-bl*(0.2+r2()*0.5));
      if (r2() < 0.35) {
        const ex = x+dir*bl;
        g.lineBetween(ex, by-bl*0.3, ex, by-bl*0.3+12);
        if (r2() < 0.4) { g.fillStyle(0x161625,1); g.fillEllipse(ex, by-bl*0.3+16, 7, 9); }
      }
    }
  }
  for (let i=0;i<3;i++) {
    const x = 100 + r2()*820, h = 130+r2()*80;
    g.lineStyle(8,0x161625,1);
    g.beginPath();
    g.arc(x, 420, h, Math.PI, 0, false);
    g.strokePath();
    g.fillStyle(0x161625,1);
    g.fillRect(x-h-4,420-30,8,30); g.fillRect(x+h-4,420-30,8,30);
  }
  for (let i=0;i<2;i++) {
    const x = 150 + r2()*700;
    g.fillStyle(0x161625,1);
    g.fillRect(x,420-260,34,260);
    g.fillTriangle(x-6,420-260, x+40,420-260, x+17,420-310);
    g.fillStyle(0x0A0A14,1);
    g.fillRect(x+10,420-250,14,20);
    g.fillStyle(0x161625,1);
    g.fillRect(x+15,420-228,4,10);   // çan ipi
  }
  g.generateTexture('bgMid',1024,420);

  /* yakın ön: sis bankı + mezar taşları + sazlar */
  g.clear();
  const r3 = mulberry(909);
  g.fillStyle(0x1B1B30,1);
  g.fillRect(0,110,1024,50);
  for (let i=0;i<8;i++) g.fillEllipse(r3()*1024,118,100+r3()*180,40+r3()*30);
  g.fillStyle(0x232038,1);
  for (let i=0;i<9;i++) {
    const x = r3()*1024, w = 14+r3()*12, h = 22+r3()*26;
    g.fillRoundedRect(x,112-h,w,h+10,4);
    if (r3() < 0.4) { g.fillRect(x+w/2-1.5, 104-h, 3, 8); g.fillRect(x+w/2-5, 106-h, 10, 3); }
  }
  g.lineStyle(2,0x232038,1);
  for (let i=0;i<40;i++) {
    const x = r3()*1024, h = 6+r3()*14;
    g.lineBetween(x,114, x+(r3()-0.5)*8, 114-h);
  }
  g.generateTexture('bgFore',1024,160);

  g.destroy();
}
</script>
<script>
/* ======================= BÖLÜM ÜRETİCİ v3 ========================== */

const GROUND_Y = 640;

function genLevel(mode, n) {
  const rnd = mulberry(levelSeed(mode, n));
  const story = mode === 'story';
  const d = story ? Math.pow(n/100, 0.85) : Math.min(1, 0.3 + 0.7*Math.pow(n/1000, 0.9));

  /* boss programı: hikâye 20/50/80/100 · aksiyon her 50 */
  let bossType = null;
  if (story) {
    if (n === 20) bossType = 'warden';
    else if (n === 50) bossType = 'choir';
    else if (n === 80) bossType = 'golem';
    else if (n === 100) bossType = 'deepone';
  } else if (n % 250 === 0) bossType = 'deepone';
  else if (n % 50 === 0) bossType = ['warden','choir','golem'][(n/50) % 3];

  const L = {
    mode, n, d,
    plats:[], oneways:[], movers:[], spikes:[], tentacles:[], props:[],
    enemies:[], pickups:[], chests:[], checkpoints:[],
    gate:null, boss:null, corridor:null,
    start:{ x:90, y:GROUND_Y-60 }, width:0
  };
  const safeSpots = [];
  const ground = (x,w) => {
    L.plats.push({ x, y:GROUND_Y, w, h:90 });
    for (let s = x+60; s < x+w-60; s += 90) safeSpots.push(s);
  };
  const addProp = (x) => {
    const roll = rnd();
    if (roll < 0.3) L.props.push({ tex:'statueTex', x, oy:-32 });
    else if (roll < 0.5) L.props.push({ tex:'lampTex', x, oy:-36, light:true });
    else if (roll < 0.68) L.props.push({ tex:'bonesTex', x, oy:-10 });
    else if (roll < 0.85) L.props.push({ tex:'obeliskTex', x, oy:-40 });
    else L.props.push({ tex:'cageTex', x, oy:-200-rnd()*80, hang:true });
  };

  /* düşman havuzu — bölüm ilerledikçe çeşitlenir */
  const pool = ['skitter'];
  if (story ? n>=4  : true) pool.push('wraith');
  if (story ? n>=7  : true) pool.push('stalker','stalker');
  if (story ? n>=12 : n>=2) pool.push('gunman');
  if (story ? n>=16 : n>=4) pool.push('leech');
  if (story ? n>=24 : n>=8) pool.push('bloater');
  if (!story) pool.push('gunman','stalker');
  const pickEnemy = () => pool[Math.floor(rnd()*pool.length)];

  /* uzunluk: 1. bölüm kısa → 100. bölüm devasa */
  const targetW = story
    ? Math.round(1500 + Math.pow(n, 1.18) * 38)
    : Math.round(2200 + Math.min(n,600) * 7);

  let x = 0;
  ground(0, 440);
  x = 440;
  let enemyBudget = Math.round(story ? 2 + n*0.22 : 6 + d*20);
  enemyBudget = Math.min(enemyBudget, 28);
  let chestBudget = 1 + Math.floor(targetW/2600) + (rnd()<0.4?1:0);
  const heartWant = 2 + Math.floor(d*2) + (rnd()<0.3?1:0);
  const battWant = Math.ceil(targetW / (1300 + d*450));
  const flareSpotWant = story && n >= 30 ? 1 + Math.floor(targetW/4000) : (story?0:1);
  let hearts = 0, batts = 0;

  const dropEnemy = (ex, ey, forceType) => {
    if (enemyBudget <= 0) return;
    enemyBudget--;
    L.enemies.push({ type: forceType || pickEnemy(), x:ex, y:ey });
  };

  const mainW = bossType ? Math.max(900, targetW - (bossType==='deepone' ? 3800 : 2200)) : targetW;

  while (x < mainW) {
    const roll = rnd();

    if (roll < 0.26) {
      /* düz koşu */
      const w = 300 + rnd()*280;
      ground(x, w);
      if (rnd() < 0.5) addProp(x + w*0.3 + rnd()*w*0.4);
      if (rnd() < 0.45 + d*0.45) dropEnemy(x+w*0.5, GROUND_Y-30);
      if (!story && rnd() < 0.4) dropEnemy(x+w*0.78, GROUND_Y-30);
      if (rnd() < 0.28 && hearts < heartWant) {
        L.oneways.push({ x:x+w*0.3, y:GROUND_Y-170, w:130 });
        L.pickups.push({ x:x+w*0.3+65, y:GROUND_Y-210, type:'heart' });
        hearts++;
      }
      x += w;

    } else if (roll < 0.44) {
      /* uçurum */
      const gw = Math.min(215, 95 + d*125 + rnd()*40);
      if (gw > 150 && rnd() < 0.5) {
        L.oneways.push({ x:x+gw/2-55, y:GROUND_Y-90-rnd()*60, w:110 });
      }
      if (rnd() < d*0.55 && (story ? n>=28 : n>=12)) {
        L.tentacles.push({ x:x+gw/2, y:GROUND_Y+80 });
      } else if (rnd() < 0.35) {
        L.enemies.push({ type:'wraith', x:x+gw/2, y:GROUND_Y-180 });
      }
      x += gw;
      const w = 220 + rnd()*200;
      ground(x, w);
      x += w;

    } else if (roll < 0.58) {
      /* diken şeridi */
      const w = 200 + rnd()*170;
      ground(x, w);
      L.spikes.push({ x:x+40, y:GROUND_Y, w:w-80 });
      L.oneways.push({ x:x+20, y:GROUND_Y-120, w:120 });
      L.oneways.push({ x:x+w-140, y:GROUND_Y-150-d*45, w:120 });
      if (rnd() < 0.5 && (story ? n>=16 : n>=4))
        L.enemies.push({ type:'leech', x:x+w/2, y:GROUND_Y-152-d*45, ceil:true });
      if (rnd() < 0.4 && batts < battWant) {
        L.pickups.push({ x:x+w/2, y:GROUND_Y-220, type:'battery' });
        L.oneways.push({ x:x+w/2-60, y:GROUND_Y-185, w:120 });
        batts++;
      }
      x += w;

    } else if (roll < 0.7) {
      /* kuleler — duvar zıplaması */
      const w = 380 + rnd()*180;
      ground(x, w);
      const px = x + 90;
      const towerH = 2 + Math.floor(rnd()*2);
      L.plats.push({ x:px, y:GROUND_Y-64*towerH, w:64, h:64*towerH });
      L.oneways.push({ x:px+130, y:GROUND_Y-100-towerH*40, w:120 });
      if (rnd() < 0.45 && (story ? n>=16 : true))
        L.enemies.push({ type:'leech', x:px+190, y:GROUND_Y-102-towerH*40, ceil:true });
      if (rnd() < 0.5) {
        L.pickups.push({
          x:px+190, y:GROUND_Y-150-towerH*40,
          type:(batts<battWant ? (batts++, 'battery') : (hearts<heartWant ? (hearts++,'heart') : 'battery'))
        });
      }
      if (rnd() < 0.4 + d*0.3) dropEnemy(x+w-110, GROUND_Y-30, rnd()<0.5?'stalker':undefined);
      x += w;

    } else if (roll < 0.78 && (story ? n>=14 : n>=5)) {
      /* hareketli platform geçidi */
      const gw = 260 + rnd()*120;
      L.movers.push({
        x: x+gw/2, y: GROUND_Y-80-rnd()*60,
        axis: rnd()<0.6 ? 'x' : 'y',
        range: 60+rnd()*50, speed: 0.9+rnd()*0.8+d*0.5
      });
      if (rnd() < 0.4) L.enemies.push({ type:'wraith', x:x+gw/2, y:GROUND_Y-220 });
      x += gw;
      const w = 240 + rnd()*160;
      ground(x, w);
      x += w;

    } else if (roll < 0.88 && chestBudget > 0) {
      /* gizli oyuk — sandık */
      const w = 300 + rnd()*140;
      ground(x, w);
      L.plats.push({ x:x+w*0.45, y:GROUND_Y-170, w:150, h:24 });
      L.chests.push({ x:x+w*0.45+75, y:GROUND_Y-15, loot:'random' });
      chestBudget--;
      if (rnd() < 0.5 + d*0.3) dropEnemy(x+w*0.2, GROUND_Y-30);
      x += w;

    } else {
      /* pusu arenası */
      const w = 420 + rnd()*220;
      ground(x, w);
      dropEnemy(x+w*0.3, GROUND_Y-30);
      if (d > 0.2) dropEnemy(x+w*0.55, GROUND_Y-30);
      if (d > 0.45) dropEnemy(x+w*0.75, GROUND_Y-30, rnd()<0.4?'bloater':undefined);
      if (!story && d > 0.5) dropEnemy(x+w*0.85, GROUND_Y-30, 'gunman');
      L.oneways.push({ x:x+w*0.4, y:GROUND_Y-160, w:150 });
      if (rnd() < 0.4) addProp(x+w*0.15);
      x += w;
    }
  }

  /* eksikleri tamamla */
  const spot = () => safeSpots[Math.floor(rnd()*safeSpots.length)];
  const farSpots = safeSpots.filter((sx) => sx > 650);
  const farSpot = () => farSpots.length ? farSpots[Math.floor(rnd()*farSpots.length)] : spot();
  while (batts < battWant && safeSpots.length) { L.pickups.push({ x:spot(), y:GROUND_Y-40, type:'battery' }); batts++; }
  while (hearts < heartWant && safeSpots.length) { L.pickups.push({ x:spot(), y:GROUND_Y-40, type:'heart' }); hearts++; }
  for (let i=0;i<flareSpotWant;i++) L.pickups.push({ x:farSpot(), y:GROUND_Y-40, type:'flare' });
  if (!L.chests.length && safeSpots.length) L.chests.push({ x:farSpot(), y:GROUND_Y-15, loot:'random' });
  const minEnemies = story ? Math.min(2 + Math.floor(n/8), 10) : 6 + Math.floor(d*6);
  while (L.enemies.length < minEnemies && farSpots.length) {
    L.enemies.push({ type:pickEnemy(), x:farSpot(), y:GROUND_Y-30 });
  }

  /* boss bölgesi */
  if (bossType) {
    if (bossType === 'deepone') {
      /* fısıltı koridoru: ışığını söndür, sessiz ol */
      const corStart = x;
      const corW = 1500;
      ground(x, corW);
      L.corridor = { x0:corStart, x1:corStart+corW };
      L.props.push({ tex:'lampTex', x:corStart+200, oy:-36, light:true });
      L.props.push({ tex:'statueTex', x:corStart+500, oy:-32 });
      L.props.push({ tex:'statueTex', x:corStart+560, oy:-32 });
      L.props.push({ tex:'cageTex', x:corStart+800, oy:-240, hang:true });
      L.props.push({ tex:'bonesTex', x:corStart+1000, oy:-10 });
      L.chests.push({ x:corStart+300, y:GROUND_Y-15, loot:'best' });
      L.pickups.push({ x:corStart+360, y:GROUND_Y-40, type:'battery' });
      L.pickups.push({ x:corStart+420, y:GROUND_Y-40, type:'heart' });
      L.pickups.push({ x:corStart+480, y:GROUND_Y-40, type:'flare' });
      L.pickups.push({ x:corStart+540, y:GROUND_Y-40, type:'flare' });
      L.checkpoints.push({ x:corStart+corW-160, y:GROUND_Y-23 });
      x += corW;
      const arenaW = 2300;
      ground(x, arenaW);
      L.oneways.push({ x:x+500, y:GROUND_Y-160, w:170 });
      L.oneways.push({ x:x+1100, y:GROUND_Y-220, w:170 });
      L.oneways.push({ x:x+1700, y:GROUND_Y-160, w:170 });
      L.boss = { type:'deepone', x:x+arenaW-420, hp: story ? 110 : 70, warnKey:'100' };
      x += arenaW;
    } else {
      ground(x, 600);
      L.chests.push({ x:x+260, y:GROUND_Y-15, loot:'best' });
      L.pickups.push({ x:x+380, y:GROUND_Y-40, type:'battery' });
      L.pickups.push({ x:x+440, y:GROUND_Y-40, type:'heart' });
      L.checkpoints.push({ x:x+520, y:GROUND_Y-23 });
      x += 600;
      const arenaW = 1600;
      ground(x, arenaW);
      L.oneways.push({ x:x+arenaW*0.3, y:GROUND_Y-170, w:170 });
      L.oneways.push({ x:x+arenaW*0.65, y:GROUND_Y-200, w:170 });
      const hps = { warden: 30+Math.round(d*10), choir: 44+Math.round(d*12), golem: 64+Math.round(d*14) };
      const warnKeys = { warden:'20', choir:'50', golem:'80' };
      L.boss = { type:bossType, x:x+arenaW-300, hp:hps[bossType], warnKey:warnKeys[bossType] };
      x += arenaW;
      L.gate = { x:x-130, y:GROUND_Y-70, hidden:true };
    }
  } else {
    ground(x, 420);
    L.gate = { x:x+300, y:GROUND_Y-70 };
    x += 420;
  }
  L.width = x;

  /* denetim taşları: uzun bölümlerde her ~2200px */
  const ckCount = Math.max(1, Math.floor(mainW / 2200));
  for (let i=1;i<=ckCount;i++) {
    const tx = mainW * i/(ckCount+1);
    let best = safeSpots[0] || 300;
    for (const s of safeSpots) if (Math.abs(s-tx) < Math.abs(best-tx)) best = s;
    L.checkpoints.push({ x:best, y:GROUND_Y-23 });
  }

  return L;
}

/* =========================== OYUN SAHNESİ ========================== */

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  init(data) {
    this.mode = (data && data.mode) || 'story';
    this.levelN = (data && data.level) || 1;
    this.attract = (data && 'attract' in data) ? !!data.attract : true;
  }

  create() {
    generateTextures(this);
    generateParallax(this);

    this.paused = false;
    this.playing = false;
    this.completing = false;
    this.cine = false;
    this.cineSkipped = false;
    this.cineWaiters = [];
    this.cineActors = [];
    this.cineRun = 0;
    this.lightBoost = 1;
    this.inkUntil = 0;
    this.flashUntil = 0;
    this.flashPos = { x:0, y:0 };
    this.flares = [];
    this.zone = zoneOf(this.mode, this.levelN);
    this.shakeSmall = () => this.cameras.main.shake(120, 0.004);

    this.data0 = genLevel(this.mode, this.levelN);
    const L = this.data0;

    this.physics.world.setBounds(0, -400, L.width, 1300);
    this.physics.world.setBoundsCollision(true, true, false, false);
    this.physics.world.gravity.y = PHYS.GRAVITY;

    this.buildParallax();
    this.buildLevel(L);
    this.setupKai(L);
    this.setupParticles();
    this.setupLighting();

    const cam = this.cameras.main;
    cam.setBounds(0, -60, L.width, 800);
    cam.startFollow(this.kai.spr, false, 0.1, 0.1);
    cam.setZoom(Math.max(0.6, this.scale.height / 720));
    this.scale.on('resize', this.onResize, this);
    this.events.once('shutdown', () => this.scale.off('resize', this.onResize, this));

    this.keys = this.input.keyboard.addKeys('A,D,W,S,LEFT,RIGHT,UP,DOWN,SPACE,J,E,K');

    if (this.data0.boss) this.createBoss(this.data0.boss);

    AudioManager.setHeartbeat(false);
    AudioManager.setHumLevel(0);

    if (this.attract) {
      cam.stopFollow();
      cam.centerOn(this.kai.spr.x + 80, GROUND_Y - 160);
    } else {
      UI.setLevelLabel(this.mode, this.levelN);
      UI.levelReady(this);
    }
  }

  onResize() {
    const cam = this.cameras.main;
    cam.setZoom(Math.max(0.6, this.scale.height / 720));
    if (this.darkRT) { this.darkRT.destroy(); this.darkRT = null; }
    if (this.vignette) { this.vignette.destroy(); this.vignette = null; }
    this.setupLighting();
  }

  /* ---------- paralaks (4 katman + palet) ---------- */
  buildParallax() {
    const W = 2200, z = this.zone;
    this.sky = this.add.image(0,0,'skyTex').setDisplaySize(W,760).setDepth(-13);
    this.eclipse = this.add.image(0,0,'eclipseTex').setDepth(-12).setAlpha(z.ecl);
    this.bgFar2 = this.add.tileSprite(0,0,W,300,'bgFar2').setDepth(-11).setTint(z.ridge).setAlpha(0.85);
    this.bgRidge = this.add.tileSprite(0,0,W,320,'bgRidge').setDepth(-10).setTint(z.ridge);
    this.bgMid   = this.add.tileSprite(0,0,W,420,'bgMid').setDepth(-9).setTint(z.mid);
    this.bgFore  = this.add.tileSprite(0,0,W,160,'bgFore').setDepth(-8).setTint(z.fore).setAlpha(0.92);
  }

  updateParallax() {
    const cam = this.cameras.main;
    const cx = cam.midPoint.x, cy = cam.midPoint.y;
    this.sky.setPosition(cx, cy);
    this.eclipse.setPosition(cx + 190 - cam.scrollX*0.035, cy - 195);
    this.bgFar2.setPosition(cx, cy - 80);
    this.bgFar2.tilePositionX = cam.scrollX * 0.06;
    this.bgRidge.setPosition(cx, cy - 26);
    this.bgRidge.tilePositionX = cam.scrollX * 0.13;
    this.bgMid.setPosition(cx, cy + 62);
    this.bgMid.tilePositionX = cam.scrollX * 0.3;
    this.bgFore.setPosition(cx, cy + 298);
    this.bgFore.tilePositionX = cam.scrollX * 0.55;
    if (this.ash) this.ash.setPosition(cx, cam.worldView.y - 10);
  }

  /* ---------- bölüm inşası ---------- */
  buildLevel(L) {
    this.solids = this.physics.add.staticGroup();
    this.onewayG = this.physics.add.staticGroup();
    this.spikeG = this.physics.add.staticGroup();
    this.pickupG = this.physics.add.staticGroup();
    this.enemyG = this.physics.add.group();
    this.pBullets = this.physics.add.group({ allowGravity:false });
    this.eBullets = this.physics.add.group({ allowGravity:false });
    this.lobbed = this.physics.add.group();           // kemik/kaya yayları
    this.enemies = [];
    this.tentacles = [];
    this.chests = [];
    this.envLights = [];
    this.movers = [];
    this.checkpoints = [];

    for (const p of L.plats) {
      const img = this.solids.create(p.x + p.w/2, p.y + p.h/2, 'platTex');
      img.setDisplaySize(p.w, p.h).refreshBody();
    }
    for (const o of L.oneways) {
      const img = this.onewayG.create(o.x + o.w/2, o.y + 7, 'onewayTex');
      img.setDisplaySize(o.w, 14).refreshBody();
      img.body.checkCollision.down = false;
      img.body.checkCollision.left = false;
      img.body.checkCollision.right = false;
    }
    for (const s of L.spikes) {
      const img = this.spikeG.create(s.x + s.w/2, s.y - 14, 'spikeTex');
      img.setDisplaySize(s.w, 28).refreshBody();
      img.body.setSize(s.w, 16); img.body.setOffset(0, 12);
    }
    for (const m of L.movers) {
      const img = this.physics.add.image(m.x, m.y, 'movTex');
      img.setDisplaySize(120, 18);
      img.body.setImmovable(true);
      img.body.allowGravity = false;
      img.setDepth(1);
      this.movers.push({ img, x0:m.x, y0:m.y, axis:m.axis, range:m.range, speed:m.speed, ph:Math.random()*6 });
    }
    for (const pr of L.props) this.spawnProp(pr);
    for (const t of L.tentacles) this.spawnTentacle(t.x, t.y);
    for (const pk of L.pickups) this.spawnPickup(pk.x, pk.y, pk.type);
    for (const c of L.chests) this.spawnChest(c.x, c.y, c.loot);
    for (const e of L.enemies) this.spawnEnemy(e.type, e.x, e.y, e);

    for (const ck of L.checkpoints) {
      const img = this.add.image(ck.x, ck.y, 'checkTex').setDepth(2).setAlpha(0.8);
      const glow = this.add.image(ck.x, ck.y-8, 'warmGlowTex').setDepth(3).setScale(0.6).setAlpha(0);
      this.checkpoints.push({ x:ck.x, y:ck.y, img, glow, active:false });
    }
    if (L.gate && !L.gate.hidden) this.spawnGate(L.gate.x, L.gate.y);
    this.respawnPoint = { x:L.start.x, y:L.start.y };

    /* koridor fısıltıları */
    this.whisperIdx = 0;
  }

  spawnProp(pr) {
    const y = pr.hang ? GROUND_Y + pr.oy : GROUND_Y + pr.oy;
    const img = this.add.image(pr.x, y, pr.tex).setDepth(pr.hang ? -2 : -1).setAlpha(0.92);
    if (pr.hang) {
      img.setOrigin(0.5, 0);
      this.tweens.add({ targets:img, angle:Phaser.Math.Between(-4,4), duration:2400+Math.random()*1200, yoyo:true, repeat:-1, ease:'Sine.inOut' });
    }
    if (pr.light) {
      const glow = this.add.image(pr.x, y-28, 'warmGlowTex').setDepth(3).setScale(0.9).setAlpha(0.5);
      this.tweens.add({ targets:glow, alpha:0.25, duration:160+Math.random()*220, yoyo:true, repeat:-1 });
      this.envLights.push({ img:{ x:pr.x, y:y-28 }, r:70 });
    }
  }

  spawnGate(x, y) {
    this.gate = this.add.image(x, y, 'gateTex').setDepth(2);
    this.gateGlow = this.add.image(x, y, 'memGlowTex').setDepth(3).setScale(2.2).setAlpha(0.6);
    this.tweens.add({ targets:this.gateGlow, alpha:0.95, scale:2.6, duration:1400, yoyo:true, repeat:-1 });
    this.envLights.push({ img:this.gate, r:110 });
    this.gateZone = this.add.zone(x, y+20, 70, 130);
    this.physics.add.existing(this.gateZone, true);
  }

  spawnPickup(x, y, type) {
    const keys = { heart:'heartTex', battery:'battTex', flare:'flareTex' };
    const img = this.pickupG.create(x, y, keys[type] || 'battTex');
    img.setData('type', type);
    img.body.setSize(34, 40);
    if (type === 'flare') img.setScale(1.4);
    const glowKey = type === 'heart' ? 'redGlowTex' : (type === 'flare' ? 'redGlowTex' : 'memGlowTex');
    const glow = this.add.image(x, y, glowKey).setDepth(1).setScale(0.55).setAlpha(0.7);
    img.setData('glow', glow).setDepth(2);
    this.tweens.add({ targets:[img, glow], y:y-5, duration:1000+Math.random()*400, yoyo:true, repeat:-1, ease:'Sine.inOut' });
  }

  spawnChest(x, y, loot) {
    const img = this.add.image(x, y, 'chestTex').setDepth(2).setAlpha(0.5);
    this.chests.push({ x, y, img, loot, opened:false, glintT:0 });
  }

  /* ---------- Kai ---------- */
  setupKai(L) {
    const spr = this.physics.add.sprite(L.start.x, L.start.y, 'pxTex');
    spr.setVisible(false);
    spr.body.setSize(24, 46);
    spr.body.setMaxVelocity(420, PHYS.MAX_FALL);
    spr.setCollideWorldBounds(true);

    const gear = SaveSystem.data.gear;
    this.kai = {
      spr, facing:1, hearts:BAL.START_HEARTS, maxHearts:BAL.MAX_HEARTS,
      battery:BAL.BATT_START, lanternOn:true,
      melee:gear.melee, gun:gear.gun, ammo:gear.ammo, flares:gear.flares,
      noise:0,
      coyoteUntil:0, bufferUntil:0, airJumps:1, wallLockUntil:0, wallDir:0, wallCoyoteUntil:0,
      prevJump:false, prevAction:false, attackCd:0, searchMs:0, nearChest:null,
      iframesUntil:0, recoverUntil:0, dead:false, phase:0, squash:1, lean:0, stepAcc:0,
      wasOnGround:true, fallPeak:0, hugging:false, hidden:false,
      lanAng:0, lanVel:0, prevVx:0,
      scarf:null
    };
    /* atkı verlet zinciri */
    const sp = [];
    for (let i=0;i<6;i++) sp.push({ x:spr.x, y:spr.y, px:spr.x, py:spr.y });
    this.kai.scarf = sp;

    this.kaiGfx = this.add.graphics().setDepth(10);
    this.lanternGlow = this.add.image(spr.x, spr.y, 'glowTex').setDepth(12).setBlendMode(Phaser.BlendModes.ADD);
    this.swingGfx = this.add.graphics().setDepth(11);
    this.searchGfx = this.add.graphics().setDepth(56);
    this.laserGfx = this.add.graphics().setDepth(7);
    this.eyeGfx = this.add.graphics().setDepth(52);
    this.trailGfx = this.add.graphics().setDepth(4);

    this.physics.add.collider(spr, this.solids);
    this.physics.add.collider(spr, this.onewayG);
    for (const m of this.movers) this.physics.add.collider(spr, m.img);
    this.physics.add.collider(this.enemyG, this.solids);
    this.physics.add.collider(this.lobbed, this.solids, (o) => this.lobLand(o));
    this.physics.add.collider(this.pBullets, this.solids, (b) => this.popBullet(b));
    this.physics.add.collider(this.eBullets, this.solids, (b) => this.popBullet(b));
    this.physics.add.overlap(spr, this.spikeG, () => this.damageKai(1, spr.x, true));
    this.physics.add.overlap(spr, this.pickupG, (_s, p) => this.collectPickup(p));
    this.physics.add.overlap(this.pBullets, this.enemyG, (b, eSpr) => {
      const e = eSpr.getData('e');
      if (e && e.alive) { this.popBullet(b); this.hitEnemy(e, b.getData('dmg') || 2, b.x); }
    });
    this.physics.add.overlap(spr, this.eBullets, (_s, b) => {
      this.popBullet(b);
      this.damageKai(1, b.x < spr.x ? spr.x-40 : spr.x+40);
    });
  }

  popBullet(b) {
    if (!b.active) return;
    this.burstWhite.explode(3, b.x, b.y);
    b.destroy();
  }

  /* ---------- parçacıklar ---------- */
  setupParticles() {
    const mk = (tint, extra) => this.add.particles(0, 0, 'pxTex', Object.assign({
      speed:{ min:40, max:170 }, lifespan:500, scale:{ start:1.4, end:0 },
      gravityY:240, emitting:false, tint
    }, extra || {})).setDepth(13);
    this.burstWarm  = mk(0xE8C97A);
    this.burstRed   = mk(0xE84A5F);
    this.burstWhite = mk(0xF0E8FF, { gravityY:60 });
    this.burstDark  = mk(0x232038, { gravityY:-30, speed:{min:15,max:60}, lifespan:700 });
    this.burstGreen = mk(0x9CC44A, { gravityY:120, speed:{min:60,max:240}, lifespan:600 });
    this.burstBone  = mk(0xBDB4A4, { gravityY:400, speed:{min:80,max:260}, lifespan:700 });

    this.ash = this.add.particles(0, 0, 'pxTex', {
      x:{ min:-900, max:900 }, y:-30,
      lifespan:7000, speedY:{ min:16, max:46 }, speedX:{ min:-14, max:10 },
      scale:{ start:0.8, end:0.3 }, alpha:{ start:0.4, end:0 },
      quantity:1, frequency:130, tint:0x6B6478
    }).setDepth(14);

    this.fogs = [];
    const rnd = mulberry(levelSeed(this.mode, this.levelN) ^ 0x55AA);
    for (let i=0; i<7; i++) {
      const f = this.add.image(rnd()*this.data0.width, 360+rnd()*260, 'fogTex')
        .setDepth(40).setScale(3.5+rnd()*3).setAlpha(0.5).setTint(this.zone.fog);
      this.tweens.add({ targets:f, x:f.x+(rnd()-0.5)*220, duration:9000+rnd()*8000, yoyo:true, repeat:-1, ease:'Sine.inOut' });
      this.fogs.push(f);
    }
    /* ateşböcekleri — loş yaşam kıvılcımları */
    for (let i=0; i<5; i++) {
      const fx = rnd()*this.data0.width, fy = 300+rnd()*280;
      const fly = this.add.image(fx, fy, 'eyeTex').setDepth(42).setScale(0.5).setAlpha(0);
      this.tweens.add({ targets:fly, alpha:0.5, duration:900+rnd()*900, yoyo:true, repeat:-1 });
      this.tweens.add({ targets:fly, x:fx+(rnd()-0.5)*160, y:fy+(rnd()-0.5)*90,
        duration:5000+rnd()*5000, yoyo:true, repeat:-1, ease:'Sine.inOut' });
    }
  }

  /* ---------- ışıklandırma ---------- */
  setupLighting() {
    const zoom = Math.max(0.6, this.scale.height / 720);
    const vw = Math.ceil(this.scale.width / zoom) + 4;
    const vh = Math.ceil(this.scale.height / zoom) + 4;
    this.darkRT = this.add.renderTexture(0, 0, vw, vh).setOrigin(0).setDepth(50);
    this.spotImg = this.make.image({ key:'spotTex', add:false });
    this.vignette = this.add.image(0,0,'vignetteTex').setDepth(55).setAlpha(0).setDisplaySize(vw+8, vh+8);
  }

  updateLight(time) {
    if (!this.darkRT) return;
    const cam = this.cameras.main;
    const wv = cam.worldView;
    this.darkRT.setPosition(wv.x, wv.y);
    const k = this.kai;
    const pct = k.battery / BAL.BATT_MAX;
    let darkness = Math.min(0.965, 0.86 + (1-pct)*0.1);
    if (this.inkUntil && time < this.inkUntil) darkness = Math.min(0.975, darkness + 0.05);
    if (this.cine) darkness = 0.55;
    this.darkRT.clear();
    this.darkRT.fill(0x04040A, darkness);

    const flick = Math.sin(time*0.02)*1.6 + Math.sin(time*0.047)*1.4;
    let r;
    if (!k.lanternOn || pct <= 0) r = BAL.LIGHT_R_OFF + flick*0.3;
    else r = BAL.LIGHT_R_MIN + (BAL.LIGHT_R_MAX-BAL.LIGHT_R_MIN)*pct + flick;
    r *= this.lightBoost;
    if (this.inkUntil && time < this.inkUntil) r *= 0.7;
    if (this.cine) r *= 2.2;

    const lx = k.spr.x + k.facing*8, ly = k.spr.y - 2;
    this.spotImg.setDisplaySize(r*2.6, r*2.6);
    this.darkRT.erase(this.spotImg, lx - wv.x, ly - wv.y);

    /* namlu alevi anlık aydınlatır */
    if (time < this.flashUntil) {
      this.spotImg.setDisplaySize(220, 220);
      this.darkRT.erase(this.spotImg, this.flashPos.x - wv.x, this.flashPos.y - wv.y);
    }

    for (const el of this.envLights) {
      const ex = el.img.x, ey = el.img.y;
      if (ex < wv.x-220 || ex > wv.right+220) continue;
      this.spotImg.setDisplaySize(el.r*2.4, el.r*2.4);
      this.darkRT.erase(this.spotImg, ex - wv.x, ey - wv.y);
    }
    for (const ck of this.checkpoints) {
      if (!ck.active) continue;
      this.spotImg.setDisplaySize(190, 190);
      this.darkRT.erase(this.spotImg, ck.x - wv.x, ck.y - 10 - wv.y);
    }
    for (const fl of this.flares) {
