      const fr = BAL.FLARE_LIGHT_R * (0.85 + Math.sin(time*0.03)*0.15);
      this.spotImg.setDisplaySize(fr*2, fr*2);
      this.darkRT.erase(this.spotImg, fl.x - wv.x, fl.y - wv.y);
    }

    this.lanternGlow.setPosition(lx, ly);
    this.lanternGlow.setScale((r*2.6)/256 * 1.25);
    this.lanternGlow.setAlpha(!k.lanternOn || pct <= 0 ? 0.05 : 0.5 + pct*0.3);

    this.vignette.setPosition(cam.midPoint.x, cam.midPoint.y);
    this.vignette.setAlpha(pct < 0.22 && k.lanternOn ? (0.22-pct)/0.22 * 0.85 : 0);
  }

  /* ---------- akış ---------- */
  beginPlay() {
    this.playing = true;
    const k = this.kai;
    UI.setHearts(k.hearts, k.maxHearts);
    UI.setBattery(k.battery, k.lanternOn);
    UI.setGear({ melee:k.melee, gun:k.gun, ammo:k.ammo, flares:k.flares });
    if (this.bossData) UI.setBoss(this.bossData.hp / this.bossData.maxHp, true, this.bossData.name);
  }

  enterAttract() {
    if (!this.attract) this.scene.restart({ mode:'story', level:1, attract:true });
  }

  setPaused(p) {
    this.paused = p;
    this.physics.world.isPaused = p;
    this.time.paused = p;
    if (p) this.tweens.pauseAll(); else this.tweens.resumeAll();
  }

  syncGear() {
    const k = this.kai;
    SaveSystem.data.gear = { melee:k.melee, gun:k.gun, ammo:k.ammo, flares:k.flares };
    SaveSystem.save();
    UI.setGear(SaveSystem.data.gear);
  }

  /* ---------- ana döngü ---------- */
  update(time, delta) {
    if (this.paused) return;
    const dt = Math.min(delta, 50) / 1000;
    this.updateParallax();
    this.updateLight(time);
    this.updateMovers(time, dt);

    if (this.attract) { this.drawKai(time, dt); return; }
    if (this.cine) { this.drawKai(time, dt); if (this.cineRun) this.kai.phase += 0.16; return; }
    if (!this.playing) return;

    this.updateKai(time, dt);
    this.drawKai(time, dt);
    this.updateEnemies(time, dt);
    this.updateTentacles(time, dt);
    this.updateChests(time, dt);
    this.updateFlares(time, dt);
    if (this.bossData) this.updateBoss(time, dt);
    if (this.data0.corridor) this.updateCorridor();

    /* pil — yalnızca fener yanıyorsa */
    if (!SF_DEBUG.noDrain && !this.completing && this.kai.lanternOn) {
      this.kai.battery = Math.max(0, this.kai.battery - BAL.BATT_DRAIN*dt);
    }
    if ((this._hudT = (this._hudT||0) + delta) > 180) {
      this._hudT = 0;
      UI.setBattery(this.kai.battery, this.kai.lanternOn);
      AudioManager.setHeartbeat(this.kai.hearts <= 1 || (this.kai.lanternOn && this.kai.battery < 18));
    }

    /* yakınlık vınlaması */
    let nearest = 9999;
    for (const e of this.enemies) if (e.alive) {
      const dd = Math.abs(e.spr.x - this.kai.spr.x);
      if (dd < nearest) nearest = dd;
    }
    AudioManager.setHumLevel(nearest < 260 ? 1 - nearest/260 : 0);

    /* denetim taşları */
    for (const ck of this.checkpoints) {
      if (ck.active) continue;
      if (Math.abs(this.kai.spr.x - ck.x) < 34 && Math.abs(this.kai.spr.y - ck.y) < 60) {
        ck.active = true;
        this.respawnPoint = { x:ck.x, y:ck.y - 30 };
        this.kai.hearts = Math.max(this.kai.hearts, BAL.START_HEARTS);
        this.kai.battery = Math.max(this.kai.battery, 70);
        UI.setHearts(this.kai.hearts, this.kai.maxHearts);
        this.tweens.add({ targets:ck.glow, alpha:0.9, scale:1.1, duration:800 });
        this.burstWarm.explode(18, ck.x, ck.y-20);
        AudioManager.checkpoint(); Haptics.pickup();
        UI.showMonologue(T('checkpoint_line'));
      }
    }

    /* finiş */
    if (this.gateZone && !this.completing &&
        this.physics.overlap(this.kai.spr, this.gateZone)) {
      this.completing = true;
      this.syncGear();
      this.burstWhite.explode(30, this.gate.x, this.gate.y);
      this.tweens.add({ targets:[this.kaiGfx], alpha:0, duration:600 });
      UI.levelComplete(this.mode, this.levelN);
    }

    if (this.kai.spr.y > 820 && !this.kai.dead) this.killKai();
  }

  updateMovers(time, dt) {
    for (const m of this.movers) {
      const t = time*0.001*m.speed + m.ph;
      const target = (m.axis === 'x')
        ? { x: m.x0 + Math.sin(t)*m.range, y: m.y0 }
        : { x: m.x0, y: m.y0 + Math.sin(t)*m.range };
      const vx = (target.x - m.img.x) / Math.max(dt, 0.001);
      const vy = (target.y - m.img.y) / Math.max(dt, 0.001);
      m.img.body.setVelocity(vx, vy);
      /* üstündeki oyuncuyu taşı */
      if (this.kai && this.kai.spr.body.touching.down) {
        const k = this.kai.spr;
        if (Math.abs(k.x - m.img.x) < 70 && Math.abs((k.y+23) - (m.img.y-9)) < 14) {
          k.x += target.x - m.img.x;
        }
      }
    }
  }

  updateCorridor() {
    const c = this.data0.corridor, k = this.kai;
    if (!c || k.spr.x < c.x0 || k.spr.x > c.x1) return;
    const lines = I18N.arr('pre100');
    const seg = (c.x1 - c.x0) / lines.length;
    const idx = Math.floor((k.spr.x - c.x0) / seg);
    if (idx > this.whisperIdx - 1 && idx < lines.length) {
      if (idx >= this.whisperIdx) {
        this.whisperIdx = idx + 1;
        UI.showMonologue(lines[idx]);
        AudioManager.whisper();
      }
    }
  }

  /* ---------- Kai: gerçekçi platform fiziği ---------- */
  updateKai(time, dt) {
    const k = this.kai, b = k.spr.body, keys = this.keys;
    if (k.dead) return;

    const left  = Input.tLeft  || keys.A.isDown || keys.LEFT.isDown;
    const right = Input.tRight || keys.D.isDown || keys.RIGHT.isDown;
    const jumpHeld = Input.tJump || keys.SPACE.isDown || keys.W.isDown || keys.UP.isDown;
    const actionHeld = Input.tAction || keys.J.isDown || keys.E.isDown || keys.K.isDown;

    const onGround = b.blocked.down || b.touching.down;
    const now = time;

    /* fener aç/kapat */
    if (Input.evToggleLantern > 0) {
      Input.evToggleLantern = 0;
      k.lanternOn = !k.lanternOn;
      AudioManager.uiTick();
      UI.setBattery(k.battery, k.lanternOn);
      UI.toast(T(k.lanternOn ? 't_lantern_on' : 't_lantern_off'));
    }
    /* fişek at */
    if (Input.evFlare > 0) {
      Input.evFlare = 0;
      this.throwFlare();
    }

    /* --- ağırlık hissi: düşüş hızlanması + tepe asılması --- */
    let gMult = 1;
    if (b.velocity.y > 0) gMult = PHYS.FALL_MULT;
    else if (Math.abs(b.velocity.y) < PHYS.APEX_VY && !onGround && jumpHeld) gMult = PHYS.APEX_GRAV;
    b.gravity.y = PHYS.GRAVITY * (gMult - 1);

    /* --- yatay --- */
    const wantDir = (right?1:0) - (left?1:0);
    const locked = now < k.wallLockUntil;
    const recovering = now < k.recoverUntil;
    if (!locked) {
      if (wantDir !== 0) {
        let accel = onGround ? PHYS.ACCEL_GROUND : PHYS.ACCEL_AIR;
        if (recovering) accel *= 0.45;
        /* yön değiştirirken ekstra tutuş */
        if (Math.sign(b.velocity.x) === -wantDir) accel = onGround ? PHYS.DECEL_GROUND : PHYS.ACCEL_AIR*1.3;
        b.velocity.x += wantDir * accel * dt;
        if (Math.abs(b.velocity.x) > PHYS.MOVE_SPEED)
          b.velocity.x = Math.sign(b.velocity.x) * PHYS.MOVE_SPEED;
        k.facing = wantDir;
      } else {
        const fric = onGround ? PHYS.DECEL_GROUND : PHYS.DRAG_AIR;
        const dv = fric * dt;
        if (Math.abs(b.velocity.x) <= dv) b.velocity.x = 0;
        else b.velocity.x -= Math.sign(b.velocity.x) * dv;
      }
    }

    /* --- duvar kayması --- */
    const onWallL = !onGround && b.blocked.left && left;
    const onWallR = !onGround && b.blocked.right && right;
    if (onWallL || onWallR) {
      k.wallDir = onWallL ? -1 : 1;
      k.wallCoyoteUntil = now + PHYS.COYOTE_MS;
      if (b.velocity.y > PHYS.WALL_SLIDE) b.velocity.y = PHYS.WALL_SLIDE;
      if (Math.random() < 0.12) this.burstDark.explode(1, k.spr.x + k.wallDir*13, k.spr.y);
    }

    /* --- coyote & tampon --- */
    if (onGround) { k.coyoteUntil = now + PHYS.COYOTE_MS; k.airJumps = 1; }
    const jumpPressed = jumpHeld && !k.prevJump;
    if (jumpPressed) k.bufferUntil = now + PHYS.BUFFER_MS;

    if (now < k.bufferUntil) {
      if (onGround || now < k.coyoteUntil) {
        b.velocity.y = PHYS.JUMP_VY;
        k.bufferUntil = 0; k.coyoteUntil = 0;
        k.squash = 1.22;
        this.burstDark.explode(4, k.spr.x, k.spr.y+22);
      } else if (now < k.wallCoyoteUntil) {
        b.velocity.x = -k.wallDir * PHYS.WALL_JUMP_VX;
        b.velocity.y = PHYS.WALL_JUMP_VY;
        k.wallLockUntil = now + PHYS.WALL_LOCK_MS;
        k.facing = -k.wallDir;
        k.bufferUntil = 0; k.wallCoyoteUntil = 0;
        this.burstDark.explode(5, k.spr.x + k.wallDir*12, k.spr.y);
      } else if (k.airJumps > 0) {
        k.airJumps--;
        b.velocity.y = PHYS.JUMP_VY * 0.85;
        k.bufferUntil = 0;
        this.burstWhite.explode(5, k.spr.x, k.spr.y+18);
      }
    }
    if (!jumpHeld && b.velocity.y < PHYS.JUMP_CUT_VY) b.velocity.y = PHYS.JUMP_CUT_VY;
    k.prevJump = jumpHeld;

    /* --- iniş --- */
    if (!onGround) k.fallPeak = Math.max(k.fallPeak, b.velocity.y);
    if (onGround && !k.wasOnGround) {
      if (k.fallPeak > 760) {
        AudioManager.landHard(); Haptics.land(); this.shakeSmall();
        k.squash = 0.55; k.recoverUntil = now + PHYS.LAND_RECOVER_MS;
        k.noise = Math.max(k.noise, 1);
      } else if (k.fallPeak > 300) {
        AudioManager.landSoft(); k.squash = 0.76;
        k.noise = Math.max(k.noise, 0.6);
      }
      this.burstDark.explode(Math.min(8, Math.round(k.fallPeak/120)), k.spr.x, k.spr.y+22);
      k.fallPeak = 0;
    }
    k.wasOnGround = onGround;
    k.squash += (1 - k.squash) * Math.min(1, dt*10);

    /* --- adımlar & gürültü --- */
    if (onGround && Math.abs(b.velocity.x) > 50) {
      k.stepAcc += Math.abs(b.velocity.x) * dt;
      if (k.stepAcc > 58) { k.stepAcc = 0; AudioManager.footstep(); }
      k.phase += Math.abs(b.velocity.x) * dt * 0.055;
      k.noise = Math.max(k.noise, Math.abs(b.velocity.x) > PHYS.MOVE_SPEED*0.85 ? 0.5 : 0.3);
    } else {
      k.phase += dt * 1.6;
    }
    k.noise = Math.max(0, k.noise - dt*1.6);
    k.lean += ((b.velocity.x / PHYS.MOVE_SPEED) * 0.18 - k.lean) * Math.min(1, dt*8);

    /* --- sandık / saldırı --- */
    k.nearChest = null;
    for (const c of this.chests) {
      if (!c.opened && Math.abs(c.x - k.spr.x) < 52 && Math.abs(c.y - k.spr.y) < 70) { k.nearChest = c; break; }
    }
    UI.setActionMode(!!k.nearChest);

    if (k.nearChest) {
      if (actionHeld) {
        k.searchMs += dt*1000;
        if (Math.floor(k.searchMs/150) !== Math.floor((k.searchMs-dt*1000)/150)) AudioManager.searchTick();
        if (k.searchMs >= BAL.SEARCH_MS) { this.openChest(k.nearChest); k.searchMs = 0; }
      } else k.searchMs = 0;
      this.drawSearchRing(k.nearChest, k.searchMs / BAL.SEARCH_MS);
    } else {
      k.searchMs = 0;
      this.searchGfx.clear();
      const actionPressed = actionHeld && !k.prevAction;
      if (actionPressed && now > k.attackCd) this.doAttack(now);
    }
    k.prevAction = actionHeld;

    /* fener sarkacı: oyuncu ivmesiyle salınır */
    const ax = (b.velocity.x - k.prevVx) / Math.max(dt, 0.001);
    k.prevVx = b.velocity.x;
    const Llen = 12;
    const angAcc = -(PHYS.GRAVITY/Llen)*Math.sin(k.lanAng)*0.0016 - (ax/Llen)*0.0011*Math.cos(k.lanAng) - k.lanVel*3.2;
    k.lanVel += angAcc * dt * 60;
    k.lanAng += k.lanVel * dt;
    k.lanAng = Phaser.Math.Clamp(k.lanAng, -1.1, 1.1);
  }

  drawSearchRing(c, t) {
    const g = this.searchGfx;
    g.clear();
    if (t <= 0) {
      g.lineStyle(2, 0xD4C4F0, 0.35 + Math.sin(this.time.now*0.005)*0.15);
      g.strokeCircle(c.x, c.y - 36, 10);
      return;
    }
    g.lineStyle(3, 0xD4C4F0, 0.85);
    g.beginPath();
    g.arc(c.x, c.y - 36, 12, -Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(1,t));
    g.strokePath();
  }

  /* ---------- Kai çizimi: eklemli bacaklar + verlet atkı + sarkaç fener ---------- */
  drawKai(time, dt) {
    const k = this.kai, g = this.kaiGfx;
    g.clear();
    if (k.dead || k.hidden) return;
    const spr = k.spr;
    const x = spr.x, sq = k.squash;
    const y = spr.y + (1-sq)*9;
    const f = k.facing;
    if (k.iframesUntil > time && Math.floor(time/80) % 2 === 0) return;

    const vx = spr.body ? spr.body.velocity.x : 0;
    const vy = spr.body ? spr.body.velocity.y : 0;
    const onG = spr.body ? (spr.body.blocked.down || spr.body.touching.down) : true;
    const runAmt = Math.max(this.cineRun || 0, Math.min(1, Math.abs(vx)/PHYS.MOVE_SPEED));
    const ph = k.phase;

    const hipX = x, hipY = y + 8*sq;
    const leanPx = k.lean * 26;
    const chestX = x + leanPx*0.5, chestY = y - 6*sq;
    const breathe = onG && runAmt < 0.15 ? Math.sin(time*0.0022)*1.2 : 0;
    const headX = chestX + leanPx*0.4, headY = chestY - 11 + breathe;

    /* --- bacaklar: kalça→diz→ayak, dizler bükülür --- */
    g.lineStyle(4.5, COLORS.SIL, 1);
    const legLen = 15;
    const drawLeg = (footX, footY) => {
      const mx = (hipX+footX)/2, my2 = (hipY+footY)/2;
      const dx = footX-hipX, dy = footY-hipY;
      const dl = Math.max(8, Math.hypot(dx,dy));
      const bend = Math.max(0, legLen - dl*0.5) * 0.9;
      const kneeX = mx + (dy/dl)*bend*f, kneeY = my2 - (dx/dl)*bend*f;
      g.lineBetween(hipX, hipY, kneeX, kneeY);
      g.lineBetween(kneeX, kneeY, footX, footY);
    };
    if (!onG) {
      const tuck = vy < 0 ? 7 : 2;
      drawLeg(hipX - 5*f, hipY + 14 - tuck);
      drawLeg(hipX + 7*f, hipY + 11 - tuck*0.4);
    } else if (runAmt > 0.15) {
      const stride = 10*runAmt;
      const f1 = Math.sin(ph), f2 = Math.sin(ph + Math.PI);
      const lift1 = Math.max(0, Math.cos(ph))*6*runAmt;
      const lift2 = Math.max(0, Math.cos(ph+Math.PI))*6*runAmt;
      drawLeg(hipX + f1*stride*f, hipY + 15 - lift1);
      drawLeg(hipX + f2*stride*f, hipY + 15 - lift2);
    } else {
      const sway = Math.sin(ph)*0.8;
      drawLeg(hipX - 4 + sway, hipY + 15);
      drawLeg(hipX + 4 + sway, hipY + 15);
    }

    /* --- gövde --- */
    g.lineStyle(0);
    g.fillStyle(COLORS.SIL, 1);
    g.fillRoundedRect(Math.min(hipX,chestX)-6.5, chestY-6, 13+Math.abs(chestX-hipX), (hipY-chestY)+14, 6);

    /* --- baş + kapüşon --- */
    g.fillCircle(headX, headY, 7.5);
    g.fillTriangle(headX - 6*f, headY - 5, headX - 1*f, headY - 10, headX - 12*f, headY + 3);
    g.fillTriangle(headX - 2*f, headY - 8, headX + 5*f, headY - 7, headX + 2*f, headY - 12);

    /* --- atkı: verlet kumaş --- */
    const sp2 = k.scarf;
    const anchorX = headX - 4*f, anchorY = headY + 6;
    sp2[0].x = anchorX; sp2[0].y = anchorY;
    const wind = Math.sin(time*0.0013)*8 - vx*0.06;
    for (let i=1;i<sp2.length;i++) {
      const p = sp2[i];
      const vxp = (p.x - p.px)*0.94 + wind*dt;
      const vyp = (p.y - p.py)*0.94 + 30*dt;
      p.px = p.x; p.py = p.y;
      p.x += vxp; p.y += vyp;
    }
    for (let iter=0; iter<3; iter++) {
      for (let i=1;i<sp2.length;i++) {
        const a = sp2[i-1], p = sp2[i];
        let dx = p.x-a.x, dy = p.y-a.y;
        const dl = Math.max(0.001, Math.hypot(dx,dy));
        const diff = (dl - 4.6)/dl;
        if (i === 1) { p.x -= dx*diff; p.y -= dy*diff; }
        else { p.x -= dx*diff*0.85; p.y -= dy*diff*0.85; a.x += dx*diff*0.15; a.y += dy*diff*0.15; }
      }
      sp2[0].x = anchorX; sp2[0].y = anchorY;
    }
    for (let i=1;i<sp2.length;i++) {
      g.lineStyle(4.2 - i*0.55, COLORS.SCARF, 1 - i*0.07);
      g.lineBetween(sp2[i-1].x, sp2[i-1].y, sp2[i].x, sp2[i].y);
    }

    /* --- kollar --- */
    g.lineStyle(4, COLORS.SIL, 1);
    if (k.hugging) {
      g.lineBetween(chestX, chestY, chestX + 13*f, chestY - 2);
      g.lineBetween(chestX, chestY+2, chestX + 12*f, chestY + 5);
    } else {
      const armSwing = onG && runAmt > 0.15 ? Math.sin(ph + Math.PI)*6*runAmt : Math.sin(time*0.0022)*1.4;
      g.lineBetween(chestX, chestY, chestX - (5+armSwing*0.4)*f, chestY + 9);
      /* fener kolu + sarkaç fener */
      const handX = chestX + 9*f, handY = chestY + 5;
      g.lineBetween(chestX, chestY, handX, handY);
      const lanX = handX + Math.sin(k.lanAng)*12, lanY = handY + Math.cos(k.lanAng)*12;
      g.lineStyle(1.6, 0x2A2438, 1);
      g.lineBetween(handX, handY, lanX, lanY);
      g.fillStyle(0x2A2438, 1);
      g.save && g.save();
      g.fillRoundedRect(lanX - 3.5, lanY, 7, 10, 2);
      const lit = k.lanternOn && k.battery > 0;
      g.fillStyle(COLORS.LANTERN, lit ? 0.95 : 0.1);
      g.fillRect(lanX - 2, lanY + 2.5, 4, 5);
      this._lanPos = { x:lanX, y:lanY+5 };
    }
  }

  /* ================= TOPLANABİLİRLER & SANDIKLAR ================= */

  collectPickup(p) {
    const type = p.getData('type');
    const k = this.kai;
    if (type === 'heart') {
      if (k.hearts >= k.maxHearts) return;
      k.hearts++;
      UI.setHearts(k.hearts, k.maxHearts);
      UI.popHeart(k.hearts - 1);
      this.burstRed.explode(12, p.x, p.y);
      AudioManager.heart(); Haptics.pickup();
    } else if (type === 'flare') {
      k.flares++;
      UI.setGear({ melee:k.melee, gun:k.gun, ammo:k.ammo, flares:k.flares });
      this.burstRed.explode(8, p.x, p.y);
      AudioManager.battery(); Haptics.pickup();
      UI.toast(T('t_flare', { n:1 }));
    } else {
      k.battery = Math.min(BAL.BATT_MAX, k.battery + BAL.BATT_PICKUP);
      UI.setBattery(k.battery, k.lanternOn);
      this.burstWhite.explode(12, p.x, p.y);
      AudioManager.battery(); Haptics.pickup();
    }
    const glow = p.getData('glow');
    if (glow) glow.destroy();
    p.destroy();
  }

  openChest(c) {
    c.opened = true;
    const k = this.kai, n = this.levelN, story = this.mode === 'story';
    this.tweens.add({ targets:c.img, alpha:1, y:c.y-6, duration:300, yoyo:true });
    this.burstWarm.explode(16, c.x, c.y-8);
    AudioManager.chestOpen(); Haptics.pickup();
    this.searchGfx.clear();

    let loot = c.loot;
    if (loot === 'best') {
      if (k.gun === 'none') loot = 'pistol';
      else if (k.melee === 'fist') loot = 'bat';
      else if (k.gun === 'pistol' && (story ? n >= 40 : n >= 15)) loot = 'shotgun';
      else loot = 'ammo';
    }
    if (loot === 'random') {
      if (k.melee === 'fist') loot = 'bat';
      else if (k.gun === 'none' && (story ? n >= 10 : true)) loot = 'pistol';
      else if (k.melee === 'bat' && (story ? n >= 20 : n >= 6)) loot = 'machete';
      else if (k.gun === 'pistol' && (story ? n >= 40 : n >= 15)) loot = 'shotgun';
      else {
        const r = Math.random();
        if (k.gun !== 'none' && r < 0.32) loot = 'ammo';
        else if (r < 0.5) loot = 'battery';
        else if (r < 0.65) loot = 'medkit';
        else if (r < 0.85) loot = 'flareItem';
        else loot = 'heart';
      }
    }
    const give = {
      bat:     () => { k.melee='bat'; AudioManager.weaponFound(); UI.toast(T('t_found_bat')); },
      machete: () => { k.melee='machete'; AudioManager.weaponFound(); UI.toast(T('t_found_machete')); },
      pistol:  () => { k.gun='pistol'; k.ammo += 12; AudioManager.weaponFound(); UI.toast(T('t_found_pistol')); },
      shotgun: () => { k.gun='shotgun'; k.ammo += 8; AudioManager.weaponFound(); UI.toast(T('t_found_shotgun')); },
      ammo:    () => { k.ammo += 8; UI.toast(T('t_ammo',{n:8})); AudioManager.battery(); },
      battery: () => { k.battery = Math.min(BAL.BATT_MAX, k.battery+BAL.BATT_PICKUP); UI.toast(T('t_batt')); AudioManager.battery(); },
      medkit:  () => { k.hearts = Math.min(k.maxHearts, k.hearts+2); UI.setHearts(k.hearts,k.maxHearts); UI.toast(T('t_medkit')); AudioManager.heart(); },
      flareItem:() => { k.flares += 2; UI.toast(T('t_flare',{n:2})); AudioManager.battery(); },
      heart:   () => { if (k.hearts<k.maxHearts){k.hearts++; UI.setHearts(k.hearts,k.maxHearts);} UI.toast(T('t_heart')); AudioManager.heart(); }
    };
    (give[loot] || give.battery)();
    UI.setGear({ melee:k.melee, gun:k.gun, ammo:k.ammo, flares:k.flares });
    UI.setBattery(k.battery, k.lanternOn);
  }

  updateChests(time, dt) {
    for (const c of this.chests) {
      if (c.opened) continue;
      c.glintT += dt;
      if (c.glintT > 2.4) {
        c.glintT = 0;
        if (Math.abs(c.x - this.kai.spr.x) < 700) this.burstWhite.explode(2, c.x, c.y-10);
      }
    }
  }

  /* ========================== SAVAŞ ============================== */

  doAttack(now) {
    const k = this.kai;
    if (k.gun !== 'none' && k.ammo > 0) {
      const W = WEAPONS[k.gun];
      k.attackCd = now + W.cd;
      k.ammo--;
      UI.setGear({ melee:k.melee, gun:k.gun, ammo:k.ammo, flares:k.flares });
      const bx = k.spr.x + k.facing*16, by = k.spr.y - 4;
      for (let i=0;i<W.pellets;i++) {
        const ang = (k.facing>0?0:Math.PI) + (W.pellets>1 ? (i-(W.pellets-1)/2)*W.spread : 0);
        const b = this.pBullets.create(bx, by, 'bulletTex');
        b.setData('dmg', W.dmg);
        b.setRotation(ang);
        this.physics.velocityFromRotation(ang, W.speed, b.body.velocity);
        this.time.delayedCall(1100, () => { if (b.active) b.destroy(); });
      }
      this.burstWarm.explode(5, bx, by);
      this.flashUntil = now + 80;
      this.flashPos = { x:bx, y:by };
      if (k.gun === 'shotgun') { AudioManager.shotgun(); this.shakeSmall(); } else AudioManager.pistol();
      Haptics.shoot();
      k.noise = 1.6;
      return;
    }
    /* yakın dövüş */
    const W = WEAPONS[k.melee];
    k.attackCd = now + W.cd;
    AudioManager.whoosh(); Haptics.attack();
    k.noise = Math.max(k.noise, 0.8);

    const g = this.swingGfx;
    g.clear();
    g.lineStyle(3, 0xD8D0C8, 0.8);
    g.beginPath();
    g.arc(k.spr.x, k.spr.y-2, W.range-8, (k.facing>0?-0.9:Math.PI-0.9), (k.facing>0?0.9:Math.PI+0.9));
    g.strokePath();
    this.time.delayedCall(110, () => g.clear());

    let hitAny = false;
    for (const e of this.enemies) {
      if (!e.alive) continue;
      const dx = e.spr.x - k.spr.x, dy = Math.abs(e.spr.y - k.spr.y);
      if (Math.sign(dx) === k.facing && Math.abs(dx) < W.range + 20 && dy < 64) {
        this.hitEnemy(e, W.dmg, k.spr.x);
        hitAny = true;
      }
    }
    if (hitAny) {
      if (k.melee === 'bat') AudioManager.hitBat();
      else if (k.melee === 'machete') AudioManager.hitMachete();
      else AudioManager.hitFlesh();
    }
  }

  throwFlare() {
    const k = this.kai;
    if (k.flares <= 0) { AudioManager.dryFire(); return; }
    k.flares--;
    UI.setGear({ melee:k.melee, gun:k.gun, ammo:k.ammo, flares:k.flares });
    const fl = this.physics.add.image(k.spr.x + k.facing*14, k.spr.y - 10, 'flareTex');
    fl.setVelocity(280*k.facing, -320);
    fl.setBounce(0.4);
    fl.setData('isFlare', true);
    this.physics.add.collider(fl, this.solids);
    AudioManager.flareThrow();
    k.noise = Math.max(k.noise, 0.5);
    this.time.delayedCall(900, () => {
      if (!fl.active) return;
      const fx = fl.x, fy = fl.y;
      fl.destroy();
      const glow = this.add.image(fx, fy, 'redGlowTex').setDepth(6).setScale(1.6).setAlpha(0.9);
      this.tweens.add({ targets:glow, scale:1.9, alpha:0.6, duration:500, yoyo:true, repeat:-1 });
      const flare = { x:fx, y:fy, until:this.time.now + BAL.FLARE_BURN_MS, glow };
      this.flares.push(flare);
      AudioManager.flareBurn();
    });
  }

  updateFlares(time, dt) {
    for (let i=this.flares.length-1;i>=0;i--) {
      const fl = this.flares[i];
      if (Math.random() < 0.3) this.burstRed.explode(1, fl.x + (Math.random()-0.5)*8, fl.y - 4);
      if (time > fl.until) {
        fl.glow.destroy();
        this.flares.splice(i,1);
      }
    }
  }

  activeFlare() { return this.flares.length ? this.flares[this.flares.length-1] : null; }

  hitEnemy(e, dmg, fromX) {
    if (!e.alive) return;
    const now = this.time.now;
    /* golem zırhı: yalnız çekirdek açıkken tam hasar */
    if (e.type === 'golem' && now > (e.vulnUntil||0)) dmg *= 0.3;
    e.hp -= dmg;
    e.stunUntil = now + 240;
    if (e.type === 'stalker') e.retreatUntil = now + 1100;
    e.spr.setTintFill(0xF0E8FF);
    this.time.delayedCall(90, () => { if (e.spr.active) e.spr.clearTint(); });
    if (e.spr.body && !e.spr.body.immovable && !e.boss) {
      e.spr.body.velocity.x = (e.spr.x < fromX ? -1 : 1) * 190;
      e.spr.body.velocity.y = -120;
    }
    AudioManager.enemyHit();
    if (e.boss && this.bossData) {
      this.bossData.hp = Math.max(0, e.hp);
      UI.setBoss(this.bossData.hp / this.bossData.maxHp, true, this.bossData.name);
      if (this.bossData.type === 'deepone') this.aware = Math.min(1, (this.aware||0) + 0.18);
      if (e.hp > 0 && Math.random() < 0.25) AudioManager.bossRoar();
    }
    if (e.hp <= 0) this.enemyDie(e);
  }

  enemyDie(e) {
    if (!e.alive) return;
    e.alive = false;
    AudioManager.enemyDie();
    this.burstDark.explode(16, e.spr.x, e.spr.y);
    const k = this.kai;
    if (e.type === 'gunman') {
      if (k.gun !== 'none') { k.ammo += 5; UI.setGear({melee:k.melee,gun:k.gun,ammo:k.ammo,flares:k.flares}); UI.toast(T('t_ammo',{n:5})); }
      else this.spawnPickup(e.spr.x, e.spr.y - 20, 'battery');
    } else if (e.type === 'stalker' && Math.random() < 0.22) {
      this.spawnPickup(e.spr.x, e.spr.y - 20, 'heart');
    } else if (e.type === 'wraith' && Math.random() < 0.18) {
      this.spawnPickup(e.spr.x, e.spr.y + 10, 'battery');
    } else if (e.type === 'bloater') {
      this.bloaterExplode(e, true);
    }
    const spr = e.spr;
    this.tweens.add({ targets:spr, alpha:0, scaleX:spr.scaleX*0.5, scaleY:spr.scaleY*0.5, duration:340,
      onComplete:() => spr.destroy() });
    if (e.boss) this.bossDie(e);
  }

  bloaterExplode(e, fromDeath) {
    const x = e.spr.x, y = e.spr.y;
    this.burstGreen.explode(34, x, y);
    AudioManager.explode();
    this.cameras.main.shake(220, 0.008);
    const k = this.kai;
    const dist = Phaser.Math.Distance.Between(x, y, k.spr.x, k.spr.y);
    if (dist < 130) {
      this.damageKai(2, x);
      k.battery = Math.max(0, k.battery - 15);
      UI.setBattery(k.battery, k.lanternOn);
    }
    if (!fromDeath) { e.hp = 0; this.enemyDie(e); }
  }

  damageKai(n, srcX, spike) {
    const k = this.kai;
    if (SF_DEBUG.noDamage || k.dead || this.completing || this.cine) return;
    if (this.time.now < k.iframesUntil) return;
    k.iframesUntil = this.time.now + BAL.IFRAMES_MS;
    k.hearts = Math.max(0, k.hearts - n);
    UI.setHearts(k.hearts, k.maxHearts);
    AudioManager.hurt(); Haptics.hurt();
    this.cameras.main.shake(140, 0.006);
    this.burstRed.explode(10, k.spr.x, k.spr.y);
    k.spr.body.velocity.x = (k.spr.x < srcX ? -1 : 1) * 260;
    k.spr.body.velocity.y = spike ? -430 : -240;
    k.noise = Math.max(k.noise, 0.8);
    if (k.hearts <= 0) this.killKai();
  }

  killKai() {
    const k = this.kai;
    if (k.dead) return;
    k.dead = true;
    AudioManager.death(); Haptics.death();
    this.burstDark.explode(30, k.spr.x, k.spr.y);
    this.burstWhite.explode(8, k.spr.x, k.spr.y);
    k.spr.body.enable = false;
    this.lanternGlow.setAlpha(0);
    this.time.delayedCall(1000, () => {
      UI.fadeToBlack(() => this.respawn(), 450);
    });
  }

  respawn() {
    const k = this.kai;
    k.spr.body.enable = true;
    k.spr.setPosition(this.respawnPoint.x, this.respawnPoint.y);
    k.spr.body.reset(this.respawnPoint.x, this.respawnPoint.y);
    k.dead = false;
    k.hearts = BAL.START_HEARTS;
    k.battery = Math.max(50, k.battery);
    k.iframesUntil = this.time.now + 1400;
    if (this.bossData && this.bossData.type === 'deepone') this.aware = 0;
    UI.setHearts(k.hearts, k.maxHearts);
    UI.setBattery(k.battery, k.lanternOn);
  }

  /* ===================== DÜŞMANLAR & YZ ========================== */

  spawnEnemy(type, x, y, opts) {
    const defs = {
      skitter: { tex:'skitterTex', hp:2, w:46, h:24, grav:true,  eyes:[[-16,-6],[-11,-8]], eyeC:0x8FE8D0 },
      wraith:  { tex:'wraithTex',  hp:2, w:24, h:38, grav:false, eyes:[[-4,-8],[4,-8]],   eyeC:0xB8C4D8 },
      stalker: { tex:'stalkerTex', hp:3, w:40, h:42, grav:true,  eyes:[[14,-14],[19,-13]], eyeC:0xFFB44A },
      gunman:  { tex:'gunmanTex',  hp:3, w:30, h:50, grav:true,  eyes:[[4,-20]],          eyeC:0xC23A4A },
      leech:   { tex:'leechTex',   hp:2, w:22, h:30, grav:false, eyes:[],                 eyeC:0 },
      bloater: { tex:'bloaterTex', hp:4, w:40, h:46, grav:true,  eyes:[[-4,-18],[4,-18]], eyeC:0x9CC44A }
    };
    const def = defs[type];
    const spr = this.physics.add.sprite(x, y, def.tex);
    spr.body.setSize(def.w, def.h);
    spr.body.allowGravity = def.grav;
    spr.setDepth(5);
    if (def.grav) this.physics.add.collider(spr, this.solids);
    const e = {
      type, spr, def, hp:def.hp, alive:true, dir: Math.random()<0.5?-1:1,
      x0:x-130, x1:x+130, stunUntil:0, retreatUntil:0, leapCd:0,
      state: type==='leech' && opts && opts.ceil ? 'hang' : 'patrol',
      stateT:0, shots:0, ph:Math.random()*6, boss:false,
      trail: type==='wraith' ? [] : null, hangY:y
    };
    if (e.state === 'hang') spr.setFlipX(false);
    spr.setData('e', e);
    this.enemyG.add(spr);
    this.enemies.push(e);
    return e;
  }

  /* görüş: fener açıkken uzaktan, kapalıyken ancak yakından + gürültü */
  sightRange(base) {
    const k = this.kai;
    const lightFactor = (k.lanternOn && k.battery > 0) ? 1 : BAL.STEALTH_SIGHT;
    return base * lightFactor + k.noise * 130;
  }

  updateEnemies(time, dt) {
    this.laserGfx.clear();
    this.eyeGfx.clear();
    this.trailGfx.clear();
    const k = this.kai;
    const flare = this.activeFlare();

    for (const e of this.enemies) {
      if (!e.alive || !e.spr.body) continue;
      const spr = e.spr, b = spr.body;
      /* fişek dikkat dağıtır: hedef oyuncu yerine fişek olur */
      const tgt = flare && Math.abs(flare.x - spr.x) < 600 ? flare : { x:k.spr.x, y:k.spr.y };
      const dx = tgt.x - spr.x, dy = tgt.y - spr.y;
      const pdx = k.spr.x - spr.x, pdy = k.spr.y - spr.y;
      const dist = Math.abs(dx), pdist = Math.abs(pdx);
      if (pdist > 980) { if (!b.allowGravity) b.velocity.set(0,0); continue; }
      const stunned = time < e.stunUntil;

      /* karanlıkta parlayan gözler */
      if (e.def.eyes.length && pdist < 800) {
        const hunting = e.state === 'chase' || e.state === 'aim' || e.state === 'fire' || dist < this.sightRange(300);
        const a = hunting ? 0.95 : 0.45 + Math.sin(time*0.003 + e.ph)*0.15;
        this.eyeGfx.fillStyle(e.def.eyeC, a);
        for (const [exo, eyo] of e.def.eyes) {
          const ex = spr.x + (spr.flipX ? -exo : exo);
          this.eyeGfx.fillCircle(ex, spr.y + eyo, hunting ? 2.2 : 1.7);
        }
      }
      if (stunned) continue;

      if (e.type === 'skitter') {
        /* kesik kesik seğirten koşu */
        e.stateT -= dt;
        const see = dist < this.sightRange(260) && Math.abs(dy) < 70 && !k.dead;
        if (e.stateT <= 0) {
          e.moving = !e.moving;
          e.stateT = e.moving ? 0.4+Math.random()*0.3 : 0.25+Math.random()*0.3;
          if (see && e.moving && Math.random()<0.25) AudioManager.screech();
        }
        if (see) e.dir = Math.sign(dx) || 1;
        else if (spr.x < e.x0) e.dir = 1;
        else if (spr.x > e.x1) e.dir = -1;
        if (b.blocked.left) e.dir = 1;
        if (b.blocked.right) e.dir = -1;
        b.velocity.x = e.moving ? e.dir * (see?210:80) : 0;
        spr.setFlipX(e.dir > 0);

      } else if (e.type === 'wraith') {
        e.ph += dt;
        /* iz bırakan tül — duvarlardan geçer */
        if (e.trail) {
          e.trail.unshift({ x:spr.x, y:spr.y });
          if (e.trail.length > 7) e.trail.pop();
          for (let i=1;i<e.trail.length;i++) {
            this.trailGfx.fillStyle(0x0C0C18, 0.3*(1-i/e.trail.length));
            this.trailGfx.fillEllipse(e.trail[i].x, e.trail[i].y+4, 20-(i*2), 30-(i*3));
          }
        }
        const see = dist < this.sightRange(430) && !k.dead;
        /* fener AÇIKKEN ışık onu yakar: yavaşlar — kapalıyken hızlanır */
        const burn = (k.lanternOn && k.battery>0 && pdist < 200) ? 0.55 : 1;
        if (see) {
          const ang = Math.atan2(dy - 8, dx);
          b.velocity.x += Math.cos(ang) * 280 * dt;
          b.velocity.y += Math.sin(ang) * 240 * dt;
          const cap = (k.lanternOn ? 120 : 175) * burn;
          const sp = Math.hypot(b.velocity.x, b.velocity.y);
          if (sp > cap) { b.velocity.x *= cap/sp; b.velocity.y *= cap/sp; }
        } else {
          b.velocity.x *= 0.985;
          b.velocity.y = Math.sin(e.ph*2.2) * 26;
        }
        spr.setAlpha(0.7 + Math.sin(time*0.004 + e.ph)*0.18);
        spr.setFlipX(dx < 0);

      } else if (e.type === 'stalker') {
        const onG = b.blocked.down;
        const see = dist < this.sightRange(440) && !k.dead;
        if (time < e.retreatUntil) {
          b.velocity.x = -Math.sign(pdx) * 215;
          spr.setFlipX(pdx > 0);
          e.state = 'retreat';
        } else if (see) {
          if (e.state !== 'chase') { e.state = 'chase'; AudioManager.growl(); }
          const sp = 170 + this.data0.d * 70;
          b.velocity.x = Math.sign(dx) * sp;
          spr.setFlipX(dx < 0);
          if (onG && ((dx > 0 && b.blocked.right) || (dx < 0 && b.blocked.left))) b.velocity.y = -590;
          if (onG && dist < 140 && time > e.leapCd) {
            e.leapCd = time + 1850;
            b.velocity.x = Math.sign(dx) * 330;
            b.velocity.y = -430;
            AudioManager.screech();
          }
        } else {
          e.state = 'patrol';
          if (spr.x < e.x0) e.dir = 1;
          else if (spr.x > e.x1) e.dir = -1;
          if (b.blocked.left) e.dir = 1;
          if (b.blocked.right) e.dir = -1;
          b.velocity.x = e.dir * 55;
          spr.setFlipX(e.dir < 0);
        }

      } else if (e.type === 'gunman') {
        const sees = pdist < this.sightRange(560) && Math.abs(pdy) < 140 && !k.dead;
        e.stateT -= dt*1000;
        if (e.state === 'patrol' || e.state === 'chase') {
          if (spr.x < e.x0) e.dir = 1;
          else if (spr.x > e.x1) e.dir = -1;
          if (b.blocked.left) e.dir = 1;
          if (b.blocked.right) e.dir = -1;
          b.velocity.x = e.dir * 64;
          spr.setFlipX(e.dir < 0);
          if (sees) { e.state = 'aim'; e.stateT = 520; b.velocity.x = 0; }
        } else if (e.state === 'aim') {
          b.velocity.x = 0;
          spr.setFlipX(pdx < 0);
          this.laserGfx.lineStyle(1.5, 0xC23A4A, 0.55);
          this.laserGfx.lineBetween(spr.x + (pdx>0?22:-22), spr.y-8, k.spr.x, k.spr.y-4);
          if (!sees) e.state = 'patrol';
          else if (e.stateT <= 0) { e.state = 'fire'; e.shots = 3; e.stateT = 0; }
        } else if (e.state === 'fire') {
          b.velocity.x = 0;
          if (e.stateT <= 0 && e.shots > 0) {
            e.shots--;
            e.stateT = 170;
            const ang = Phaser.Math.Angle.Between(spr.x, spr.y-8, k.spr.x, k.spr.y-4);
            const bullet = this.eBullets.create(spr.x + Math.cos(ang)*24, spr.y-8 + Math.sin(ang)*10, 'ebulletTex');
            bullet.setRotation(ang);
            this.physics.velocityFromRotation(ang, 480, bullet.body.velocity);
            this.time.delayedCall(1500, () => { if (bullet.active) bullet.destroy(); });
            AudioManager.enemyShoot();
            this.flashUntil = time + 60;
            this.flashPos = { x:spr.x + Math.cos(ang)*26, y:spr.y-8 };
          }
          if (e.shots <= 0 && e.stateT <= 0) { e.state = 'cool'; e.stateT = 950; }
        } else if (e.state === 'cool') {
          b.velocity.x = (pdist < 160 ? -Math.sign(pdx) : Math.sign(pdx)) * 80;
          if (e.stateT <= 0) { e.state = sees ? 'aim' : 'patrol'; if (e.state==='aim') e.stateT = 420; }
        }

      } else if (e.type === 'leech') {
        if (e.state === 'hang') {
          spr.y = e.hangY + Math.sin(time*0.002 + e.ph)*3;
          if (pdist < 56 && pdy > 0 && !k.dead) {
            e.state = 'drop';
            b.allowGravity = true;
            this.physics.add.collider(spr, this.solids);
            AudioManager.screech();
          }
        } else {
          const onG = b.blocked.down;
          if (onG) {
            const see = pdist < this.sightRange(240);
            if (see) e.dir = Math.sign(pdx) || 1;
            b.velocity.x = e.dir * (see?150:60);
            if (see && pdist < 60 && time > e.leapCd) {
              e.leapCd = time + 1500;
              b.velocity.y = -360;
              b.velocity.x = Math.sign(pdx)*240;
            }
          }
          spr.setFlipX(e.dir < 0);
        }

      } else if (e.type === 'bloater') {
        const see = pdist < this.sightRange(300) && !k.dead;
        if (e.state === 'inflate') {
          b.velocity.x = 0;
          e.stateT -= dt*1000;
          if (e.stateT <= 0) this.bloaterExplode(e, false);
        } else {
          if (see) { e.dir = Math.sign(pdx)||1; b.velocity.x = e.dir*42; }
          else {
            if (spr.x < e.x0) e.dir = 1;
            else if (spr.x > e.x1) e.dir = -1;
            b.velocity.x = e.dir * 26;
          }
          spr.setFlipX(e.dir < 0);
          if (pdist < 72 && Math.abs(pdy) < 50 && !k.dead) {
            e.state = 'inflate'; e.stateT = 750;
            AudioManager.gurgle();
            this.tweens.add({ targets:spr, scaleX:1.3, scaleY:1.25, duration:700 });
          }
        }
      }

      /* temas hasarı (bloater patlamayla vurur, leech ısırır) */
      if (!k.dead && e.type !== 'bloater' &&
          pdist < 32 && Math.abs(pdy) < 44) {
        this.damageKai(1, spr.x);
        if (e.type === 'wraith') {
          k.battery = Math.max(0, k.battery - 12);
          UI.setBattery(k.battery, k.lanternOn);
        }
      }
    }
  }

  /* ---------- tentaküller ---------- */
  spawnTentacle(x, baseY, once) {
    const spr = this.add.image(x, baseY, 'tentTex').setOrigin(0.5, 1).setDepth(6);
    spr.setScale(1, 0.1);
    const t = { spr, x, baseY, state: once ? 'warn' : 'hidden', t: once ? 0.45 : Math.random()*1.4, once: !!once };
    this.tentacles.push(t);
    return t;
  }

  updateTentacles(time, dt) {
    const k = this.kai;
    for (let i = this.tentacles.length-1; i >= 0; i--) {
      const t = this.tentacles[i];
      t.t -= dt;
      if (t.state === 'hidden') {
        t.spr.setScale(1, 0.1);
        if (t.t <= 0) { t.state = 'warn'; t.t = 0.5; }
      } else if (t.state === 'warn') {
        t.spr.x = t.x + Math.sin(time*0.06)*2.5;
        t.spr.setScale(1, 0.16);
        if (t.t <= 0) {
          t.state = 'up'; t.t = 0.16;
          if (Math.abs(t.x - k.spr.x) < 600) { AudioManager.tentacleSlam(); this.shakeSmall(); }
        }
      } else if (t.state === 'up') {
        t.spr.setScale(1, Math.min(1, 1 - t.t/0.16));
        if (t.t <= 0) { t.state = 'hold'; t.t = t.once ? 0.7 : 1.2; }
      } else if (t.state === 'hold') {
        t.spr.setScale(1 + Math.sin(time*0.01)*0.04, 1);
        t.spr.x = t.x + Math.sin(time*0.004)*3;
        if (t.t <= 0) { t.state = 'down'; t.t = 0.25; }
      } else if (t.state === 'down') {
        t.spr.setScale(1, Math.max(0.1, t.t/0.25));
        if (t.t <= 0) {
          if (t.once) { t.spr.destroy(); this.tentacles.splice(i,1); continue; }
          t.state = 'hidden'; t.t = 1.5 + Math.random();
        }
      }
      const sc = t.spr.scaleY;
      if (sc > 0.45 && !k.dead) {
        const top = t.baseY - 160*sc;
        if (Math.abs(k.spr.x - t.x) < 22 && k.spr.y + 20 > top && k.spr.y < t.baseY + 10) {
          this.damageKai(1, t.x);
        }
      }
    }
  }

  /* ---------- fırlatılanlar (kemik/kaya) ---------- */
  lobThrow(x, y, tx, big) {
    const o = this.lobbed.create(x, y, 'boneTex');
    if (big) o.setScale(1.8);
    const dt2 = 0.9;
    o.setVelocity((tx - x)/dt2, -420);
    o.setAngularVelocity(300);
    o.setData('big', !!big);
    this.time.delayedCall(4000, () => { if (o.active) o.destroy(); });
  }
  lobLand(o) {
    if (!o.active) return;
    const k = this.kai;
    const big = o.getData('big');
    this.burstBone.explode(big?14:8, o.x, o.y);
    AudioManager.hitBat();
    if (Phaser.Math.Distance.Between(o.x,o.y,k.spr.x,k.spr.y) < (big?90:55)) this.damageKai(big?2:1, o.x);
    o.destroy();
  }

  /* ---------- şok dalgası (boss yer vuruşu) ---------- */
  shockwave(x, y, range, dmg) {
    const g = this.add.graphics().setDepth(7);
    const state = { r: 20 };
    AudioManager.golemStomp();
    this.cameras.main.shake(260, 0.01);
    this.tweens.add({
      targets: state, r: range, duration: 460, ease:'Cubic.out',
      onUpdate: () => {
        g.clear();
        g.lineStyle(4, 0xBDB4A4, 0.7 * (1 - state.r/range));
        g.strokeCircle(x, y, state.r);
        const k = this.kai;
        const onG = k.spr.body.blocked.down || k.spr.body.touching.down;
        if (onG && !k.dead && Math.abs(state.r - Math.abs(k.spr.x - x)) < 26 && Math.abs(k.spr.y - y) < 80) {
          this.damageKai(dmg, x);
        }
      },
      onComplete: () => g.destroy()
    });
  }

  /* ============================ BOSSLAR ============================= */

  createBoss(def) {
    const mk = (tex, w, h, yOff, gravity) => {
      const spr = this.physics.add.sprite(def.x, GROUND_Y - yOff, tex);
      spr.body.setSize(w, h);
      spr.body.allowGravity = gravity;
      if (!gravity) spr.body.setImmovable(true);
      spr.setDepth(5);
      if (gravity) this.physics.add.collider(spr, this.solids);
      const e = { type:def.type, spr, def:{eyes:[],eyeC:0}, hp:def.hp, alive:true, boss:true,
                  dir:-1, x0:0, x1:0, stunUntil:0, retreatUntil:0, leapCd:0, state:'idle', stateT:0, shots:0, ph:0 };
      spr.setData('e', e);
      this.enemyG.add(spr);
      this.enemies.push(e);
      return e;
    };
    const names = { warden:T('b20'), choir:T('b50'), golem:T('b80'), deepone:T('b100') };

    if (def.type === 'warden') {
      const e = mk('wardenTex', 90, 80, 48, true);
      this.bossData = { type:'warden', hp:def.hp, maxHp:def.hp, name:names.warden, e, attackT:2.2 };
    } else if (def.type === 'choir') {
      const e = mk('choirTex', 70, 86, 220, false);
      this.bossData = { type:'choir', hp:def.hp, maxHp:def.hp, name:names.choir, e,
                        baseY:GROUND_Y-220, attackT:2.6, summonT:5.5, minions:0 };
    } else if (def.type === 'golem') {
      const e = mk('golemTex', 120, 130, 75, true);
      e.vulnUntil = 0;
      this.bossData = { type:'golem', hp:def.hp, maxHp:def.hp, name:names.golem, e, attackT:2.8 };
      this.envLights.push({ img:e.spr, r:120 });
    } else {
      /* DERİNLERDEN GELEN — kör dev */
      const baseY = GROUND_Y - 140;
      const e = mk('octoTex', 200, 140, 140, false);
      const parts = [];
      for (let i=0;i<4;i++) {
        const tx = def.x - 260 + i*170;
        const ts = this.add.image(tx, GROUND_Y, 'tentTex').setOrigin(0.5,1).setDepth(4).setScale(1, 0.8+Math.random()*0.35);
        this.tweens.add({ targets:ts, scaleY:ts.scaleY*0.85, duration:1500+i*280, yoyo:true, repeat:-1, ease:'Sine.inOut' });
        parts.push(ts);
      }
      this.aware = 0;
      this.perceivedX = def.x - 700;
      this.bossData = { type:'deepone', hp:def.hp, maxHp:def.hp, name:names.deepone, e,
                        baseY, baseX:def.x, parts, attackT:3, dipT:5, dipping:0, pulseT:2 };
      this.envLights.push({ img:e.spr, r:170 });
      AudioManager.bossRoar();
    }
  }

  updateBoss(time, dt) {
    const bd = this.bossData;
    if (!bd || !bd.e.alive) return;
    const e = bd.e, spr = e.spr, b = spr.body, k = this.kai;
    const dx = k.spr.x - spr.x, dist = Math.abs(dx);
    const rage = 1 - bd.hp / bd.maxHp;

    if (bd.type === 'warden') {
      if (dist > 1100 || k.dead) { b.velocity.x = 0; return; }
      const onG = b.blocked.down;
      bd.attackT -= dt;
      spr.setFlipX(dx < 0);
      if (time < e.stunUntil) { b.velocity.x = 0; return; }
      if (bd.attackT <= 0 && onG) {
        bd.attackT = 3.2 - rage*1.3;
        const roll = Math.random();
        if (roll < 0.45) {
          /* sıçrayıp yere çakılır → şok dalgası */
          b.velocity.y = -640;
          b.velocity.x = Math.sign(dx) * Math.min(380, dist*1.1);
          bd.slamPending = true;
          AudioManager.bossRoar();
        } else if (roll < 0.75) {
          this.lobThrow(spr.x, spr.y-40, k.spr.x, false);
          AudioManager.whoosh();
        } else {
          b.velocity.x = Math.sign(dx) * 300;   // öfke koşusu
          this.time.delayedCall(700, () => { if (e.alive) b.velocity.x = 0; });
        }
      } else if (onG && Math.abs(b.velocity.x) < 60) {
        b.velocity.x = Math.sign(dx) * 88;
      }
      if (bd.slamPending && onG && b.velocity.y >= 0) {
        bd.slamPending = false;
        this.shockwave(spr.x, GROUND_Y, 320, 2);
      }
      if (!k.dead && dist < 64 && Math.abs(k.spr.y - spr.y) < 70) this.damageKai(2, spr.x);

    } else if (bd.type === 'choir') {
      spr.y = bd.baseY + Math.sin(time*0.0014)*30;
      spr.setFlipX(dx < 0);
      if (dist > 1100 || k.dead) return;
      /* yakına gelirse ışınlanır */
      if (dist < 130 && !bd.teleporting) {
        bd.teleporting = true;
        this.tweens.add({ targets:spr, alpha:0, duration:240, onComplete:() => {
          spr.x = k.spr.x + (Math.random()<0.5?-1:1)*320;
          this.tweens.add({ targets:spr, alpha:1, duration:240, onComplete:()=>{ bd.teleporting=false; } });
        }});
        AudioManager.whisper();
      }
      bd.summonT -= dt;
      if (bd.summonT <= 0) {
        bd.summonT = 6.5 - rage*2.4;
        let alive = 0;
        for (const e2 of this.enemies) if (e2.alive && e2.type==='wraith') alive++;
        if (alive < 5) {
          this.spawnEnemy('wraith', spr.x-90, spr.y-30);
          if (rage > 0.4) this.spawnEnemy('wraith', spr.x+90, spr.y-10);
          AudioManager.choirScream();
          this.burstDark.explode(16, spr.x, spr.y);
        }
      }
      bd.attackT -= dt;
      if (bd.attackT <= 0 && !k.dead) {
        bd.attackT = 3.4 - rage*1.4;
        /* çığlık: telegraf + geniş alan hasarı */
        this.tweens.add({ targets:spr, scaleX:1.18, scaleY:1.18, duration:600, yoyo:true });
        this.time.delayedCall(620, () => {
          if (!e.alive) return;
          AudioManager.choirScream();
          this.cameras.main.shake(300, 0.009);
          this.burstWhite.explode(24, spr.x, spr.y);
          if (Math.abs(k.spr.x - spr.x) < 260 && !k.dead) {
            this.damageKai(1, spr.x);
            k.spr.body.velocity.x = Math.sign(k.spr.x - spr.x) * 420;
          }
        });
      }

    } else if (bd.type === 'golem') {
      if (dist > 1200 || k.dead) { b.velocity.x = 0; return; }
      spr.setFlipX(dx < 0);
      const onG = b.blocked.down;
      const vulnerable = time < e.vulnUntil;
      if (!vulnerable) {
        spr.setAlpha(1);
      } else {
        spr.setAlpha(0.85 + Math.sin(time*0.02)*0.15);
        if (Math.random() < 0.1) this.burstWarm.explode(2, spr.x, spr.y-2);
      }
      bd.attackT -= dt;
      if (bd.attackT <= 0 && onG) {
        bd.attackT = 3.6 - rage*1.4;
        if (Math.random() < 0.55 || dist < 200) {
          /* yeri döver: çift şok dalgası + çekirdek 2.2sn açılır */
          this.time.delayedCall(450, () => {
            if (!e.alive) return;
            this.shockwave(spr.x, GROUND_Y, 360, 2);
            e.vulnUntil = this.time.now + 2200;
          });
          this.tweens.add({ targets:spr, y:spr.y-26, duration:420, yoyo:true, ease:'Sine.out' });
        } else {
          this.lobThrow(spr.x, spr.y-60, k.spr.x + (Math.random()-0.5)*80, true);
          AudioManager.whoosh();
        }
      } else {
        b.velocity.x = Math.sign(dx) * (vulnerable ? 22 : 56);
      }
      if (!k.dead && dist < 80 && Math.abs(k.spr.y - spr.y) < 90) this.damageKai(2, spr.x);

    } else if (bd.type === 'deepone') {
      /* === KÖR DEV: ışığı duyar, sesi görür === */
      const inArena = dist < 2400;
      if (!inArena) { UI.setAware(0, false, false); return; }

      /* farkındalık birikimi */
      let gain = 0;
      if (k.lanternOn && k.battery > 0) gain += 0.16;
      gain += k.noise * 0.3;
      if (gain > 0.01) this.aware = Math.min(1, this.aware + gain*dt);
      else this.aware = Math.max(0, this.aware - 0.055*dt);

      /* algılanan konum: fişek > yüksek farkındalık > sürüklenme */
      const flare = this.activeFlare();
      if (flare) {
        this.perceivedX += (flare.x - this.perceivedX) * Math.min(1, dt*3);
        this.aware = Math.max(this.aware, 0.35);
      } else if (this.aware > 0.45) {
        this.perceivedX += (k.spr.x - this.perceivedX) * Math.min(1, dt*(1+this.aware*3));
      } else {
        this.perceivedX += Math.sin(time*0.0006) * 18 * dt;
      }

      UI.setAware(this.aware, this.aware > 0.6, true);

      /* baş salınımı + periyodik alçalma */
      bd.dipT -= dt;
      if (bd.dipT <= 0) { bd.dipping = bd.dipping > 0 ? 0 : 2.2; bd.dipT = bd.dipping > 0 ? 2.2 : 4.4 - rage; }
      if (bd.dipping > 0) bd.dipping -= dt;
      const targetY = bd.baseY + (bd.dipping > 0 ? 92 : 0);
      spr.y += (targetY + Math.sin(time*0.0012)*26 - spr.y) * Math.min(1, dt*2.2);
      spr.x = bd.baseX + Math.sin(time*0.0008)*34;

      /* nabız: farkındalık arttıkça derin vuruşlar sıklaşır */
      bd.pulseT -= dt;
      if (bd.pulseT <= 0) {
        bd.pulseT = 2.4 - this.aware*1.6;
        AudioManager.deepPulse();
        if (this.aware > 0.6) this.cameras.main.shake(120, 0.003);
      }

      /* saldırılar */
      bd.attackT -= dt;
      if (bd.attackT <= 0 && !k.dead) {
        bd.attackT = (3.4 - rage*1.6) * (1.25 - this.aware*0.5);
        const spread = (1 - this.aware) * 280 + 40;
        const px = this.perceivedX;
        const roll = Math.random();
        if (this.aware > 0.8 && dist < 320 && roll < 0.4) {
          /* KAPMA: tam isabet, çok ağır */
          const gx = k.spr.x;
          const warn = this.add.image(gx, GROUND_Y-6, 'redGlowTex').setDepth(4).setScale(0.5).setAlpha(0);
          this.tweens.add({ targets:warn, alpha:1, scale:1.6, duration:430,
            onComplete:() => {
              warn.destroy();
              this.spawnTentacle(gx, GROUND_Y, true);
              if (Math.abs(k.spr.x - gx) < 40 && !k.dead) this.damageKai(3, gx);
            } });
          AudioManager.bossRoar();
        } else if (roll < 0.55) {
          /* tentakül yaylımı: algılanan konum çevresine 3-5 vuruş */
          const count = 3 + Math.floor(rage*2) + (this.aware>0.7?1:0);
          for (let i=0;i<count;i++) {
            const tx = px + (Math.random()-0.5)*spread*2;
            this.time.delayedCall(i*280, () => {
              if (!e.alive) return;
              const warn = this.add.image(tx, GROUND_Y-6, 'redGlowTex').setDepth(4).setScale(0.4).setAlpha(0);
              this.tweens.add({ targets:warn, alpha:0.85, scale:1.2, duration:480,
                onComplete:() => { warn.destroy(); this.spawnTentacle(tx, GROUND_Y, true); } });
            });
          }
        } else if (roll < 0.78) {
          let alive = 0;
          for (const e2 of this.enemies) if (e2.alive && !e2.boss) alive++;
          if (alive < 10) {
            this.spawnEnemy('wraith', spr.x-180, spr.y-40);
            this.spawnEnemy('skitter', spr.x-260, GROUND_Y-30);
            if (rage > 0.5) this.spawnEnemy('leech', spr.x-340, GROUND_Y-200, { ceil:true });
            AudioManager.splash();
          }
        } else {
          this.inkUntil = time + 2800;
          AudioManager.splash();
          UI.toast(T('t_ink'));
        }
      }
    }
  }

  bossDie(e) {
    const bd = this.bossData;
    if (!bd) return;
    UI.setBoss(0, false);
    UI.setAware(0, false, false);
    AudioManager.bossRoar();
    this.cameras.main.shake(500, 0.012);
    Haptics.boss();
    if (bd.parts) for (const p of bd.parts) {
      this.tweens.add({ targets:p, scaleY:0.05, duration:900, ease:'Sine.in', onComplete:()=>p.destroy() });
    }
    const wasDeepStory = bd.type === 'deepone' && this.mode === 'story' && this.levelN === 100;
    this.bossData = null;
    if (wasDeepStory) {
      this.time.delayedCall(700, () => this.runFinaleCutscene(e.spr.x));
      return;
    }
    const g = this.data0.gate || { x: e.spr.x + 160, y: GROUND_Y-70 };
    this.time.delayedCall(600, () => {
      this.spawnGate(g.x, g.y);
      this.burstWhite.explode(28, g.x, g.y);
      AudioManager.gate();
      UI.toast(T('t_boss_fell'));
    });
  }

  /* ========================= SİNEMATİKLER ======================== */

  cineDelay(ms) {
    if (this.cineSkipped) return Promise.resolve();
    return new Promise((res) => {
      const tm = this.time.delayedCall(ms, res);
      this.cineWaiters.push(() => { tm.remove(false); res(); });
    });
  }
  async cineSub(text, ms) {
    if (this.cineSkipped) return;
    UI.sub(text);
    await this.cineDelay(ms);
    UI.subHide();
    await this.cineDelay(260);
  }
  cineTween(cfg) {
    if (this.cineSkipped) return Promise.resolve();
    return new Promise((res) => {
      const tw = this.tweens.add(Object.assign({}, cfg, { onComplete:res }));
      this.cineWaiters.push(() => { tw.complete(); });
    });
  }
  skipCutscene() {
    if (!this.cine || this.cineSkipped) return;
    this.cineSkipped = true;
    UI.subHide();
    for (const w of this.cineWaiters) { try { w(); } catch (err) {} }
    this.cineWaiters = [];
  }
  cleanupCineActors() {
    for (const a of this.cineActors) { try { a.destroy(); } catch (err) {} }
    this.cineActors = [];
  }

  /* --- hikâye vuruşu: her 10 bölümde letterbox metin --- */
  async runBeatCutscene(lines) {
    this.cine = true;
    this.cineSkipped = false;
    this.kai.spr.body.moves = false;
    for (const line of lines) {
      if (this.cineSkipped) break;
      await this.cineSub(line, 2600);
    }
    this.cine = false;
    this.cineSkipped = true;
    UI.subHide();
    this.kai.spr.body.moves = true;
    UI.beginPlay(this);
  }

  /* --- AÇILIŞ: Mira'nın kaçırılışı --- */
  async runIntroCutscene() {
    this.cine = true;
    this.cineSkipped = false;
    this.cineRun = 0;
    const k = this.kai;
    k.spr.body.moves = false;
    const S = I18N.arr('intro');

    const gy = GROUND_Y;
    const mira = this.add.image(k.spr.x + 36, gy - 25, 'miraTex').setDepth(9);
    this.tweens.add({ targets:mira, angle:2, duration:900, yoyo:true, repeat:-1, ease:'Sine.inOut' });
    this.cineActors.push(mira);

    await this.cineDelay(700);

    this.cineRun = 0.5; k.facing = 1;
    const walk1 = this.cineTween({ targets:[k.spr], x:k.spr.x+290, duration:5600, ease:'Linear' });
    const walk2 = this.cineTween({ targets:[mira], x:mira.x+290, duration:5600, ease:'Linear' });
    await this.cineSub(S[0], 2500);
    await this.cineSub(S[1], 2500);
    await Promise.all([walk1, walk2]);
    this.cineRun = 0;

    this.cameras.main.shake(700, 0.005);
    AudioManager.splash();
    await this.cineSub(S[2], 1700);

    const gunmen = [];
    for (let i=0;i<3;i++) {
      const gm = this.add.image(k.spr.x + 560 + i*70, gy - 28, 'gunmanTex').setDepth(9).setFlipX(true);
      gunmen.push(gm); this.cineActors.push(gm);
    }
    await this.cineTween({ targets:gunmen, x:'-=260', duration:1400, ease:'Sine.out' });
    await this.cineSub(S[3], 2100);

    const octo = this.add.image(k.spr.x + 430, gy + 280, 'octoTex').setDepth(8).setScale(1.6);
    this.cineActors.push(octo);
    const t1 = this.add.image(mira.x - 20, gy, 'tentTex').setOrigin(0.5,1).setDepth(9).setScale(1,0.05);
    const t2 = this.add.image(mira.x + 22, gy, 'tentTex').setOrigin(0.5,1).setDepth(9).setScale(1,0.05);
    this.cineActors.push(t1, t2);
    AudioManager.bossRoar();
    this.cameras.main.shake(900, 0.012);
    Haptics.boss();
    const rise = this.cineTween({ targets:octo, y:gy - 20, duration:1300, ease:'Sine.out' });
    await this.cineTween({ targets:[t1,t2], scaleY:1, duration:350, ease:'Back.out' });
    AudioManager.tentacleSlam();
    await rise;

    await this.cineTween({ targets:mira, y:gy-120, angle:14, duration:500, ease:'Sine.out' });
    UI.sub(S[4]);
    AudioManager.hurt();
    await this.cineTween({ targets:[mira, t1, t2], y:'+=460', duration:750, ease:'Sine.in' });
    AudioManager.splash();
    UI.subHide();
    this.burstDark.explode(24, mira.x, gy);
    await this.cineTween({ targets:octo, y:gy + 340, duration:1100, ease:'Sine.in' });

    this.cineTween({ targets:gunmen, x:'+=700', duration:1500, ease:'Sine.in' });
    await this.cineDelay(900);

    await this.cineSub(S[5], 2600);
    this.endIntro();
  }

  endIntro() {
    if (!this.cine) return;
    this.cine = false;
    this.cineSkipped = true;
    this.cineRun = 0;
    this.cleanupCineActors();
    UI.subHide();
    this.kai.spr.body.moves = true;
    SaveSystem.data.story.introSeen = true;
    SaveSystem.save();
    UI.beginPlay(this);
  }

  /* --- FİNAL: kurtarma ve kavuşma --- */
  async runFinaleCutscene(bossX) {
    this.cine = true;
    this.cineSkipped = false;
    this.cineRun = 0;
    const k = this.kai;
    k.spr.body.moves = false;
    k.spr.body.velocity.x = 0;
    UI.setState('cutscene');
    const S = I18N.arr('finale');

    for (const e of this.enemies) if (e.alive && !e.boss) this.enemyDie(e);

    const gy = GROUND_Y;
    await this.cineSub(S[0], 2100);

    const cage = this.add.graphics().setDepth(8);
    const cx = Math.min(bossX, this.data0.width - 160);
    cage.lineStyle(5, 0x4A4458, 1);
    for (let i=-2;i<=2;i++) cage.lineBetween(cx+i*14, gy-92, cx+i*16, gy);
    cage.strokeEllipse(cx, gy-92, 70, 30);
    this.cineActors.push(cage);
    const mira = this.add.image(cx, gy-25, 'miraTex').setDepth(9).setAlpha(0);
    this.cineActors.push(mira);
    await this.cineDelay(700);
    this.burstWhite.explode(34, cx, gy-50);
    AudioManager.gate();
    cage.clear();
    await this.cineTween({ targets:mira, alpha:1, duration:600 });
    await this.cineSub(S[1], 1600);

    const meetX = (k.spr.x + cx) / 2;
    k.facing = k.spr.x < cx ? 1 : -1;
    this.cineRun = 0.8;
    mira.setFlipX(cx > k.spr.x);
    const r1 = this.cineTween({ targets:k.spr, x:meetX - 14*k.facing, duration:1100, ease:'Sine.inOut' });
    const r2 = this.cineTween({ targets:mira, x:meetX + 14*k.facing, duration:1100, ease:'Sine.inOut' });
    await Promise.all([r1, r2]);
    this.cineRun = 0;

    k.hugging = true;
    this.tweens.add({ targets:mira, angle:k.facing*6, duration:700, ease:'Sine.out' });
    AudioManager.hugBloom();
    Haptics.pickup();
    this.tweens.add({ targets:this, lightBoost:3.4, duration:2600, ease:'Sine.inOut' });
    this.burstWhite.explode(44, meetX, gy-50);
    this.burstWarm.explode(26, meetX, gy-40);

    await this.cineSub(S[2], 2200);
    await this.cineSub(S[3], 2600);
    await this.cineSub(S[4], 2900);

    const card = UI.el('level-card');
    card.querySelector('.lc-num').textContent = T('the_end_title');
    card.querySelector('.lc-name').textContent = T('end');
    card.classList.add('show');
    SaveSystem.completeLevel('story', 100);
    this.syncGear();
    await this.cineDelay(3400);
    card.classList.remove('show');

    this.cine = false;
    UI.fadeToBlack(() => {
      UI.toast(T('t_story_done'));
      UI.showMenu();
    }, 700);
  }
}

/* =========================== BAŞLAT ================================ */

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  backgroundColor: '#08080D',
  scale: { mode: Phaser.Scale.RESIZE, width: '100%', height: '100%' },
  physics: { default: 'arcade', arcade: { gravity: { y: PHYS.GRAVITY }, debug: false } },
  render: { antialias: true },
  scene: [GameScene]
};
window.game = new Phaser.Game(config);
</script>
