<script>
/* ======================= BÖLÜM ÜRETİCİ =============================
   Her bölüm sabit tohumla üretilir: aynı bölüm her zaman aynıdır.
   Zorluk bölüm numarasıyla ölçeklenir; aksiyon modu daha yoğundur.
   ================================================================== */

const GROUND_Y = 640;

function genLevel(mode, n) {
  const rnd = mulberry(levelSeed(mode, n));
  const story = mode === 'story';
  const d = story ? Math.min(1, n/100) : Math.min(1, 0.25 + (n/1000)*0.75);
  const isFinal = story && n === 100;
  const isMini = !isFinal && (story ? n % 25 === 0 : n % 50 === 0);

  const L = {
    mode, n, d,
    plats:[], oneways:[], movers:[], spikes:[], tentacles:[],
    enemies:[], pickups:[], chests:[],
    checkpoint:null, gate:null, boss:null,
    start:{ x:90, y:GROUND_Y-60 }, width:0
  };
  const safeSpots = [];
  const ground = (x,w) => {
    L.plats.push({ x, y:GROUND_Y, w, h:90 });
    for (let s = x+60; s < x+w-60; s += 90) safeSpots.push(s);
  };

  /* kullanılabilir düşmanlar */
  const pool = [];
  pool.push('crawler');
  if (story ? n>=3  : n>=1) pool.push('drifter');
  if (story ? n>=6  : n>=1) pool.push('stalker','stalker');
  if (story ? n>=10 : n>=3) pool.push('gunman');
  if (!story) pool.push('gunman','stalker');
  const pickEnemy = () => pool[Math.floor(rnd()*pool.length)];

  if (isFinal || isMini) {
    /* ---------- boss arenası ---------- */
    ground(0, 700);
    // arenadan önce hazırlık: sandık (boss öncesi silah garantili) + pil
    L.chests.push({ x:380, y:GROUND_Y-14, loot: isFinal ? 'pistol' : 'best' });
    L.pickups.push({ x:520, y:GROUND_Y-40, type:'battery' });
    L.pickups.push({ x:580, y:GROUND_Y-40, type:'heart' });
    const arenaW = isFinal ? 2300 : 1700;
    ground(700, arenaW);
    L.oneways.push({ x:1000, y:GROUND_Y-150, w:170 });
    L.oneways.push({ x:1500, y:GROUND_Y-210, w:170 });
    if (isFinal) L.oneways.push({ x:2000, y:GROUND_Y-160, w:170 });
    L.boss = {
      type: isFinal ? 'octopus' : 'brute',
      x: 700 + arenaW - 360,
      hp: isFinal ? 34 : Math.round(12 + d*14)
    };
    L.checkpoint = { x: 640, y: GROUND_Y-23 };
    L.width = 700 + arenaW;
    if (!isFinal) L.gate = { x: L.width - 120, y: GROUND_Y-70, hidden:true };
    return L;
  }

  /* ---------- normal bölüm ---------- */
  const targetW = story
    ? Math.min(5000, 2300 + n*26)
    : Math.min(5600, 2600 + Math.min(n,500)*5);
  let x = 0;
  ground(0, 460);                       // güvenli başlangıç
  x = 460;
  let enemyBudget = Math.round((story ? 4 : 6) + d*(story ? 10 : 16));
  let chestBudget = 1 + (rnd() < (story ? 0.5 : 0.8) ? 1 : 0);
  const heartWant = 2 + (d > 0.5 ? 1 : 0) + (rnd()<0.3?1:0);
  const battWant = Math.ceil(targetW / 1400);
  let hearts = 0, batts = 0;

  const dropEnemy = (ex, ey, forceType) => {
    if (enemyBudget <= 0) return;
    enemyBudget--;
    L.enemies.push({ type: forceType || pickEnemy(), x:ex, y:ey });
  };

  while (x < targetW) {
    const roll = rnd();

    if (roll < 0.3) {
      /* düz koşu — devriye düşmanları */
      const w = 300 + rnd()*280;
      ground(x, w);
      if (rnd() < 0.45 + d*0.4) dropEnemy(x+w*0.5, GROUND_Y-30);
      if (!story && rnd() < 0.35) dropEnemy(x+w*0.75, GROUND_Y-30);
      if (rnd() < 0.3 && hearts < heartWant) {
        L.oneways.push({ x:x+w*0.3, y:GROUND_Y-170, w:130 });
        L.pickups.push({ x:x+w*0.3+65, y:GROUND_Y-210, type:'heart' });
        hearts++;
      }
      x += w;

    } else if (roll < 0.48) {
      /* uçurum — altta boşluk */
      const gw = Math.min(210, 95 + d*120 + rnd()*40);
      if (gw > 150 && rnd() < 0.5) {
        L.oneways.push({ x:x+gw/2-55, y:GROUND_Y-90-rnd()*60, w:110 });
      }
      if (rnd() < d*0.5 && (story ? n>=30 : n>=15)) {
        L.tentacles.push({ x:x+gw/2, y:GROUND_Y+80 });
      } else if (rnd() < 0.35) {
        L.enemies.push({ type:'drifter', x:x+gw/2, y:GROUND_Y-180 });
      }
      x += gw;
      const w = 220 + rnd()*200;
      ground(x, w);
      x += w;

    } else if (roll < 0.64) {
      /* diken şeridi + üstten geçiş */
      const w = 200 + rnd()*160;
      ground(x, w);
      L.spikes.push({ x:x+40, y:GROUND_Y, w:w-80 });
      L.oneways.push({ x:x+20, y:GROUND_Y-120, w:120 });
      L.oneways.push({ x:x+w-140, y:GROUND_Y-150-d*40, w:120 });
      if (rnd() < 0.4 && batts < battWant) {
        L.pickups.push({ x:x+w/2, y:GROUND_Y-220, type:'battery' });
        L.oneways.push({ x:x+w/2-60, y:GROUND_Y-185, w:120 });
        batts++;
      }
      x += w;

    } else if (roll < 0.78) {
      /* yükselen kuleler — duvar zıplaması */
      const w = 380 + rnd()*180;
      ground(x, w);
      const px = x + 90;
      const towerH = 2 + Math.floor(rnd()*2);
      L.plats.push({ x:px, y:GROUND_Y-64*towerH, w:64, h:64*towerH });
      L.oneways.push({ x:px+130, y:GROUND_Y-100-towerH*40, w:120 });
      if (rnd() < 0.5) {
        L.pickups.push({
          x:px+190, y:GROUND_Y-150-towerH*40,
          type:(batts<battWant ? (batts++, 'battery') : (hearts<heartWant ? (hearts++,'heart') : 'battery'))
        });
      }
      if (rnd() < 0.4 + d*0.3) dropEnemy(x+w-110, GROUND_Y-30, rnd()<0.5?'stalker':undefined);
      x += w;

    } else if (roll < 0.88 && chestBudget > 0) {
      /* gizli oyuk — sandık (oyuncu arasın) */
      const w = 300 + rnd()*140;
      ground(x, w);
      L.plats.push({ x:x+w*0.45, y:GROUND_Y-170, w:150, h:24 });   // saçak gölgesi
      L.chests.push({ x:x+w*0.45+75, y:GROUND_Y-14, loot:'random' });
      chestBudget--;
      if (rnd() < 0.5 + d*0.3) dropEnemy(x+w*0.2, GROUND_Y-30);
      x += w;

    } else {
      /* pusu arenası */
      const w = 420 + rnd()*200;
      ground(x, w);
      dropEnemy(x+w*0.35, GROUND_Y-30);
      if (d > 0.25) dropEnemy(x+w*0.6, GROUND_Y-30);
      if (!story && d > 0.4) dropEnemy(x+w*0.8, GROUND_Y-30, 'gunman');
      L.oneways.push({ x:x+w*0.4, y:GROUND_Y-160, w:150 });
      x += w;
    }
  }

  /* eksik kalan kalp/pil — güvenli noktalara serpiştir */
  const spot = () => safeSpots[Math.floor(rnd()*safeSpots.length)];
  while (batts < battWant && safeSpots.length) { L.pickups.push({ x:spot(), y:GROUND_Y-40, type:'battery' }); batts++; }
  while (hearts < heartWant && safeSpots.length) { L.pickups.push({ x:spot(), y:GROUND_Y-40, type:'heart' }); hearts++; }

  /* her bölümde en az bir gizli sandık + asgari düşman garantisi */
  const farSpots = safeSpots.filter((sx) => sx > 650);
  const farSpot = () => farSpots.length ? farSpots[Math.floor(rnd()*farSpots.length)] : spot();
  if (!L.chests.length && safeSpots.length) {
    L.chests.push({ x: farSpot(), y: GROUND_Y-14, loot:'random' });
  }
  const minEnemies = story ? Math.min(3 + Math.floor(n/10), 8) : 5 + Math.floor(d*5);
  while (L.enemies.length < minEnemies && farSpots.length) {
    L.enemies.push({ type: pickEnemy(), x: farSpot(), y: GROUND_Y-30 });
  }

  /* finiş alanı */
  ground(x, 420);
  L.gate = { x:x+300, y:GROUND_Y-70 };
  L.width = x + 420;

  /* denetim taşı: ~%55 */
  let best = safeSpots[0] || 300;
  for (const s of safeSpots) if (Math.abs(s - L.width*0.55) < Math.abs(best - L.width*0.55)) best = s;
  L.checkpoint = { x:best, y:GROUND_Y-23 };

  return L;
}

/* =========================== OYUN SAHNESİ ========================== */

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  init(data) {
    this.mode = (data && data.mode) || 'story';
    this.levelN = (data && data.level) || 1;
    this.attract = (data && 'attract' in data) ? !!data.attract : true;
  }

  create() {
    generateTextures(this);
    generateParallax(this);

    this.paused = false;
    this.playing = false;
    this.completing = false;
    this.cine = false;
    this.cineSkipped = false;
    this.cineWaiters = [];
    this.cineActors = [];
    this.lightBoost = 1;
    this.inkUntil = 0;
    this.cineRun = 0;
    this.shakeSmall = () => this.cameras.main.shake(120, 0.004);

    this.data0 = genLevel(this.mode, this.levelN);
    const L = this.data0;

    this.physics.world.setBounds(0, -400, L.width, 1300);
    this.physics.world.setBoundsCollision(true, true, false, false);
    this.physics.world.gravity.y = PHYS.GRAVITY;

    this.buildParallax();
    this.buildLevel(L);
    this.setupKai(L);
    this.setupParticles();
    this.setupLighting();

    /* kamera */
    const cam = this.cameras.main;
    cam.setBounds(0, -60, L.width, 800);
    cam.startFollow(this.kai.spr, false, 0.12, 0.12);
    cam.setZoom(Math.max(0.6, this.scale.height / 720));
    this.scale.on('resize', this.onResize, this);
    this.events.once('shutdown', () => this.scale.off('resize', this.onResize, this));

    /* klavye */
    this.keys = this.input.keyboard.addKeys('A,D,W,S,LEFT,RIGHT,UP,DOWN,SPACE,J,E,K');

    if (this.data0.boss) this.createBoss(this.data0.boss);

    if (this.attract) {
      cam.stopFollow();
      cam.centerOn(this.kai.spr.x + 80, GROUND_Y - 160);
    } else {
      UI.setLevelLabel(this.mode, this.levelN);
      UI.levelReady(this);
    }
  }

  onResize() {
    const cam = this.cameras.main;
    cam.setZoom(Math.max(0.6, this.scale.height / 720));
    if (this.darkRT) { this.darkRT.destroy(); this.darkRT = null; }
    this.setupLighting();
  }

  /* ---------- paralaks ---------- */
  buildParallax() {
    const W = 2200;
    this.sky = this.add.image(0,0,'skyTex').setDisplaySize(W,760).setDepth(-12);
    this.eclipse = this.add.image(0,0,'eclipseTex').setDepth(-11).setAlpha(0.8);
    this.bgRidge = this.add.tileSprite(0,0,W,320,'bgRidge').setDepth(-10);
    this.bgMid   = this.add.tileSprite(0,0,W,420,'bgMid').setDepth(-9);
    this.bgFore  = this.add.tileSprite(0,0,W,160,'bgFore').setDepth(-8).setAlpha(0.9);
  }

  updateParallax() {
    const cam = this.cameras.main;
    const cx = cam.midPoint.x, cy = cam.midPoint.y;
    this.sky.setPosition(cx, cy);
    this.eclipse.setPosition(cx + 180 - cam.scrollX*0.04, cy - 190);
    this.bgRidge.setPosition(cx, cy - 30);
    this.bgRidge.tilePositionX = cam.scrollX * 0.12;
    this.bgMid.setPosition(cx, cy + 60);
    this.bgMid.tilePositionX = cam.scrollX * 0.3;
    this.bgFore.setPosition(cx, cy + 300);
    this.bgFore.tilePositionX = cam.scrollX * 0.55;
    if (this.ash) this.ash.setPosition(cx, cam.worldView.y - 10);
  }

  /* ---------- bölüm inşası ---------- */
  buildLevel(L) {
    this.solids = this.physics.add.staticGroup();
    this.onewayG = this.physics.add.staticGroup();
    this.spikeG = this.physics.add.staticGroup();
    this.pickupG = this.physics.add.staticGroup();
    this.enemyG = this.physics.add.group();
    this.pBullets = this.physics.add.group({ allowGravity:false });
    this.eBullets = this.physics.add.group({ allowGravity:false });
    this.enemies = [];
    this.tentacles = [];
    this.chests = [];
    this.envLights = [];
    this.movers = [];

    for (const p of L.plats) {
      const img = this.solids.create(p.x + p.w/2, p.y + p.h/2, 'platTex');
      img.setDisplaySize(p.w, p.h).refreshBody();
    }
    for (const o of L.oneways) {
      const img = this.onewayG.create(o.x + o.w/2, o.y + 7, 'onewayTex');
      img.setDisplaySize(o.w, 14).refreshBody();
      img.body.checkCollision.down = false;
      img.body.checkCollision.left = false;
      img.body.checkCollision.right = false;
    }
    for (const s of L.spikes) {
      const img = this.spikeG.create(s.x + s.w/2, s.y - 14, 'spikeTex');
      img.setDisplaySize(s.w, 28).refreshBody();
      img.body.setSize(s.w, 16); img.body.setOffset(0, 12);
    }
    for (const t of L.tentacles) this.spawnTentacle(t.x, t.y);
    for (const pk of L.pickups) this.spawnPickup(pk.x, pk.y, pk.type);
    for (const c of L.chests) this.spawnChest(c.x, c.y, c.loot);
    for (const e of L.enemies) this.spawnEnemy(e.type, e.x, e.y);

    if (L.checkpoint) {
      this.checkpoint = this.add.image(L.checkpoint.x, L.checkpoint.y, 'checkTex').setDepth(2).setAlpha(0.8);
      this.checkpointGlow = this.add.image(L.checkpoint.x, L.checkpoint.y-8, 'warmGlowTex').setDepth(3).setScale(0.6).setAlpha(0);
      this.checkpointActive = false;
    }
    if (L.gate && !L.gate.hidden) this.spawnGate(L.gate.x, L.gate.y);
    this.respawnPoint = { x: L.start.x, y: L.start.y };
  }

  spawnGate(x, y) {
    this.gate = this.add.image(x, y, 'gateTex').setDepth(2);
    this.gateGlow = this.add.image(x, y, 'memGlowTex').setDepth(3).setScale(2.2).setAlpha(0.6);
    this.tweens.add({ targets:this.gateGlow, alpha:0.95, scale:2.6, duration:1400, yoyo:true, repeat:-1 });
    this.envLights.push({ img:this.gate, r:110, color:'pale' });
    this.gateZone = this.add.zone(x, y+20, 70, 130);
    this.physics.add.existing(this.gateZone, true);
  }

  spawnPickup(x, y, type) {
    const key = type === 'heart' ? 'heartTex' : 'battTex';
    const img = this.pickupG.create(x, y, key);
    img.setData('type', type);
    img.body.setSize(34, 40);
    const glow = this.add.image(x, y, type==='heart' ? 'redGlowTex' : 'memGlowTex')
      .setDepth(1).setScale(0.55).setAlpha(0.7);
    img.setData('glow', glow).setDepth(2);
    this.tweens.add({ targets:[img, glow], y:y-5, duration:1000+Math.random()*400, yoyo:true, repeat:-1, ease:'Sine.inOut' });
  }

  spawnChest(x, y, loot) {
    const img = this.add.image(x, y, 'chestTex').setDepth(2).setAlpha(0.5);
    const c = { x, y, img, loot, opened:false, glintT:0 };
    this.chests.push(c);
  }

  /* ---------- Kai ---------- */
  setupKai(L) {
    const spr = this.physics.add.sprite(L.start.x, L.start.y, 'pxTex');
    spr.setVisible(false);
    spr.body.setSize(24, 46);
    spr.body.setMaxVelocity(420, PHYS.MAX_FALL);
    spr.setCollideWorldBounds(true);

    this.kai = {
      spr, facing:1, hearts:BAL.START_HEARTS, maxHearts:BAL.MAX_HEARTS,
      battery:BAL.BATT_START, weapon:'none', ammo:0,
      coyoteUntil:0, bufferUntil:0, airJumps:1, wallLockUntil:0, wallDir:0, wallCoyoteUntil:0,
      prevJump:false, prevAction:false, attackCd:0, searchMs:0, nearChest:null,
      iframesUntil:0, dead:false, phase:0, squash:1, lean:0, stepAcc:0,
      wasOnGround:true, fallPeak:0, hugging:false, hidden:false
    };

    this.kaiGfx = this.add.graphics().setDepth(10);
    this.lanternGlow = this.add.image(spr.x, spr.y, 'glowTex').setDepth(12).setBlendMode(Phaser.BlendModes.ADD);
    this.swingGfx = this.add.graphics().setDepth(11);
    this.searchGfx = this.add.graphics().setDepth(56);
    this.laserGfx = this.add.graphics().setDepth(7);

    this.physics.add.collider(spr, this.solids);
    this.physics.add.collider(spr, this.onewayG);
    this.physics.add.collider(this.enemyG, this.solids);
    this.physics.add.collider(this.pBullets, this.solids, (b) => this.popBullet(b));
    this.physics.add.collider(this.eBullets, this.solids, (b) => this.popBullet(b));
    this.physics.add.overlap(spr, this.spikeG, () => this.damageKai(1, spr.x, true));
    this.physics.add.overlap(spr, this.pickupG, (_s, p) => this.collectPickup(p));
    this.physics.add.overlap(this.pBullets, this.enemyG, (b, eSpr) => {
      const e = eSpr.getData('e');
      if (e && e.alive) { this.popBullet(b); this.hitEnemy(e, 2, b.x); }
    });
    this.physics.add.overlap(spr, this.eBullets, (_s, b) => {
      this.popBullet(b);
      this.damageKai(1, b.x < spr.x ? spr.x-40 : spr.x+40);
    });
  }

  popBullet(b) {
    if (!b.active) return;
    this.burstWhite.explode(3, b.x, b.y);
    b.destroy();
  }

  /* ---------- parçacıklar ---------- */
  setupParticles() {
    const mk = (tint, extra) => this.add.particles(0, 0, 'pxTex', Object.assign({
      speed:{ min:40, max:170 }, lifespan:500, scale:{ start:1.4, end:0 },
      gravityY:240, emitting:false, tint
    }, extra || {})).setDepth(13);
    this.burstWarm  = mk(0xE8C97A);
    this.burstRed   = mk(0xE84A5F);
    this.burstWhite = mk(0xF0E8FF, { gravityY:60 });
    this.burstDark  = mk(0x232038, { gravityY:-30, speed:{min:15,max:60}, lifespan:700 });

    /* kül yağışı */
    this.ash = this.add.particles(0, 0, 'pxTex', {
      x:{ min:-900, max:900 }, y:-30,
      lifespan:7000, speedY:{ min:16, max:46 }, speedX:{ min:-14, max:10 },
      scale:{ start:0.8, end:0.3 }, alpha:{ start:0.4, end:0 },
      quantity:1, frequency:130, tint:0x6B6478
    }).setDepth(14);

    /* sis kümeleri */
    this.fogs = [];
    const rnd = mulberry(levelSeed(this.mode, this.levelN) ^ 0x55AA);
    for (let i=0; i<7; i++) {
      const f = this.add.image(rnd()*this.data0.width, 360+rnd()*260, 'fogTex')
        .setDepth(40).setScale(3.5+rnd()*3).setAlpha(0.5);
      this.tweens.add({ targets:f, x:f.x+(rnd()-0.5)*220, duration:9000+rnd()*8000, yoyo:true, repeat:-1, ease:'Sine.inOut' });
      this.fogs.push(f);
    }
  }

  /* ---------- ışıklandırma ---------- */
  setupLighting() {
    const cam = this.cameras.main;
    const zoom = Math.max(0.6, this.scale.height / 720);
    const vw = Math.ceil(this.scale.width / zoom) + 4;
    const vh = Math.ceil(this.scale.height / zoom) + 4;
    this.darkRT = this.add.renderTexture(0, 0, vw, vh).setOrigin(0).setDepth(50);
    this.spotImg = this.make.image({ key:'spotTex', add:false });
    this.vignette = this.add.image(0,0,'vignetteTex').setDepth(55).setAlpha(0).setDisplaySize(vw+8, vh+8);
  }

  updateLight(time) {
    if (!this.darkRT) return;
    const cam = this.cameras.main;
    const wv = cam.worldView;
    this.darkRT.setPosition(wv.x, wv.y);
    const k = this.kai;
    const pct = k.battery / BAL.BATT_MAX;
    let darkness = Math.min(0.965, 0.86 + (1-pct)*0.1);
    if (this.inkUntil && time < this.inkUntil) darkness = Math.min(0.975, darkness + 0.05);
    if (this.cine) darkness = 0.55;
    this.darkRT.clear();
    this.darkRT.fill(0x04040A, darkness);

    const flick = Math.sin(time*0.02)*1.6 + Math.sin(time*0.047)*1.4;
    let r = pct <= 0 ? 20 : BAL.LIGHT_R_MIN + (BAL.LIGHT_R_MAX-BAL.LIGHT_R_MIN)*pct + flick;
    r *= this.lightBoost;
    if (this.inkUntil && time < this.inkUntil) r *= 0.7;
    if (this.cine) r *= 2.2;
    const lx = k.spr.x + k.facing*8, ly = k.spr.y - 2;
    this.spotImg.setDisplaySize(r*2.6, r*2.6);
    this.darkRT.erase(this.spotImg, lx - wv.x, ly - wv.y);

    for (const el of this.envLights) {
      const ex = el.img.x, ey = el.img.y;
      if (ex < wv.x-200 || ex > wv.right+200) continue;
      this.spotImg.setDisplaySize(el.r*2.4, el.r*2.4);
      this.darkRT.erase(this.spotImg, ex - wv.x, ey - wv.y);
    }
    if (this.checkpointActive) {
      this.spotImg.setDisplaySize(190, 190);
      this.darkRT.erase(this.spotImg, this.checkpoint.x - wv.x, this.checkpoint.y - 10 - wv.y);
    }

    this.lanternGlow.setPosition(lx, ly);
    this.lanternGlow.setScale((r*2.6)/256 * 1.25);
    this.lanternGlow.setAlpha(pct <= 0 ? 0.06 : 0.5 + pct*0.3);

    this.vignette.setPosition(cam.midPoint.x, cam.midPoint.y);
    this.vignette.setAlpha(pct < 0.22 ? (0.22-pct)/0.22 * 0.85 : 0);
  }

  /* ---------- akış ---------- */
  beginPlay() {
    this.playing = true;
    UI.setHearts(this.kai.hearts, this.kai.maxHearts);
    UI.setBattery(this.kai.battery, true);
    UI.setWeapon(this.kai.weapon, this.kai.ammo);
    if (this.bossData) UI.setBoss(this.bossData.hp / this.bossData.maxHp, true, this.bossData.name);
  }

  enterAttract() {
    if (!this.attract) this.scene.restart({ mode:'story', level:1, attract:true });
  }

  setPaused(p) {
    this.paused = p;
    this.physics.world.isPaused = p;
    this.time.paused = p;
    if (p) this.tweens.pauseAll(); else this.tweens.resumeAll();
  }

  /* ---------- ana döngü ---------- */
  update(time, delta) {
    if (this.paused) return;
    const dt = Math.min(delta, 50) / 1000;
    this.updateParallax();
    this.updateLight(time);

    if (this.attract) { this.drawKai(time); return; }
    if (this.cine) { this.drawKai(time); this.drawCineActors(time); return; }
    if (!this.playing) return;

    this.updateKai(time, dt);
    this.drawKai(time);
    this.updateEnemies(time, dt);
    this.updateTentacles(time, dt);
    this.updateChests(time, dt);
    if (this.bossData) this.updateBoss(time, dt);

    /* pil */
    if (!SF_DEBUG.noDrain && !this.completing) {
      this.kai.battery = Math.max(0, this.kai.battery - BAL.BATT_DRAIN*dt);
    }
    if ((this._hudT = (this._hudT||0) + delta) > 180) {
      this._hudT = 0;
      UI.setBattery(this.kai.battery, true);
      AudioManager.setHeartbeat(this.kai.hearts <= 1 || this.kai.battery < 18);
    }

    /* hollow yakınlık vınlaması */
    let nearest = 9999;
    for (const e of this.enemies) if (e.alive) {
      const dd = Math.abs(e.spr.x - this.kai.spr.x);
      if (dd < nearest) nearest = dd;
    }
    AudioManager.setHumLevel(nearest < 260 ? 1 - nearest/260 : 0);

    /* denetim taşı */
    if (this.checkpoint && !this.checkpointActive &&
        Math.abs(this.kai.spr.x - this.checkpoint.x) < 34 &&
        Math.abs(this.kai.spr.y - this.checkpoint.y) < 60) {
      this.checkpointActive = true;
      this.respawnPoint = { x:this.checkpoint.x, y:this.checkpoint.y - 30 };
      this.kai.hearts = Math.max(this.kai.hearts, BAL.START_HEARTS);
      this.kai.battery = Math.max(this.kai.battery, 70);
      UI.setHearts(this.kai.hearts, this.kai.maxHearts);
      this.tweens.add({ targets:this.checkpointGlow, alpha:0.9, scale:1.1, duration:800 });
      this.burstWarm.explode(18, this.checkpoint.x, this.checkpoint.y-20);
      AudioManager.checkpoint(); Haptics.pickup();
      UI.showMonologue('Sıcak bir taş. Burada bir an durabilirim.');
    }

    /* finiş kapısı */
    if (this.gateZone && !this.completing &&
        this.physics.overlap(this.kai.spr, this.gateZone)) {
      this.completing = true;
      this.burstWhite.explode(30, this.gate.x, this.gate.y);
      this.tweens.add({ targets:[this.kaiGfx], alpha:0, duration:600 });
      UI.levelComplete(this.mode, this.levelN);
    }

    /* boşluğa düşme */
    if (this.kai.spr.y > 820 && !this.kai.dead) this.killKai();
  }

  /* ---------- Kai hareketi: yüksek kaliteli platform fiziği ---------- */
  updateKai(time, dt) {
    const k = this.kai, b = k.spr.body, keys = this.keys;
    if (k.dead) return;

    const left  = Input.tLeft  || keys.A.isDown || keys.LEFT.isDown;
    const right = Input.tRight || keys.D.isDown || keys.RIGHT.isDown;
    const jumpHeld = Input.tJump || keys.SPACE.isDown || keys.W.isDown || keys.UP.isDown;
    const actionHeld = Input.tAction || keys.J.isDown || keys.E.isDown || keys.K.isDown;

    const onGround = b.blocked.down;
    const now = time;

    /* --- yatay: ivmeli hızlanma / sürtünmeli yavaşlama --- */
    const wantDir = (right?1:0) - (left?1:0);
    const locked = now < k.wallLockUntil;
    if (!locked) {
      if (wantDir !== 0) {
        const accel = onGround ? PHYS.ACCEL_GROUND : PHYS.ACCEL_AIR;
        b.velocity.x += wantDir * accel * dt;
        if (Math.abs(b.velocity.x) > PHYS.MOVE_SPEED)
          b.velocity.x = Math.sign(b.velocity.x) * PHYS.MOVE_SPEED;
        k.facing = wantDir;
      } else {
        const fric = onGround ? PHYS.FRICTION_GROUND : PHYS.FRICTION_AIR;
        const dv = fric * dt;
        if (Math.abs(b.velocity.x) <= dv) b.velocity.x = 0;
        else b.velocity.x -= Math.sign(b.velocity.x) * dv;
      }
    }

    /* --- duvar kayması --- */
    const onWallL = !onGround && b.blocked.left && left;
    const onWallR = !onGround && b.blocked.right && right;
    if (onWallL || onWallR) {
      k.wallDir = onWallL ? -1 : 1;
      k.wallCoyoteUntil = now + PHYS.COYOTE_MS;
      if (b.velocity.y > PHYS.WALL_SLIDE) b.velocity.y = PHYS.WALL_SLIDE;
      if (Math.random() < 0.12) this.burstDark.explode(1, k.spr.x + k.wallDir*13, k.spr.y);
    }

    /* --- coyote & zıplama tamponu --- */
    if (onGround) { k.coyoteUntil = now + PHYS.COYOTE_MS; k.airJumps = 1; }
    const jumpPressed = jumpHeld && !k.prevJump;
    if (jumpPressed) k.bufferUntil = now + PHYS.BUFFER_MS;

    if (now < k.bufferUntil) {
      if (onGround || now < k.coyoteUntil) {
        b.velocity.y = PHYS.JUMP_VY;
        k.bufferUntil = 0; k.coyoteUntil = 0;
        k.squash = 1.25;
        AudioManager.jump(); Haptics.jump();
        this.burstDark.explode(4, k.spr.x, k.spr.y+22);
      } else if (now < k.wallCoyoteUntil) {
        b.velocity.x = -k.wallDir * PHYS.WALL_JUMP_VX;
        b.velocity.y = PHYS.WALL_JUMP_VY;
        k.wallLockUntil = now + PHYS.WALL_LOCK_MS;
        k.facing = -k.wallDir;
        k.bufferUntil = 0; k.wallCoyoteUntil = 0;
        AudioManager.doubleJump(); Haptics.jump();
        this.burstDark.explode(5, k.spr.x + k.wallDir*12, k.spr.y);
      } else if (k.airJumps > 0) {
        k.airJumps--;
        b.velocity.y = PHYS.DOUBLE_JUMP_VY;
        k.bufferUntil = 0;
        AudioManager.doubleJump(); Haptics.jump();
        this.burstWhite.explode(5, k.spr.x, k.spr.y+18);
      }
    }
    /* değişken zıplama: erken bırakınca kes */
    if (!jumpHeld && b.velocity.y < PHYS.JUMP_CUT_VY) b.velocity.y = PHYS.JUMP_CUT_VY;
    k.prevJump = jumpHeld;

    /* --- iniş: ezilme + ses --- */
    if (!onGround) k.fallPeak = Math.max(k.fallPeak, b.velocity.y);
    if (onGround && !k.wasOnGround) {
      if (k.fallPeak > 700) { AudioManager.landHard(); Haptics.land(); this.shakeSmall(); k.squash = 0.6; }
      else if (k.fallPeak > 250) { AudioManager.landSoft(); k.squash = 0.78; }
      this.burstDark.explode(Math.min(8, Math.round(k.fallPeak/120)), k.spr.x, k.spr.y+22);
      k.fallPeak = 0;
    }
    k.wasOnGround = onGround;
    k.squash += (1 - k.squash) * Math.min(1, dt*10);

    /* --- adım sesleri --- */
    if (onGround && Math.abs(b.velocity.x) > 50) {
      k.stepAcc += Math.abs(b.velocity.x) * dt;
      if (k.stepAcc > 56) { k.stepAcc = 0; AudioManager.footstep(); }
      k.phase += Math.abs(b.velocity.x) * dt * 0.055;
    } else {
      k.phase += dt * 1.6;
    }
    k.lean += ((b.velocity.x / PHYS.MOVE_SPEED) * 0.18 - k.lean) * Math.min(1, dt*8);

    /* --- yakındaki sandık / saldırı --- */
    k.nearChest = null;
    for (const c of this.chests) {
      if (!c.opened && Math.abs(c.x - k.spr.x) < 52 && Math.abs(c.y - k.spr.y) < 70) { k.nearChest = c; break; }
    }
    UI.setActionMode(!!k.nearChest);

    if (k.nearChest) {
      if (actionHeld) {
        k.searchMs += dt*1000;
        if (Math.floor(k.searchMs/150) !== Math.floor((k.searchMs-dt*1000)/150)) AudioManager.searchTick();
        if (k.searchMs >= BAL.SEARCH_MS) { this.openChest(k.nearChest); k.searchMs = 0; }
      } else k.searchMs = 0;
      this.drawSearchRing(k.nearChest, k.searchMs / BAL.SEARCH_MS);
    } else {
      k.searchMs = 0;
      this.searchGfx.clear();
      const actionPressed = actionHeld && !k.prevAction;
      if (actionPressed && now > k.attackCd) this.doAttack(now);
    }
    k.prevAction = actionHeld;
  }

  drawSearchRing(c, t) {
    const g = this.searchGfx;
    g.clear();
    if (t <= 0) {
      g.lineStyle(2, 0xD4C4F0, 0.35 + Math.sin(this.time.now*0.005)*0.15);
      g.strokeCircle(c.x, c.y - 36, 10);
      return;
    }
    g.lineStyle(3, 0xD4C4F0, 0.85);
    g.beginPath();
    g.arc(c.x, c.y - 36, 12, -Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(1,t));
    g.strokePath();
  }

  /* ---------- Kai çizimi: prosedürel iskelet animasyonu ---------- */
  drawKai(time) {
    const k = this.kai, g = this.kaiGfx;
    g.clear();
    if (k.dead || k.hidden) return;
    const spr = k.spr;
    const x = spr.x, yBase = spr.y;
    const sq = k.squash;
    const y = yBase + (1-sq)*9;
    const f = k.facing;
    const flicker = k.iframesUntil > time && Math.floor(time/80) % 2 === 0;
    if (flicker) return;

    const vx = spr.body ? spr.body.velocity.x : 0;
    const vy = spr.body ? spr.body.velocity.y : 0;
    const onG = spr.body ? spr.body.blocked.down : true;
    const runAmt = Math.max(this.cineRun || 0, Math.min(1, Math.abs(vx)/PHYS.MOVE_SPEED));
    const ph = k.phase;

    g.fillStyle(COLORS.SIL, 1);
    g.lineStyle(4.5, COLORS.SIL, 1);

    /* bacaklar */
    const hipX = x, hipY = y + 8*sq;
    if (!onG) {
      const tuck = vy < 0 ? 6 : 2;
      g.lineBetween(hipX, hipY, hipX - 5*f, hipY + 13 - tuck);
      g.lineBetween(hipX, hipY, hipX + 6*f, hipY + 11 - tuck*0.4);
    } else if (runAmt > 0.15) {
      const s1 = Math.sin(ph), s2 = Math.sin(ph + Math.PI);
      g.lineBetween(hipX, hipY, hipX + s1*9*f, hipY + 14 - Math.max(0,Math.cos(ph))*4);
      g.lineBetween(hipX, hipY, hipX + s2*9*f, hipY + 14 - Math.max(0,Math.cos(ph+Math.PI))*4);
    } else {
      const sway = Math.sin(ph)*0.8;
      g.lineBetween(hipX, hipY, hipX - 4 + sway, hipY + 14);
      g.lineBetween(hipX, hipY, hipX + 4 + sway, hipY + 14);
    }

    /* gövde — koşarken öne eğilir */
    const leanPx = k.lean * 26;
    const chestX = x + leanPx*0.5, chestY = y - 6*sq;
    g.lineStyle(0);
    g.fillRoundedRect(Math.min(hipX,chestX)-6, chestY-6, 12+Math.abs(chestX-hipX), (hipY-chestY)+14, 6);

    /* baş */
    const breathe = onG && runAmt < 0.15 ? Math.sin(time*0.0022)*1.2 : 0;
    const headX = chestX + leanPx*0.4, headY = chestY - 11 + breathe;
    g.fillCircle(headX, headY, 7.5);
    /* kapüşon ucu */
    g.fillTriangle(headX - 6*f, headY - 5, headX - 1*f, headY - 9, headX - 11*f, headY + 2);

    /* atkı — rüzgârda dalgalanır */
    g.lineStyle(3, 0x1A1428, 1);
    let sx = headX - 4*f, sy = headY + 6;
    for (let i=1; i<=3; i++) {
      const wob = Math.sin(time*0.006 + i) * (2 + runAmt*3) - runAmt*4;
      const nx = sx - f*(6+runAmt*5), ny = sy + 2 + wob*0.4;
      g.lineBetween(sx, sy, nx, ny);
      sx = nx; sy = ny;
    }

    /* kollar */
    g.lineStyle(4, COLORS.SIL, 1);
    if (k.hugging) {
      g.lineBetween(chestX, chestY, chestX + 13*f, chestY - 2);
      g.lineBetween(chestX, chestY+2, chestX + 12*f, chestY + 5);
    } else {
      const armSwing = onG && runAmt > 0.15 ? Math.sin(ph + Math.PI)*6 : Math.sin(time*0.0022)*1.4;
      g.lineBetween(chestX, chestY, chestX - (5+armSwing*0.4)*f, chestY + 9);
      /* fener kolu */
      const lanX = chestX + 10*f, lanY = chestY + 6 + Math.sin(time*0.003)*1.2;
      g.lineBetween(chestX, chestY, lanX, lanY);
      g.fillStyle(0x2A2438, 1);
      g.fillRoundedRect(lanX - 3.5, lanY, 7, 10, 2);
      g.fillStyle(COLORS.LANTERN, this.kai.battery > 0 ? 0.95 : 0.12);
      g.fillRect(lanX - 2, lanY + 2.5, 4, 5);
    }
  }

  /* ================= TOPLANABİLİRLER & SANDIKLAR ================= */

  collectPickup(p) {
    const type = p.getData('type');
    const k = this.kai;
    if (type === 'heart') {
      if (k.hearts >= k.maxHearts) return;        // doluysa yerinde kalır
      k.hearts++;
      UI.setHearts(k.hearts, k.maxHearts);
      UI.popHeart(k.hearts - 1);
      this.burstRed.explode(12, p.x, p.y);
      AudioManager.heart(); Haptics.pickup();
    } else {
      k.battery = Math.min(BAL.BATT_MAX, k.battery + BAL.BATT_PICKUP);
      UI.setBattery(k.battery, true);
      this.burstWhite.explode(12, p.x, p.y);
      AudioManager.battery(); Haptics.pickup();
    }
    const glow = p.getData('glow');
    if (glow) glow.destroy();
    p.destroy();
  }

  openChest(c) {
    c.opened = true;
    const k = this.kai;
    this.tweens.add({ targets:c.img, alpha:1, y:c.y-6, duration:300, yoyo:true });
    this.burstWarm.explode(16, c.x, c.y-8);
    AudioManager.chestOpen(); Haptics.pickup();
    this.searchGfx.clear();

    let loot = c.loot;
    if (loot === 'best') loot = (k.weapon === 'pistol') ? 'ammo' : 'pistol';
    if (loot === 'random') {
      if (k.weapon === 'none') loot = 'bat';
      else if (k.weapon === 'bat' && (this.mode === 'action' || this.levelN >= 8)) loot = 'pistol';
      else if (k.weapon === 'pistol') loot = Math.random() < 0.6 ? 'ammo' : 'battery';
      else loot = Math.random() < 0.5 ? 'battery' : 'heart';
    }
    const give = {
      bat:    () => { k.weapon='bat'; AudioManager.weaponFound(); UI.toast('🏏 SOPA BULDUN'); },
      pistol: () => { k.weapon='pistol'; k.ammo += 12; AudioManager.weaponFound(); UI.toast('🔫 TABANCA BULDUN · 12 MERMİ'); },
      ammo:   () => { k.ammo += 8; UI.toast('MERMİ +8'); AudioManager.battery(); },
      battery:() => { k.battery = Math.min(BAL.BATT_MAX, k.battery+BAL.BATT_PICKUP); UI.toast('PİL BULDUN'); AudioManager.battery(); },
      heart:  () => { if (k.hearts<k.maxHearts){k.hearts++; UI.setHearts(k.hearts,k.maxHearts);} UI.toast('KALP BULDUN'); AudioManager.heart(); }
    };
    (give[loot] || give.battery)();
    UI.setWeapon(k.weapon, k.ammo);
    UI.setBattery(k.battery, true);
  }

  updateChests(time, dt) {
    /* gizli sandıklar arada bir parıldar — dikkatli oyuncu fark eder */
    for (const c of this.chests) {
      if (c.opened) continue;
      c.glintT += dt;
      if (c.glintT > 2.4) {
        c.glintT = 0;
        if (Math.abs(c.x - this.kai.spr.x) < 700) this.burstWhite.explode(2, c.x, c.y-10);
      }
    }
  }

  /* ========================== SAVAŞ ============================== */

  doAttack(now) {
    const k = this.kai;
    if (k.weapon === 'pistol' && k.ammo > 0) {
      k.attackCd = now + BAL.SHOOT_CD_MS;
      k.ammo--;
      UI.setWeapon(k.weapon, k.ammo);
      const bx = k.spr.x + k.facing*16, by = k.spr.y - 4;
      const b = this.pBullets.create(bx, by, 'bulletTex');
      b.setVelocityX(620 * k.facing);
      b.setFlipX(k.facing < 0);
      this.burstWarm.explode(4, bx, by);
      this.time.delayedCall(1100, () => { if (b.active) b.destroy(); });
      AudioManager.shoot(); Haptics.shoot();
      return;
    }
    /* yakın dövüş: yumruk ya da sopa */
    const bat = k.weapon === 'bat';
    k.attackCd = now + BAL.MELEE_CD_MS;
    const range = bat ? 68 : 48;
    const dmg = bat ? 2 : 1;
    AudioManager.melee(); Haptics.attack();

    const g = this.swingGfx;
    g.clear();
    g.lineStyle(3, 0xD8D0C8, 0.8);
    g.beginPath();
    g.arc(k.spr.x, k.spr.y-2, range-8, (k.facing>0?-0.9:Math.PI-0.9), (k.facing>0?0.9:Math.PI+0.9));
    g.strokePath();
    this.time.delayedCall(110, () => g.clear());

    let hitAny = false;
    for (const e of this.enemies) {
      if (!e.alive) continue;
      const dx = e.spr.x - k.spr.x, dy = Math.abs(e.spr.y - k.spr.y);
      if (Math.sign(dx) === k.facing && Math.abs(dx) < range + 18 && dy < 60) {
        this.hitEnemy(e, dmg, k.spr.x);
        hitAny = true;
      }
    }
    if (hitAny) AudioManager.meleeHit();
  }

  hitEnemy(e, dmg, fromX) {
    if (!e.alive) return;
    e.hp -= dmg;
    e.stunUntil = this.time.now + 280;
    if (e.type === 'stalker') e.retreatUntil = this.time.now + 1100;
    e.spr.setTintFill(0xF0E8FF);
    this.time.delayedCall(90, () => { if (e.spr.active) e.spr.clearTint(); });
    if (e.spr.body && !e.spr.body.immovable) {
      e.spr.body.velocity.x = (e.spr.x < fromX ? -1 : 1) * 190;
      e.spr.body.velocity.y = -120;
    }
    AudioManager.enemyHit();
    if (e.isBoss && this.bossData) {
      this.bossData.hp = Math.max(0, e.hp);
      UI.setBoss(this.bossData.hp / this.bossData.maxHp, true, this.bossData.name);
      if (e.hp > 0 && Math.random() < 0.3) AudioManager.bossRoar();
    }
    if (e.hp <= 0) this.enemyDie(e);
  }

  enemyDie(e) {
    e.alive = false;
    AudioManager.enemyDie();
    this.burstDark.explode(16, e.spr.x, e.spr.y);
    /* düşüşler */
    if (e.type === 'gunman') {
      if (this.kai.weapon === 'pistol') { this.kai.ammo += 5; UI.setWeapon('pistol', this.kai.ammo); UI.toast('MERMİ +5'); }
      else this.spawnPickup(e.spr.x, e.spr.y - 20, 'battery');
    } else if (e.type === 'stalker' && Math.random() < 0.22) {
      this.spawnPickup(e.spr.x, e.spr.y - 20, 'heart');
    }
    const spr = e.spr;
    this.tweens.add({ targets:spr, alpha:0, scaleX:spr.scaleX*0.5, scaleY:spr.scaleY*0.5, duration:340,
      onComplete:() => spr.destroy() });
    if (e.isBoss) this.bossDie(e);
  }

  damageKai(n, srcX, spike) {
    const k = this.kai;
    if (SF_DEBUG.noDamage || k.dead || this.completing || this.cine) return;
    if (this.time.now < k.iframesUntil) return;
    k.iframesUntil = this.time.now + BAL.IFRAMES_MS;
    k.hearts = Math.max(0, k.hearts - n);
    UI.setHearts(k.hearts, k.maxHearts);
    AudioManager.hurt(); Haptics.hurt();
    this.cameras.main.shake(140, 0.006);
    this.burstRed.explode(10, k.spr.x, k.spr.y);
    k.spr.body.velocity.x = (k.spr.x < srcX ? -1 : 1) * 260;
    k.spr.body.velocity.y = spike ? -430 : -240;
    if (k.hearts <= 0) this.killKai();
  }

  killKai() {
    const k = this.kai;
    if (k.dead) return;
    k.dead = true;
    AudioManager.death(); Haptics.death();
    this.burstDark.explode(30, k.spr.x, k.spr.y);
    this.burstWhite.explode(8, k.spr.x, k.spr.y);
    k.spr.body.enable = false;
    this.lanternGlow.setAlpha(0);
    this.time.delayedCall(1000, () => {
      UI.fadeToBlack(() => this.respawn(), 450);
    });
  }

  respawn() {
    const k = this.kai;
    k.spr.body.enable = true;
    k.spr.setPosition(this.respawnPoint.x, this.respawnPoint.y);
    k.spr.body.reset(this.respawnPoint.x, this.respawnPoint.y);
    k.dead = false;
    k.hearts = BAL.START_HEARTS;
    k.battery = Math.max(50, k.battery);
    k.iframesUntil = this.time.now + 1400;
    UI.setHearts(k.hearts, k.maxHearts);
    UI.setBattery(k.battery, true);
  }

  /* ===================== DÜŞMANLAR & YZ ========================== */

  spawnEnemy(type, x, y) {
    const defs = {
      crawler: { tex:'crawlerTex', hp:2, w:46, h:24, grav:true },
      drifter: { tex:'drifterTex', hp:2, w:24, h:44, grav:false },
      stalker: { tex:'stalkerTex', hp:3, w:36, h:40, grav:true },
      gunman:  { tex:'gunmanTex',  hp:3, w:30, h:50, grav:true },
      brute:   { tex:'stalkerTex', hp:14, w:78, h:86, grav:true, scale:2.3 }
    };
    const def = defs[type];
    const spr = this.physics.add.sprite(x, y, def.tex);
    if (def.scale) spr.setScale(def.scale);
    spr.body.setSize(def.w / (def.scale||1), def.h / (def.scale||1));
    spr.body.allowGravity = def.grav;
    spr.setDepth(5);
    const e = {
      type, spr, hp:def.hp, alive:true, dir: Math.random()<0.5?-1:1,
      x0:x-130, x1:x+130, stunUntil:0, retreatUntil:0, leapCd:0,
      state:'patrol', stateT:0, shots:0, ph:Math.random()*6, isBoss: type==='brute'
    };
    spr.setData('e', e);
    this.enemyG.add(spr);
    this.enemies.push(e);
    return e;
  }

  updateEnemies(time, dt) {
    this.laserGfx.clear();
    const k = this.kai;
    for (const e of this.enemies) {
      if (!e.alive || !e.spr.body) continue;
      const spr = e.spr, b = spr.body;
      const dx = k.spr.x - spr.x, dy = k.spr.y - spr.y;
      const dist = Math.abs(dx);
      if (dist > 950) { if (b.allowGravity === false) b.velocity.set(0,0); continue; }
      if (time < e.stunUntil) continue;

      /* fener sönükse yaratıklar daha cesur, silahlılar daha kör */
      const lampOn = k.battery > 0;

      if (e.type === 'crawler') {
        const chase = dist < (lampOn ? 250 : 330) && Math.abs(dy) < 70 && !k.dead;
        const speed = chase ? 150 : 70;
        if (chase) e.dir = Math.sign(dx) || 1;
        else if (spr.x < e.x0) e.dir = 1;
        else if (spr.x > e.x1) e.dir = -1;
        if (b.blocked.left) e.dir = 1;
        if (b.blocked.right) e.dir = -1;
        b.velocity.x = e.dir * speed;
        spr.setFlipX(e.dir < 0);

      } else if (e.type === 'drifter') {
        e.ph += dt;
        if (dist < 470 && !k.dead) {
          const ang = Math.atan2(k.spr.y - 8 - spr.y, dx);
          b.velocity.x += Math.cos(ang) * 260 * dt;
          b.velocity.y += Math.sin(ang) * 220 * dt;
          const sp = Math.hypot(b.velocity.x, b.velocity.y);
          if (sp > 130) { b.velocity.x *= 130/sp; b.velocity.y *= 130/sp; }
        } else {
          b.velocity.x *= 0.98;
          b.velocity.y = Math.sin(e.ph*2.2) * 26;
        }
        spr.setAlpha(0.75 + Math.sin(time*0.004 + e.ph)*0.15);
        spr.setFlipX(dx < 0);

      } else if (e.type === 'stalker' || e.type === 'brute') {
        const brute = e.type === 'brute';
        const range = brute ? 1100 : (lampOn ? 480 : 300);
        const onG = b.blocked.down;
        if (time < e.retreatUntil && !brute) {
          /* zeki: vurulunca geri çekilir, mesafe alır */
          b.velocity.x = -Math.sign(dx) * 210;
          spr.setFlipX(dx > 0);
        } else if (dist < range && !k.dead) {
          const sp = (brute ? 200 : 165) + this.data0.d * 65;
          b.velocity.x = Math.sign(dx) * sp;
          spr.setFlipX(dx < 0);
          /* önü kapalıysa zıplar */
          if (onG && ((dx > 0 && b.blocked.right) || (dx < 0 && b.blocked.left))) {
            b.velocity.y = brute ? -640 : -580;
          }
          /* yakındayken üstüne atlar */
          if (onG && dist < (brute ? 200 : 140) && time > e.leapCd) {
            e.leapCd = time + (brute ? 1500 : 1900);
            b.velocity.x = Math.sign(dx) * (brute ? 380 : 320);
            b.velocity.y = brute ? -500 : -420;
            AudioManager.enemyHit();
          }
        } else {
          /* devriye */
          if (spr.x < e.x0) e.dir = 1;
          else if (spr.x > e.x1) e.dir = -1;
          if (b.blocked.left) e.dir = 1;
          if (b.blocked.right) e.dir = -1;
          b.velocity.x = e.dir * 60;
          spr.setFlipX(e.dir < 0);
        }

      } else if (e.type === 'gunman') {
        const facingKai = (dx > 0) === !spr.flipX;
        const seeRange = lampOn ? 580 : 300;
        const sees = dist < seeRange && Math.abs(dy) < 140 && !k.dead;
        e.stateT -= dt*1000;
        if (e.state === 'patrol') {
          if (spr.x < e.x0) e.dir = 1;
          else if (spr.x > e.x1) e.dir = -1;
          if (b.blocked.left) e.dir = 1;
          if (b.blocked.right) e.dir = -1;
          b.velocity.x = e.dir * 64;
          spr.setFlipX(e.dir < 0);
          if (sees) { e.state = 'aim'; e.stateT = 520; b.velocity.x = 0; }
        } else if (e.state === 'aim') {
          b.velocity.x = 0;
          spr.setFlipX(dx < 0);
          /* nişan lazeri */
          this.laserGfx.lineStyle(1.5, 0xC23A4A, 0.55);
          this.laserGfx.lineBetween(spr.x + (dx>0?20:-20), spr.y-6, k.spr.x, k.spr.y-4);
          if (!sees) e.state = 'patrol';
          else if (e.stateT <= 0) { e.state = 'fire'; e.shots = 3; e.stateT = 0; }
        } else if (e.state === 'fire') {
          b.velocity.x = 0;
          if (e.stateT <= 0 && e.shots > 0) {
            e.shots--;
            e.stateT = 170;
            const ang = Phaser.Math.Angle.Between(spr.x, spr.y-6, k.spr.x, k.spr.y-4);
            const bullet = this.eBullets.create(spr.x + Math.cos(ang)*22, spr.y-6 + Math.sin(ang)*10, 'ebulletTex');
            bullet.setRotation(ang);
            this.physics.velocityFromRotation(ang, 470, bullet.body.velocity);
            this.time.delayedCall(1500, () => { if (bullet.active) bullet.destroy(); });
            AudioManager.enemyShoot();
          }
          if (e.shots <= 0 && e.stateT <= 0) { e.state = 'cool'; e.stateT = 950; }
        } else if (e.state === 'cool') {
          /* zeki: ateş sonrası pozisyon değiştirir */
          b.velocity.x = (dist < 160 ? -Math.sign(dx) : Math.sign(dx)) * 80;
          if (e.stateT <= 0) e.state = sees ? 'aim' : 'patrol';
          if (e.state === 'aim') e.stateT = 420;
        }
      }

      /* temas hasarı */
      if (!k.dead && dist < (e.type==='brute'?52:34) && Math.abs(dy) < (e.type==='brute'?70:46)) {
        this.damageKai(e.type==='brute' ? 2 : 1, spr.x);
        if (e.type === 'drifter') {
          k.battery = Math.max(0, k.battery - 12);
          UI.setBattery(k.battery, true);
        }
      }
    }
  }

  /* ---------- tentaküller ---------- */
  spawnTentacle(x, baseY, once) {
    const spr = this.add.image(x, baseY, 'tentTex').setOrigin(0.5, 1).setDepth(6);
    spr.setScale(1, 0.1);
    const t = { spr, x, baseY, state: once ? 'warn' : 'hidden', t: once ? 0.45 : Math.random()*1.4, once: !!once };
    this.tentacles.push(t);
    return t;
  }

  updateTentacles(time, dt) {
    const k = this.kai;
    for (let i = this.tentacles.length-1; i >= 0; i--) {
      const t = this.tentacles[i];
      t.t -= dt;
      if (t.state === 'hidden') {
        t.spr.setScale(1, 0.1);
        if (t.t <= 0) { t.state = 'warn'; t.t = 0.5; }
      } else if (t.state === 'warn') {
        t.spr.x = t.x + Math.sin(time*0.06)*2.5;
        t.spr.setScale(1, 0.16);
        if (t.t <= 0) {
          t.state = 'up'; t.t = 0.16;
          if (Math.abs(t.x - k.spr.x) < 600) { AudioManager.tentacleSlam(); this.shakeSmall(); }
        }
      } else if (t.state === 'up') {
        t.spr.setScale(1, Math.min(1, 1 - t.t/0.16));
        if (t.t <= 0) { t.state = 'hold'; t.t = t.once ? 0.7 : 1.2; }
      } else if (t.state === 'hold') {
        t.spr.setScale(1 + Math.sin(time*0.01)*0.04, 1);
        t.spr.x = t.x + Math.sin(time*0.004)*3;
        if (t.t <= 0) { t.state = 'down'; t.t = 0.25; }
      } else if (t.state === 'down') {
        t.spr.setScale(1, Math.max(0.1, t.t/0.25));
        if (t.t <= 0) {
          if (t.once) { t.spr.destroy(); this.tentacles.splice(i,1); continue; }
          t.state = 'hidden'; t.t = 1.5 + Math.random();
        }
      }
      /* hasar: uzanmışken */
      const sc = t.spr.scaleY;
      if (sc > 0.45 && !k.dead) {
        const top = t.baseY - 160*sc;
        if (Math.abs(k.spr.x - t.x) < 22 && k.spr.y + 20 > top && k.spr.y < t.baseY + 10) {
          this.damageKai(1, t.x);
        }
      }
    }
  }

  /* ============================ BOSS ============================= */

  createBoss(def) {
    if (def.type === 'brute') {
      const e = this.spawnEnemy('brute', def.x, GROUND_Y - 90);
      e.hp = def.hp;
      this.bossData = { type:'brute', hp:def.hp, maxHp:def.hp, name:'ARAF BEKÇİSİ', e };
      return;
    }
    /* dev ahtapot */
    const baseY = GROUND_Y - 130;
    const spr = this.physics.add.sprite(def.x, baseY, 'octoTex');
    spr.body.allowGravity = false;
    spr.body.setImmovable(true);
    spr.body.setSize(180, 130);
    spr.setDepth(5);
    const e = { type:'octohead', spr, hp:def.hp, alive:true, isBoss:true,
                stunUntil:0, dir:1, x0:0, x1:0, state:'', stateT:0, shots:0, ph:0, retreatUntil:0, leapCd:0 };
    spr.setData('e', e);
    this.enemyG.add(spr);
    this.enemies.push(e);
    this.envLights.push({ img: spr, r: 160 });

    const parts = [];
    for (let i=0;i<3;i++) {
      const tx = def.x - 190 + i*180;
      const ts = this.add.image(tx, GROUND_Y, 'tentTex').setOrigin(0.5,1).setDepth(4).setScale(1, 0.85+Math.random()*0.3);
      this.tweens.add({ targets:ts, scaleY:ts.scaleY*0.86, duration:1600+i*300, yoyo:true, repeat:-1, ease:'Sine.inOut' });
      parts.push(ts);
    }
    this.bossData = { type:'octopus', hp:def.hp, maxHp:def.hp, name:'DERİNLERDEN GELEN',
                      e, baseY, baseX:def.x, parts, attackT:2.4, dipT:4.5, dipping:0 };
    AudioManager.bossRoar();
  }

  updateBoss(time, dt) {
    const bd = this.bossData;
    if (!bd || bd.type !== 'octopus' || !bd.e.alive) return;
    const spr = bd.e.spr, k = this.kai;

    /* baş salınımı + periyodik alçalma (yakın dövüş şansı) */
    bd.dipT -= dt;
    if (bd.dipT <= 0) { bd.dipping = bd.dipping > 0 ? 0 : 2.0; bd.dipT = bd.dipping > 0 ? 2.0 : 4.6; }
    if (bd.dipping > 0) bd.dipping -= dt;
    const targetY = bd.baseY + (bd.dipping > 0 ? 96 : 0);
    spr.y += (targetY + Math.sin(time*0.0013)*24 - spr.y) * Math.min(1, dt*2.4);
    spr.x = bd.baseX + Math.sin(time*0.0008)*30;

    /* saldırılar — can azaldıkça hızlanır */
    bd.attackT -= dt;
    if (bd.attackT <= 0 && !k.dead) {
      const rage = 1 - bd.hp / bd.maxHp;
      bd.attackT = 3.2 - rage*1.5;
      const roll = Math.random();
      if (roll < 0.5) {
        /* tentakül vuruşu: oyuncunun olduğu yere */
        const tx = k.spr.x;
        const warn = this.add.image(tx, GROUND_Y-6, 'redGlowTex').setDepth(4).setScale(0.4).setAlpha(0);
        this.tweens.add({ targets:warn, alpha:0.85, scale:1.3, duration:520,
          onComplete:() => { warn.destroy(); this.spawnTentacle(tx, GROUND_Y, true); } });
      } else if (roll < 0.78) {
        /* yaratık çağırır */
        let alive = 0;
        for (const e2 of this.enemies) if (e2.alive) alive++;
        if (alive < 12) {
          this.spawnEnemy('drifter', spr.x-140, spr.y-60);
          if (rage > 0.4) this.spawnEnemy('drifter', spr.x+60, spr.y-90);
          AudioManager.splash();
        }
      } else {
        /* mürekkep: karanlık bastırır */
        this.inkUntil = time + 2600;
        AudioManager.splash();
        UI.toast('MÜREKKEP! IŞIĞIN ZAYIFLIYOR');
      }
    }
  }

  bossDie(e) {
    const bd = this.bossData;
    if (!bd) return;
    UI.setBoss(0, false);
    AudioManager.bossRoar();
    this.cameras.main.shake(500, 0.012);
    Haptics.boss();
    if (bd.parts) for (const p of bd.parts) {
      this.tweens.add({ targets:p, scaleY:0.05, duration:900, ease:'Sine.in', onComplete:()=>p.destroy() });
    }
    this.bossData = null;
    if (this.mode === 'story' && this.levelN === 100) {
      this.time.delayedCall(700, () => this.runFinaleCutscene(e.spr.x));
      return;
    }
    /* normal boss: kapı belirir */
    const g = this.data0.gate;
    this.time.delayedCall(600, () => {
      this.spawnGate(g.x, g.y);
      this.burstWhite.explode(28, g.x, g.y);
      AudioManager.gate();
      UI.toast('BEKÇİ DÜŞTÜ — YOL AÇILDI');
    });
  }

  /* ========================= SİNEMATİKLER ======================== */

  cineDelay(ms) {
    if (this.cineSkipped) return Promise.resolve();
    return new Promise((res) => {
      const tm = this.time.delayedCall(ms, res);
      this.cineWaiters.push(() => { tm.remove(false); res(); });
    });
  }
  async cineSub(text, ms) {
    if (this.cineSkipped) return;
    UI.sub(text);
    await this.cineDelay(ms);
    UI.subHide();
    await this.cineDelay(260);
  }
  cineTween(cfg) {
    if (this.cineSkipped) return Promise.resolve();
    return new Promise((res) => {
      const tw = this.tweens.add(Object.assign({}, cfg, { onComplete:res }));
      this.cineWaiters.push(() => { tw.complete(); });
    });
  }
  skipCutscene() {
    if (!this.cine || this.cineSkipped) return;
    this.cineSkipped = true;
    UI.subHide();
    for (const w of this.cineWaiters) { try { w(); } catch (err) {} }
    this.cineWaiters = [];
  }
  drawCineActors() {
    if (this.cineRun) this.kai.phase += 0.16;
  }
  cleanupCineActors() {
    for (const a of this.cineActors) { try { a.destroy(); } catch (err) {} }
    this.cineActors = [];
  }

  /* --- AÇILIŞ: Mira'nın kaçırılışı (hikâye, bölüm 1) --- */
  async runIntroCutscene() {
    this.cine = true;
    this.cineSkipped = false;
    this.cineRun = 0;
    const k = this.kai;
    k.spr.body.moves = false;

    const gy = GROUND_Y;
    const mira = this.add.image(k.spr.x + 36, gy - 24, 'miraTex').setDepth(9);
    this.tweens.add({ targets:mira, angle:2, duration:900, yoyo:true, repeat:-1, ease:'Sine.inOut' });
    this.cineActors.push(mira);

    await this.cineDelay(700);

    /* birlikte yürüyüş */
    this.cineRun = 0.5; k.facing = 1;
    const walk1 = this.cineTween({ targets:[k.spr], x:k.spr.x+290, duration:5600, ease:'Linear' });
    const walk2 = this.cineTween({ targets:[mira], x:mira.x+290, duration:5600, ease:'Linear' });
    await this.cineSub('Araf’ta zaman geçmez. Ama onunla her an geçerdi.', 2500);
    await this.cineSub('Mira: “Işığı hiç söndürme, tamam mı?”', 2500);
    await Promise.all([walk1, walk2]);
    this.cineRun = 0;

    /* yer sarsılır */
    this.cameras.main.shake(700, 0.005);
    AudioManager.splash();
    await this.cineSub('Bir şey yaklaşıyor.', 1700);

    /* silahlı adamlar */
    const gunmen = [];
    for (let i=0;i<3;i++) {
      const gm = this.add.image(k.spr.x + 560 + i*70, gy - 28, 'gunmanTex').setDepth(9).setFlipX(true);
      gunmen.push(gm); this.cineActors.push(gm);
    }
    await this.cineTween({ targets:gunmen, x:'-=260', duration:1400, ease:'Sine.out' });
    await this.cineSub('Silahlı adamlar... burada?', 2000);

    /* dev ahtapot ve tentaküller */
    const octo = this.add.image(k.spr.x + 430, gy + 260, 'octoTex').setDepth(8).setScale(1.7);
    this.cineActors.push(octo);
    const t1 = this.add.image(mira.x - 20, gy, 'tentTex').setOrigin(0.5,1).setDepth(9).setScale(1,0.05);
    const t2 = this.add.image(mira.x + 22, gy, 'tentTex').setOrigin(0.5,1).setDepth(9).setScale(1,0.05);
    this.cineActors.push(t1, t2);
    AudioManager.bossRoar();
    this.cameras.main.shake(900, 0.012);
    Haptics.boss();
    const rise = this.cineTween({ targets:octo, y:gy - 30, duration:1300, ease:'Sine.out' });
    await this.cineTween({ targets:[t1,t2], scaleY:1, duration:350, ease:'Back.out' });
    AudioManager.tentacleSlam();
    await rise;

    /* Mira'yı kapar */
    await this.cineTween({ targets:mira, y:gy-120, angle:14, duration:500, ease:'Sine.out' });
    UI.sub('KAI: MIRA!');
    AudioManager.hurt();
    await this.cineTween({ targets:[mira, t1, t2], y:'+=460', duration:750, ease:'Sine.in' });
    AudioManager.splash();
    UI.subHide();
    this.burstDark.explode(24, mira.x, gy);
    await this.cineTween({ targets:octo, y:gy + 320, duration:1100, ease:'Sine.in' });

    /* adamlar çekilir */
    this.cineTween({ targets:gunmen, x:'+=700', duration:1500, ease:'Sine.in' });
    await this.cineDelay(900);

    await this.cineSub('Onu geri alacağım. Araf’ın dibine kadar gitsem bile.', 2600);
    this.endIntro();
  }

  endIntro() {
    if (!this.cine) return;
    this.cine = false;
    this.cineSkipped = true;
    this.cineRun = 0;
    this.cleanupCineActors();
    UI.subHide();
    this.kai.spr.body.moves = true;
    SaveSystem.data.story.introSeen = true;
    SaveSystem.save();
    UI.beginPlay(this);
  }

  /* --- FİNAL: kurtarma ve kavuşma (hikâye, bölüm 100) --- */
  async runFinaleCutscene(bossX) {
    this.cine = true;
    this.cineSkipped = false;
    this.cineRun = 0;
    const k = this.kai;
    k.spr.body.moves = false;
    k.spr.body.velocity.x = 0;
    UI.setState('cutscene');

    /* kalan yaratıklar dağılır */
    for (const e of this.enemies) if (e.alive && e.type !== 'octohead') this.enemyDie(e);

    const gy = GROUND_Y;
    await this.cineSub('Derinlerden gelen şey... sustu.', 2100);

    /* kemik kafes kırılır, Mira çıkar */
    const cage = this.add.graphics().setDepth(8);
    const cx = Math.min(bossX, this.data0.width - 160);
    cage.lineStyle(5, 0x4A4458, 1);
    for (let i=-2;i<=2;i++) cage.lineBetween(cx+i*14, gy-92, cx+i*16, gy);
    cage.strokeEllipse(cx, gy-92, 70, 30);
    this.cineActors.push(cage);
    const mira = this.add.image(cx, gy-24, 'miraTex').setDepth(9).setAlpha(0);
    this.cineActors.push(mira);
    await this.cineDelay(700);
    this.burstWhite.explode(34, cx, gy-50);
    AudioManager.gate();
    cage.clear();
    await this.cineTween({ targets:mira, alpha:1, duration:600 });
    await this.cineSub('Mira: “Kai...?”', 1600);

    /* birbirlerine koşarlar */
    const meetX = (k.spr.x + cx) / 2;
    k.facing = k.spr.x < cx ? 1 : -1;
    this.cineRun = 0.8;
    mira.setFlipX(cx > k.spr.x);
    const r1 = this.cineTween({ targets:k.spr, x:meetX - 14*k.facing, duration:1100, ease:'Sine.inOut' });
    const r2 = this.cineTween({ targets:mira, x:meetX + 14*k.facing, duration:1100, ease:'Sine.inOut' });
    await Promise.all([r1, r2]);
    this.cineRun = 0;

    /* sarılırlar — ışık çiçek açar */
    k.hugging = true;
    this.tweens.add({ targets:mira, angle:k.facing*6, duration:700, ease:'Sine.out' });
    AudioManager.hugBloom();
    Haptics.pickup();
    this.tweens.add({ targets:this, lightBoost:3.2, duration:2600, ease:'Sine.inOut' });
    this.burstWhite.explode(40, meetX, gy-50);
    this.burstWarm.explode(24, meetX, gy-40);

    await this.cineSub('Seni buldum.', 2200);
    await this.cineSub('Mira: “Biliyordum. Işığı söndürmedin.”', 2600);
    await this.cineSub('Araf bile... iki kişiyseniz katlanılabilir.', 2800);

    /* SON */
    const card = UI.el('level-card');
    card.querySelector('.lc-num').textContent = 'SHADOW FALL';
    card.querySelector('.lc-name').textContent = 'SON';
    card.classList.add('show');
    SaveSystem.completeLevel('story', 100);
    await this.cineDelay(3400);
    card.classList.remove('show');

    this.cine = false;
    UI.fadeToBlack(() => {
      UI.toast('HİKÂYE TAMAMLANDI ♥');
      UI.showMenu();
    }, 700);
  }
}

/* =========================== BAŞLAT ================================ */

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  backgroundColor: '#08080D',
  scale: { mode: Phaser.Scale.RESIZE, width: '100%', height: '100%' },
  physics: { default: 'arcade', arcade: { gravity: { y: PHYS.GRAVITY }, debug: false } },
  render: { antialias: true },
  scene: [GameScene]
};
window.game = new Phaser.Game(config);
</script>
