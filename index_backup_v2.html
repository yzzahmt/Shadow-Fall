<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="SHADOW FALL — Araf'ta geçen atmosferik bir platform oyunu. Bir fener, bir söz ve karanlığın dibinden geri alınacak biri.">
<title>SHADOW FALL — Araf</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden; background:#08080D;
  touch-action:none; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  font-family:'Inter',sans-serif;
}
button { font-family:inherit; -webkit-user-select:none; user-select:none; }
#game-container { position:fixed; inset:0; }
#game-container canvas { display:block; }

/* ---------- touch controls ---------- */
#controls {
  position:fixed; left:0; right:0; bottom:0;
  display:none; justify-content:space-between; align-items:flex-end;
  padding:0 18px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
  padding-left:calc(18px + env(safe-area-inset-left));
  padding-right:calc(18px + env(safe-area-inset-right));
  pointer-events:none; z-index:20;
}
.cluster { display:flex; gap:14px; pointer-events:auto; }
.ctl {
  width:clamp(48px,11vh,66px); height:clamp(48px,11vh,66px);
  border-radius:16px; background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12); color:#D8D0C8;
  font-size:24px; line-height:1; display:flex; align-items:center; justify-content:center;
  opacity:0.35; touch-action:none; transition:opacity 0.08s; outline:none; position:relative;
}
.ctl.active { opacity:0.7; }
#btn-action.search-mode { box-shadow:0 0 18px rgba(212,196,240,0.5); opacity:0.85; }
#btn-action .hold-ring {
  position:absolute; inset:-3px; border-radius:18px; border:2px solid rgba(212,196,240,0);
  pointer-events:none;
}

/* ---------- pause button ---------- */
#pause-btn {
  position:fixed; top:calc(12px + env(safe-area-inset-top)); right:calc(14px + env(safe-area-inset-right));
  width:42px; height:42px; border-radius:12px;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  color:#D8D0C8; font-size:15px; display:none; align-items:center; justify-content:center;
  opacity:0.4; z-index:21; cursor:pointer;
}
#pause-btn:active { opacity:0.8; }

/* ---------- overlays ---------- */
.overlay {
  position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
  z-index:30; background:radial-gradient(ellipse at 50% 60%, rgba(8,8,13,0.55) 0%, rgba(8,8,13,0.94) 80%);
  opacity:0; transition:opacity 0.5s ease;
}
.overlay.visible { display:flex; opacity:1; }
.panel-title {
  font-family:'Playfair Display',serif; font-weight:500; font-size:clamp(22px,5.5vw,34px);
  letter-spacing:0.22em; margin-left:0.22em; color:#D8D0C8; margin-bottom:22px;
}
.text-btn {
  background:none; border:none; font-weight:500; font-size:15px;
  letter-spacing:0.35em; margin-left:0.35em; color:#C8B48C; padding:13px 24px; cursor:pointer;
  border-bottom:1px solid transparent; transition:border-color 0.3s,color 0.3s;
}
.text-btn:hover, .text-btn:active { color:#FFF4D6; border-bottom-color:#C8B48C; }
.text-btn.dim { color:#807870; font-size:12px; }
.text-btn.dim:hover { color:#C8B48C; border-bottom-color:transparent; }

/* ---------- main menu ---------- */
#menu { z-index:32; background:radial-gradient(ellipse at 50% 65%, rgba(8,8,13,0.25) 0%, rgba(8,8,13,0.82) 78%); }
#menu h1 {
  font-family:'Playfair Display',serif; font-weight:500; font-size:clamp(34px,9vw,66px);
  letter-spacing:0.3em; margin-left:0.3em; color:#D8D0C8;
  text-shadow:0 0 36px rgba(212,196,240,0.25); animation:menuBreathe 5s ease-in-out infinite;
}
#menu .sub {
  font-family:'Playfair Display',serif; font-style:italic; font-size:clamp(13px,3.2vw,18px);
  color:#807870; margin-bottom:36px;
}
#menu .menu-buttons { display:flex; flex-direction:column; align-items:center; gap:2px; }
#menu .version {
  position:absolute; bottom:calc(14px + env(safe-area-inset-bottom));
  font-size:10px; letter-spacing:0.2em; color:#4A4640;
}
@keyframes menuBreathe {
  0%,100% { text-shadow:0 0 36px rgba(212,196,240,0.18); }
  50%     { text-shadow:0 0 56px rgba(212,196,240,0.38); }
}

/* ---------- level select ---------- */
#levels-panel .panel-title { margin-bottom:10px; }
#levels-sub { font-size:11px; letter-spacing:0.25em; color:#807870; margin-bottom:18px; }
#levels-grid {
  display:grid; grid-template-columns:repeat(6,1fr); gap:8px;
  width:min(440px,90vw); margin-bottom:16px;
}
.lvl-btn {
  aspect-ratio:1; border-radius:10px; background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1); color:#C8B48C; font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background 0.15s;
}
.lvl-btn:hover, .lvl-btn:active { background:rgba(212,196,240,0.12); }
.lvl-btn.done { border-color:rgba(232,201,122,0.45); color:#E8C97A; }
.lvl-btn.current { border-color:rgba(212,196,240,0.7); box-shadow:0 0 12px rgba(212,196,240,0.25); color:#F0E8FF; }
.lvl-btn.locked { opacity:0.22; cursor:default; color:#807870; }
#levels-pager { display:flex; align-items:center; gap:18px; margin-bottom:10px; }
#pg-label { font-size:11px; letter-spacing:0.2em; color:#807870; min-width:90px; text-align:center; }
.pg-btn {
  background:none; border:1px solid rgba(255,255,255,0.14); border-radius:10px;
  color:#C8B48C; width:40px; height:34px; font-size:15px; cursor:pointer;
}
.pg-btn:disabled { opacity:0.2; }

/* ---------- options ---------- */
#options-body { display:flex; flex-direction:column; gap:18px; width:min(360px,84vw); margin-bottom:26px; }
.opt-row { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.opt-row label { font-size:13px; letter-spacing:0.12em; color:#D8D0C8; }
.opt-row input[type=range] { width:150px; accent-color:#C8B48C; }
.opt-toggle {
  width:46px; height:26px; border-radius:13px; background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.14); position:relative; cursor:pointer; transition:background 0.2s;
}
.opt-toggle::after {
  content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
  background:#807870; transition:left 0.2s,background 0.2s;
}
.opt-toggle.on { background:rgba(232,201,122,0.25); }
.opt-toggle.on::after { left:22px; background:#E8C97A; }

/* ---------- HUD ---------- */
#hud-hearts {
  position:fixed; top:calc(14px + env(safe-area-inset-top)); left:calc(16px + env(safe-area-inset-left));
  display:none; gap:5px; z-index:19; pointer-events:none;
  filter:drop-shadow(0 1px 6px rgba(0,0,0,0.9));
}
#hud-hearts span { font-size:19px; color:#E84A5F; transition:transform 0.15s, color 0.2s, opacity 0.2s; }
#hud-hearts span.empty { color:rgba(255,255,255,0.14); }
#hud-hearts span.pop { transform:scale(1.45); }

#hud-level {
  position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  font-size:11px; letter-spacing:0.3em; color:#807870; z-index:19; pointer-events:none;
  display:none; text-shadow:0 1px 6px rgba(0,0,0,0.9);
}

#hud-battery {
  position:fixed; right:calc(16px + env(safe-area-inset-right));
  bottom:calc(108px + env(safe-area-inset-bottom));
  display:none; align-items:center; gap:8px; z-index:19; pointer-events:none;
}
#hud-battery .lamp { font-size:16px; filter:drop-shadow(0 0 6px rgba(232,201,122,0.7)); transition:filter 0.4s, opacity 0.4s; }
#hud-battery.dead .lamp { filter:none; opacity:0.3; }
#batt-track {
  width:120px; height:9px; border-radius:5px; background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.14); overflow:hidden;
}
#batt-fill {
  height:100%; width:80%; border-radius:4px;
  background:linear-gradient(90deg,#E8C97A,#FFF4D6); transition:width 0.25s linear;
}
#hud-battery.low #batt-fill { background:linear-gradient(90deg,#B33A3A,#E8745A); animation:battBlink 0.9s infinite; }
@keyframes battBlink { 0%,100%{opacity:1;} 50%{opacity:0.45;} }

#hud-weapon {
  position:fixed; left:calc(16px + env(safe-area-inset-left));
  bottom:calc(108px + env(safe-area-inset-bottom));
  display:none; align-items:center; gap:7px; z-index:19; pointer-events:none;
  font-size:12px; letter-spacing:0.15em; color:#C8B48C; text-shadow:0 1px 6px rgba(0,0,0,0.9);
}
#hud-weapon .w-icon { font-size:17px; }

#boss-bar {
  position:fixed; top:calc(44px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  width:min(300px,70vw); display:none; z-index:19; pointer-events:none;
}
#boss-bar .b-name { font-size:10px; letter-spacing:0.35em; color:#B07880; text-align:center; margin-bottom:4px; }
#boss-track { height:7px; border-radius:4px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,0,40,0.25); overflow:hidden; }
#boss-fill { height:100%; width:100%; background:linear-gradient(90deg,#7A1E2B,#C23A4A); transition:width 0.2s; }

/* ---------- cutscene ---------- */
#cine-sub {
  position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  max-width:84vw; font-family:'Playfair Display',serif; font-style:italic;
  font-size:clamp(16px,4.2vw,24px); color:#D8D0C8; text-align:center;
  text-shadow:0 2px 16px rgba(0,0,0,0.95); opacity:0; transition:opacity 0.45s ease;
  pointer-events:none; z-index:26;
}
#cine-sub.show { opacity:1; }
#cine-skip {
  position:fixed; top:calc(14px + env(safe-area-inset-top)); right:calc(16px + env(safe-area-inset-right));
  background:none; border:none; color:#807870; font-size:11px; letter-spacing:0.3em;
  display:none; z-index:27; cursor:pointer; padding:10px;
}
#cine-bars-top, #cine-bars-bot {
  position:fixed; left:0; right:0; height:0; background:#000; z-index:25; transition:height 0.8s ease; pointer-events:none;
}
#cine-bars-top { top:0; } #cine-bars-bot { bottom:0; }
body.cinema #cine-bars-top, body.cinema #cine-bars-bot { height:9vh; }

/* ---------- toast & monologue ---------- */
#toast {
  position:fixed; top:-80px; left:50%; transform:translateX(-50%);
  background:rgba(12,12,20,0.92); border:1px solid rgba(212,196,240,0.3); border-radius:14px;
  padding:11px 26px; z-index:40; transition:top 0.5s cubic-bezier(0.2,0.9,0.3,1.1); pointer-events:none;
  font-size:13px; letter-spacing:0.2em; color:#D4C4F0; text-align:center;
}
#toast.show { top:calc(16px + env(safe-area-inset-top)); }

#monologue {
  position:fixed; left:50%; bottom:calc(130px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  max-width:80vw; font-family:'Caveat',cursive; font-size:clamp(20px,4.5vw,27px);
  color:#D8D0C8; text-align:center; text-shadow:0 1px 14px rgba(0,0,0,0.9);
  opacity:0; transition:opacity 0.5s ease; pointer-events:none; z-index:25;
}
#monologue.show { opacity:0.92; }

#level-card {
  position:fixed; top:24vh; left:0; right:0; text-align:center; pointer-events:none; z-index:24;
  opacity:0; transition:opacity 1.2s ease;
}
#level-card.show { opacity:1; }
#level-card .lc-num { font-size:11px; letter-spacing:0.5em; color:#807870; margin-bottom:8px; }
#level-card .lc-name {
  font-family:'Playfair Display',serif; font-size:clamp(24px,6vw,40px);
  letter-spacing:0.2em; color:#D8D0C8; text-shadow:0 2px 22px rgba(0,0,0,0.9);
}

#fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity 0.5s ease; z-index:28; }
#fade.dark { opacity:1; }

#kb-hint {
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  color:#807870; font-size:12px; letter-spacing:0.05em; z-index:15; pointer-events:none;
  opacity:0.7; display:none;
}
</style>
</head>
<body>

<div id="game-container"></div>

<!-- ============ ANA MENÜ ============ -->

<!-- ============ HUD ============ -->

<!-- ============ DOKUNMATİK KONTROLLER ============ -->
<div id="controls">
  <div class="cluster">
    <button class="ctl" id="btn-left" aria-label="sol">◀</button>
    <button class="ctl" id="btn-right" aria-label="sağ">▶</button>
  </div>

<script>
/* ==================================================================
   SHADOW FALL — ARAF  (v2.0)
   ------------------------------------------------------------------
   Tek dosyalık atmosferik aksiyon-platform oyunu. Phaser 3.60.
   Tüm grafik ve sesler kodla üretilir; bölümler sabit tohumlu
   prosedürel üretimle kurulur (her bölüm herkes için aynıdır).

   Modlar:
     HİKÂYE  — 100 bölüm. 1. bölümde kaçırılma sahnesi,
               100. bölümde dev ahtapot boss + kurtarma & sarılma.
     AKSİYON — 1000 bölüm. Daha yoğun düşman, silah ve tuzak.
   ================================================================== */
'use strict';

/* ============================ SABİTLER ============================ */

const PHYS = {
  GRAVITY: 1900,
  JUMP_VY: -640,
  MOVE_SPEED: 250,
  ACCEL_GROUND: 2600,
  ACCEL_AIR: 1500,
  FRICTION_GROUND: 2200,
  FRICTION_AIR: 300,
  WALL_SLIDE: 70,
  COYOTE_MS: 120,
  BUFFER_MS: 150,
  DOUBLE_JUMP_VY: -640 * Math.sqrt(0.72),
  WALL_JUMP_VX: 340,
  WALL_JUMP_VY: -560,
  WALL_LOCK_MS: 140,
  JUMP_CUT_VY: -220,
  MAX_FALL: 980
};

const BAL = {
  MAX_HEARTS: 6,
  START_HEARTS: 3,
  BATT_MAX: 100,
  BATT_START: 80,
  BATT_DRAIN: 1.15,        // saniyede
  BATT_PICKUP: 55,
  IFRAMES_MS: 1000,
  MELEE_CD_MS: 380,
  SHOOT_CD_MS: 260,
  SEARCH_MS: 800,
  LIGHT_R_MIN: 46,
  LIGHT_R_MAX: 132
};

const COLORS = {
  VOID: 0x08080D,
  DEEP: 0x0F0F18,
  MID: 0x161625,
  LIGHT: 0x22223A,
  SIL: 0x05050A,
  LANTERN: 0xE8C97A,
  PALE: 0xD4C4F0,
  BONE: 0xBDB4A4,
  BLOOD: 0xC23A4A,
  HOLLOW: 0x0C0C16
};

window.SF_DEBUG = { noDamage:false, noDrain:false };

/* sabit tohumlu RNG */
function mulberry(seed) {
  let s = seed >>> 0;
  return () => {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function levelSeed(mode, n) {
  return ((mode === 'story' ? 0x9E3779B9 : 0x85EBCA6B) ^ Math.imul(n, 2654435761)) >>> 0;
}

/* ========================= KAYIT SİSTEMİ ========================== */

const SaveSystem = {
  KEY: 'shadowfall_araf_v2',
  data: null,
  defaults() {
    return {
      story:  { unlocked: 1, introSeen: false, finished: false },
      action: { unlocked: 1 },
      settings: { masterVolume:0.8, musicVolume:0.7, sfxVolume:1.0, haptics:true, reducedMotion:false }
    };
  },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const d = this.defaults(), p = JSON.parse(raw);
        this.data = Object.assign(d, p);
        this.data.story = Object.assign(d.story, p.story || {});
        this.data.action = Object.assign(d.action, p.action || {});
        this.data.settings = Object.assign(d.settings, p.settings || {});
      } else this.data = this.defaults();
    } catch (e) { this.data = this.defaults(); }
    return this.data;
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) {}
  },
  erase() {
    try { localStorage.removeItem(this.KEY); } catch (e) {}
    this.data = this.defaults();
  },
  maxLevel(mode) { return mode === 'story' ? 100 : 1000; },
  unlocked(mode) { return this.data[mode].unlocked; },
  completeLevel(mode, n) {
    const max = this.maxLevel(mode);
    if (n >= this.data[mode].unlocked && n < max) {
      this.data[mode].unlocked = n + 1;
    }
    if (mode === 'story' && n === 100) this.data.story.finished = true;
    this.save();
  }
};
SaveSystem.load();

/* ============================ TİTREŞİM ============================ */

const Haptics = {
  buzz(p) {
    if (!SaveSystem.data.settings.haptics) return;
    if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} }
  },
  jump()    { this.buzz(14); },
  land()    { this.buzz(22); },
  pickup()  { this.buzz([10,40,10]); },
  hurt()    { this.buzz([20,30,20,30,20]); },
  death()   { this.buzz(110); },
  attack()  { this.buzz(10); },
  shoot()   { this.buzz([8,12]); },
  boss()    { this.buzz([60,40,60]); }
};

/* ========================= SES YÖNETİCİSİ =========================
   Tamamı Web Audio API ile sentezlenir. Eski "radyo cızırtısı"
   (bandpass yağmur gürültüsü) tamamen kaldırıldı; yerine Araf'a
   uygun derin rüzgâr + uzak çan/koro ambiyansı kondu.
   ================================================================== */

const AudioManager = {
  ctx:null, master:null, musicBus:null, sfxBus:null,
  ambientNodes:[], ambientTimers:[], humOsc:null, humGain:null,
  heartbeatTimer:null, started:false, ambientKey:'',

  start() {
    if (this.started) return;
    this.started = true;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new Ctx();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.master = this.ctx.createGain();
    this.musicBus = this.ctx.createGain();
    this.sfxBus = this.ctx.createGain();
    this.musicBus.connect(this.master);
    this.sfxBus.connect(this.master);
    this.master.connect(this.ctx.destination);
    this.applyVolumes();
    this.humOsc = this.ctx.createOscillator();
    this.humOsc.type = 'sine';
    this.humOsc.frequency.value = 58;
    this.humGain = this.ctx.createGain();
    this.humGain.gain.value = 0;
    this.humOsc.connect(this.humGain).connect(this.sfxBus);
    this.humOsc.start();
  },

  applyVolumes() {
    if (!this.started) return;
    const s = SaveSystem.data.settings;
    this.master.gain.value = s.masterVolume;
    this.musicBus.gain.value = s.musicVolume;
    this.sfxBus.gain.value = s.sfxVolume;
  },

  now() { return this.ctx ? this.ctx.currentTime : 0; },

  tone(freq, dur, { type='sine', vol=0.1, bus=null, slideTo=null, delay=0 } = {}) {
    if (!this.started) return;
    const t0 = this.now() + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1), t0+dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + Math.min(0.015, dur*0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g).connect(bus || this.sfxBus);
    osc.start(t0); osc.stop(t0+dur+0.05);
  },

  noiseBuffer(seconds) {
    const len = Math.floor(this.ctx.sampleRate * seconds);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return buf;
  },

  noiseHit(dur, { freq=1000, q=1, vol=0.08, delay=0, type='bandpass' } = {}) {
    if (!this.started) return;
    const t0 = this.now() + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer(dur+0.05);
    const f = this.ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f).connect(g).connect(this.sfxBus);
    src.start(t0); src.stop(t0+dur+0.05);
  },

  /* --- oyun SFX --- */
  jump()       { this.tone(190, 0.08, { vol:0.05, slideTo:390 }); },
  doubleJump() { this.tone(290, 0.09, { vol:0.06, slideTo:580 }); },
  landSoft()   { this.tone(150, 0.06, { vol:0.05, slideTo:90 }); },
  landHard()   { this.tone(100, 0.1,  { vol:0.09, slideTo:55 }); },
  footstep()   { this.noiseHit(0.05, { freq:420, q:1.4, vol:0.022 }); },

  heart() {
    this.tone(523.3, 0.25, { type:'triangle', vol:0.06 });
    this.tone(659.3, 0.3,  { vol:0.04, delay:0.08 });
    this.tone(784.0, 0.4,  { vol:0.03, delay:0.16 });
  },
  battery() {
    this.tone(330, 0.07, { type:'square', vol:0.03 });
    this.tone(660, 0.09, { type:'square', vol:0.03, delay:0.08 });
    this.tone(990, 0.14, { type:'triangle', vol:0.04, delay:0.16 });
  },
  searchTick() { this.tone(500, 0.03, { type:'triangle', vol:0.02 }); },
  chestOpen() {
    this.tone(90, 0.4, { vol:0.07, slideTo:60 });
    this.noiseHit(0.25, { freq:300, q:1, vol:0.04, delay:0.05 });
    this.tone(880, 0.5, { type:'triangle', vol:0.04, delay:0.3 });
    this.tone(1320, 0.6, { vol:0.025, delay:0.42 });
  },
  weaponFound() {
    [392, 523.3, 659.3, 784].forEach((f,i) => this.tone(f, 0.3, { vol:0.05, delay:i*0.1 }));
  },
  melee()    { this.noiseHit(0.09, { freq:900, q:0.8, vol:0.05 }); this.tone(180, 0.07, { vol:0.03, slideTo:120 }); },
  meleeHit() { this.tone(140, 0.12, { vol:0.08, slideTo:70 }); this.noiseHit(0.08, { freq:500, q:1, vol:0.05 }); },
  shoot() {
    this.noiseHit(0.07, { freq:1800, q:0.6, vol:0.09 });
    this.tone(220, 0.06, { type:'sawtooth', vol:0.05, slideTo:80 });
  },
  enemyShoot() {
    this.noiseHit(0.08, { freq:1200, q:0.7, vol:0.07 });
    this.tone(160, 0.07, { type:'sawtooth', vol:0.04, slideTo:60 });
  },
  enemyHit()  { this.tone(260, 0.08, { type:'square', vol:0.04, slideTo:140 }); },
  enemyDie()  { this.tone(200, 0.5, { type:'sawtooth', vol:0.05, slideTo:40 }); this.noiseHit(0.3, { freq:400, q:1, vol:0.04 }); },
  hurt()      { this.tone(220, 0.18, { type:'sawtooth', vol:0.05, slideTo:90 }); this.noiseHit(0.12, { freq:500, q:1, vol:0.05 }); },
  death()     { this.tone(80, 2.0, { vol:0.1, slideTo:40 }); },
  checkpoint(){ [261.6,329.6,392.0,523.3].forEach((f,i)=>this.tone(f,0.32,{vol:0.05,delay:i*0.15})); },
  gate() {
    [261.6,392.0,523.3,784.0].forEach((f,i)=>this.tone(f,0.5,{type:'triangle',vol:0.05,delay:i*0.12}));
  },
  bossRoar() {
    this.tone(70, 1.6, { type:'sawtooth', vol:0.12, slideTo:28 });
    this.noiseHit(1.2, { freq:160, q:0.6, vol:0.08, type:'lowpass' });
  },
  tentacleSlam() {
    this.tone(60, 0.4, { vol:0.13, slideTo:30 });
    this.noiseHit(0.35, { freq:240, q:0.7, vol:0.08, type:'lowpass' });
  },
  splash() { this.noiseHit(0.5, { freq:700, q:0.5, vol:0.06 }); },
  uiTick()    { this.tone(600, 0.04, { type:'triangle', vol:0.03 }); },
  uiConfirm() { this.tone(500, 0.06, { vol:0.04 }); this.tone(700, 0.06, { vol:0.04, delay:0.07 }); },
  chime()     { this.tone(1500, 0.3, { vol:0.02 }); },
  hugBloom() {
    [261.6,329.6,392.0,523.3,659.3,784.0].forEach((f,i)=>this.tone(f,1.6,{type:'triangle',vol:0.035,delay:i*0.22,bus:this.musicBus}));
  },

  setHumLevel(level) {
    if (!this.started || !this.humGain) return;
    const target = Math.max(0, Math.min(1, level)) * 0.05;
    this.humGain.gain.setTargetAtTime(target, this.now(), 0.12);
  },

  setHeartbeat(active) {
    if (!this.started) return;
    if (active && !this.heartbeatTimer) {
      const beat = () => {
        this.tone(120, 0.09, { vol:0.07, slideTo:70 });
        this.tone(110, 0.08, { vol:0.05, slideTo:65, delay:0.18 });
      };
      beat();
      this.heartbeatTimer = setInterval(beat, 1100);
    } else if (!active && this.heartbeatTimer) {
      clearInterval(this.heartbeatTimer);
      this.heartbeatTimer = null;
    }
  },

  stopAmbient() {
    for (const n of this.ambientNodes) { try { n.stop ? n.stop() : n.disconnect(); } catch (e) {} }
    for (const t of this.ambientTimers) clearInterval(t);
    this.ambientNodes = []; this.ambientTimers = [];
    this.ambientKey = '';
  },

  /* Araf ambiyansı: derin nefes alan dron + yavaş rüzgâr +
     arada uzaktan gelen tek çan ve soluk koro tonları. */
  setAmbience(mode, levelN) {
    if (!this.started) return;
    const key = mode + '_' + Math.floor((levelN-1)/25);
    if (this.ambientKey === key && this.ambientNodes.length) return;
    this.stopAmbient();
    this.ambientKey = key;
    const ctx = this.ctx, t0 = this.now();
    const band = Math.floor((levelN-1)/25);   // derinleştikçe koyulaşır

    const addDrone = (freq, vol, lfoFreq) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      const g = ctx.createGain(); g.gain.value = vol;
      const lfo = ctx.createOscillator(); lfo.frequency.value = lfoFreq;
      const lfoG = ctx.createGain(); lfoG.gain.value = vol*0.45;
      lfo.connect(lfoG).connect(g.gain);
      osc.connect(g).connect(this.musicBus);
      osc.start(t0); lfo.start(t0);
      this.ambientNodes.push(osc, lfo, g);
    };

    // ana dron — bölüm derinleştikçe yarım ton iner
    addDrone(52 - band*2, 0.05, 0.022);
    addDrone(104 - band*4, 0.016, 0.04);

    // Araf rüzgârı: alçak geçiren süzgeçli gürültü, süzgeç frekansı
    // çok yavaş bir LFO ile gezinir — cızırtı değil, nefes gibi.
    const wind = ctx.createBufferSource();
    wind.buffer = this.noiseBuffer(4); wind.loop = true;
    const wf = ctx.createBiquadFilter();
    wf.type = 'lowpass'; wf.frequency.value = 320; wf.Q.value = 0.5;
    const wg = ctx.createGain(); wg.gain.value = 0.035;
    const wLfo = ctx.createOscillator(); wLfo.frequency.value = 0.06;
    const wLfoG = ctx.createGain(); wLfoG.gain.value = 180;
    wLfo.connect(wLfoG).connect(wf.frequency);
    const wLfo2 = ctx.createOscillator(); wLfo2.frequency.value = 0.045;
    const wLfo2G = ctx.createGain(); wLfo2G.gain.value = 0.015;
    wLfo2.connect(wLfo2G).connect(wg.gain);
    wind.connect(wf).connect(wg).connect(this.musicBus);
    wind.start(t0); wLfo.start(t0); wLfo2.start(t0);
    this.ambientNodes.push(wind, wg, wLfo, wLfo2);

    // uzak çan — seyrek, yalnız
    this.ambientTimers.push(setInterval(() => {
      if (Math.random() < 0.45) {
        const f = 392 + Math.floor(Math.random()*3) * 65;
        this.tone(f, 3.2, { type:'sine', vol:0.014, bus:this.musicBus });
        this.tone(f*1.5, 2.4, { type:'sine', vol:0.006, bus:this.musicBus, delay:0.02 });
      }
    }, 11000));

    // soluk koro — iki yakın frekans, hafif vuru
    this.ambientTimers.push(setInterval(() => {
      if (Math.random() < 0.4) {
        const f = 196 + Math.random()*60;
        this.tone(f, 4.5, { vol:0.012, bus:this.musicBus });
        this.tone(f+1.7, 4.5, { vol:0.012, bus:this.musicBus });
      }
    }, 14000));

    if (mode === 'action') {
      // aksiyon modunda derinden yavaş bir tempo nabzı
      this.ambientTimers.push(setInterval(() => {
        this.tone(48, 0.18, { vol:0.05, slideTo:32, bus:this.musicBus });
      }, 1400));
    }
  }
};

['pointerdown','touchstart','keydown'].forEach((ev) =>
  window.addEventListener(ev, () => AudioManager.start(), { once:true })
);

/* ========================= GİRİŞ DURUMU =========================== */

const Input = { tLeft:false, tRight:false, tJump:false, tAction:false };

function bindButton(id, prop) {
  const el = document.getElementById(id);
  const on = (e) => { e.preventDefault(); Input[prop] = true; el.classList.add('active'); };
  const off = (e) => { e.preventDefault(); if (!Input[prop]) return; Input[prop] = false; el.classList.remove('active'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
bindButton('btn-left', 'tLeft');
bindButton('btn-right', 'tRight');
bindButton('btn-jump', 'tJump');
bindButton('btn-action', 'tAction');

/* yukarı kaydırma = zıpla (ikincil) */
(() => {
  const area = document.getElementById('game-container');
  let startY = 0, startT = 0, tracking = false;
  area.addEventListener('pointerdown', (e) => { tracking = true; startY = e.clientY; startT = performance.now(); });
  area.addEventListener('pointerup', (e) => {
    if (!tracking) return;
    tracking = false;
    if (startY - e.clientY > 40 && performance.now() - startT < 300) {
      Input.tJump = true;
      setTimeout(() => { Input.tJump = false; }, 120);
    }
  });
  area.addEventListener('pointercancel', () => { tracking = false; });
})();

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

<script>
/* ========================= ARAYÜZ DENETİMİ ========================
   menu → levels → play ⇄ paused / cutscene → transition
   ================================================================== */

window.gameState = 'menu';

const STORY_LINES = {
  1:  "Onu geri alacağım. Araf'ın dibine kadar gitsem bile.",
  5:  "Bu yer... ne yaşıyor ne ölü. Tıpkı benim gibi.",
  10: "Tentakül izleri. Doğru yoldayım.",
  20: "Silahlı adamlar onun için çalışıyor. Ama neden Mira?",
  30: "Fener söndüğünde, buranın sakinleri cesaretleniyor.",
  40: "Rüzgâr bazen onun sesini taşıyor gibi.",
  50: "Yarı yol. Geri dönüş diye bir şey artık yok.",
  60: "Bu yaratıklar düşünüyor. İzliyorlar. Öğreniyorlar.",
  70: "Çanlar kimin için çalıyor burada? Kimse ölmüyor ki.",
  80: "Derinlerden gelen şey... onu hissediyorum. O da beni.",
  90: "Az kaldı Mira. Işığı söndürmedim. Sözümü tuttum.",
  95: "Su kokusu. Tuz. Ve devasa bir nefes alışveriş sesi.",
  100:"Burası. Her şeyin sonu ya da başlangıcı."
};

const UI = {
  el(id) { return document.getElementById(id); },

  optionsReturnTo: 'menu',
  levelsMode: 'story',
  levelsPage: 0,
  currentMode: 'story',
  currentLevel: 1,
  monologueTimer: null,
  cardTimer: null,
  toastTimer: null,

  setState(s) {
    window.gameState = s;
    const inPlay = s === 'play';
    this.el('controls').style.display = ((inPlay || s === 'cutscene') && isTouch) ? 'flex' : 'none';
    this.el('kb-hint').style.display = (inPlay && !isTouch) ? 'block' : 'none';
    this.el('pause-btn').style.display = inPlay ? 'flex' : 'none';
    const hud = inPlay ? 'flex' : 'none';
    this.el('hud-hearts').style.display = hud;
    this.el('hud-battery').style.display = hud;
    this.el('hud-weapon').style.display = hud;
    this.el('hud-level').style.display = inPlay ? 'block' : 'none';
    if (!inPlay) this.el('boss-bar').style.display = 'none';
    document.body.classList.toggle('cinema', s === 'cutscene');
    this.el('cine-skip').style.display = s === 'cutscene' ? 'block' : 'none';
    if (s !== 'cutscene') this.subHide();
  },

  show(id) { this.el(id).classList.add('visible'); },
  hide(id) { this.el(id).classList.remove('visible'); },
  hideAllOverlays() {
    ['menu','levels-panel','options-panel','pause-panel'].forEach((id) => this.hide(id));
  },

  scene() {
    try { return window.game.scene.getScene('GameScene'); } catch (e) { return null; }
  },

  /* ---------- menü ---------- */
  showMenu() {
    this.hideAllOverlays();
    this.setState('menu');
    this.show('menu');
    const sc = this.scene();
    if (sc) sc.enterAttract();
  },

  /* ---------- bölüm seçme ---------- */
  PAGE_SIZE: 30,

  openLevels(mode) {
    this.levelsMode = mode;
    const unlocked = SaveSystem.unlocked(mode);
    this.levelsPage = Math.floor((unlocked - 1) / this.PAGE_SIZE);
    this.renderLevels();
    this.hide('menu');
    this.show('levels-panel');
    this.setState('levels');
  },

  renderLevels() {
    const mode = this.levelsMode;
    const max = SaveSystem.maxLevel(mode);
    const unlocked = SaveSystem.unlocked(mode);
    const pages = Math.ceil(max / this.PAGE_SIZE);
    this.levelsPage = Math.max(0, Math.min(pages - 1, this.levelsPage));
    const start = this.levelsPage * this.PAGE_SIZE;

    this.el('levels-title').textContent = mode === 'story' ? 'HİKÂYE' : 'AKSİYON';
    this.el('levels-sub').textContent = (mode === 'story'
      ? 'MİRA\'YA GİDEN 100 BÖLÜM'
      : 'ARAF\'IN 1000 ARENASI') + ' · AÇILAN: ' + unlocked;
    this.el('pg-label').textContent = 'SAYFA ' + (this.levelsPage+1) + ' / ' + pages;
    this.el('pg-prev').disabled = this.levelsPage === 0;
    this.el('pg-next').disabled = this.levelsPage >= pages - 1;

    const grid = this.el('levels-grid');
    grid.innerHTML = '';
    for (let i = start + 1; i <= Math.min(start + this.PAGE_SIZE, max); i++) {
      const b = document.createElement('button');
      b.className = 'lvl-btn';
      b.textContent = i;
      if (i < unlocked) b.classList.add('done');
      else if (i === unlocked) b.classList.add('current');
      else b.classList.add('locked');
      if (i <= unlocked) {
        b.addEventListener('click', () => {
          AudioManager.uiConfirm();
          this.startLevel(mode, i);
        });
      }
      grid.appendChild(b);
    }
  },

  /* ---------- bölüm başlat / bitir ---------- */
  startLevel(mode, n) {
    this.hideAllOverlays();
    this.currentMode = mode;
    this.currentLevel = n;
    this.setState('transition');
    this.fadeToBlack(() => {
      const sc = this.scene();
      if (sc) sc.scene.restart({ mode, level: n, attract: false });
    }, 350);
  },

  /* GameScene hazır olduğunda çağırır */
  levelReady(scene) {
    if (scene.attract) return;
    AudioManager.setAmbience(scene.mode, scene.levelN);
    // hikâye 1. bölüm: kaçırılma sahnesi (ilk kez)
    if (scene.mode === 'story' && scene.levelN === 1 && !SaveSystem.data.story.introSeen) {
      this.setState('cutscene');
      scene.runIntroCutscene();
      return;
    }
    this.beginPlay(scene);
  },

  beginPlay(scene) {
    this.setState('play');
    scene.beginPlay();
    const card = this.el('level-card');
    card.querySelector('.lc-num').textContent =
      (scene.mode === 'story' ? 'HİKÂYE' : 'AKSİYON') + ' · BÖLÜM ' + scene.levelN;
    card.querySelector('.lc-name').textContent = this.levelName(scene.mode, scene.levelN);
    card.classList.add('show');
    clearTimeout(this.cardTimer);
    this.cardTimer = setTimeout(() => card.classList.remove('show'), 2800);
    clearTimeout(this.monoDelayTimer);
    if (scene.mode === 'story' && STORY_LINES[scene.levelN]) {
      this.monoDelayTimer = setTimeout(() => {
        if (window.gameState === 'play') this.showMonologue(STORY_LINES[scene.levelN]);
      }, 3200);
    }
  },

  levelName(mode, n) {
    if (mode === 'story' && n === 100) return 'DERİNLERDEN GELEN';
    const names = ['KÜL BAHÇELERİ','SOLUK ORMAN','KEMİK GEÇİDİ','ÇAN KULELERİ',
                   'BOĞULMUŞ YOL','SİS ÇUKURU','UNUTULANLAR','SON EŞİK'];
    return names[Math.floor((n-1) / Math.ceil(SaveSystem.maxLevel(mode)/names.length)) % names.length];
  },

  levelComplete(mode, n) {
    SaveSystem.completeLevel(mode, n);
    const max = SaveSystem.maxLevel(mode);
    AudioManager.gate();
    if (mode === 'story' && n === 100) return; // final sahnesi scene içinde
    this.toast('BÖLÜM ' + n + ' TAMAMLANDI');
    if (n < max) {
      this.startLevel(mode, n + 1);     // finiş → otomatik sonraki bölüm
    } else {
      this.showMenu();
    }
  },

  /* ---------- ayarlar ---------- */
  openOptions(returnTo) {
    this.optionsReturnTo = returnTo || 'menu';
    const s = SaveSystem.data.settings;
    this.el('opt-master').value = Math.round(s.masterVolume*100);
    this.el('opt-music').value = Math.round(s.musicVolume*100);
    this.el('opt-sfx').value = Math.round(s.sfxVolume*100);
    this.el('opt-haptics').classList.toggle('on', s.haptics);
    this.el('opt-reduced').classList.toggle('on', s.reducedMotion);
    this.resetEraseButton();
    this.hide('menu'); this.hide('pause-panel');
    this.show('options-panel');
    this.setState('options');
  },
  closeOptions() {
    SaveSystem.save();
    this.hide('options-panel');
    if (this.optionsReturnTo === 'pause') {
      this.show('pause-panel');
      this.setState('paused');
    } else this.showMenu();
  },
  resetEraseButton() {
    const b = this.el('btn-options-reset');
    b.textContent = 'TÜM İLERLEMEYİ SİL';
    b.dataset.confirm = '';
  },

  /* ---------- duraklat ---------- */
  pause() {
    if (window.gameState !== 'play') return;
    this.setState('paused');
    this.show('pause-panel');
    const sc = this.scene();
    if (sc) sc.setPaused(true);
    AudioManager.uiTick();
  },
  resume() {
    this.hide('pause-panel');
    this.setState('play');
    const sc = this.scene();
    if (sc) sc.setPaused(false);
  },

  /* ---------- HUD ---------- */
  setHearts(cur, max) {
    const c = this.el('hud-hearts');
    if (c.childElementCount !== max) {
      c.innerHTML = '';
      for (let i=0;i<max;i++) c.appendChild(document.createElement('span'));
    }
    [...c.children].forEach((s, i) => {
      s.textContent = '♥';
      s.classList.toggle('empty', i >= cur);
    });
  },
  popHeart(i) {
    const c = this.el('hud-hearts');
    const s = c.children[i];
    if (!s) return;
    s.classList.add('pop');
    setTimeout(() => s.classList.remove('pop'), 200);
  },
  setBattery(pct, alive) {
    const c = this.el('hud-battery');
    this.el('batt-fill').style.width = Math.max(0, Math.min(100, pct)) + '%';
    c.classList.toggle('low', pct > 0 && pct < 22);
    c.classList.toggle('dead', pct <= 0 || !alive);
  },
  setWeapon(w, ammo) {
    const icons = { none:'👊', bat:'🏏', pistol:'🔫' };
    const names = { none:'YUMRUK', bat:'SOPA', pistol:'TABANCA' };
    this.el('hud-weapon').querySelector('.w-icon').textContent = icons[w] || '👊';
    this.el('hud-weapon').querySelector('.w-label').textContent =
      names[w] + (w === 'pistol' ? ' · ' + ammo : '');
  },
  setLevelLabel(mode, n) {
    this.el('hud-level').textContent = (mode === 'story' ? 'HİKÂYE' : 'AKSİYON') + ' · ' + n;
  },
  setBoss(pct, show, name) {
    const bar = this.el('boss-bar');
    bar.style.display = show ? 'block' : 'none';
    if (name) bar.querySelector('.b-name').textContent = name;
    this.el('boss-fill').style.width = Math.max(0, pct*100) + '%';
  },
  setActionMode(search) {
    this.el('btn-action').classList.toggle('search-mode', !!search);
    this.el('btn-action').textContent = search ? '🔍' : '⚔';
  },

  /* ---------- metinler ---------- */
  showMonologue(text) {
    const el = this.el('monologue');
    el.textContent = text;
    el.classList.add('show');
    AudioManager.chime();
    clearTimeout(this.monologueTimer);
    this.monologueTimer = setTimeout(() => el.classList.remove('show'), 3800);
  },
  toast(text) {
    const t = this.el('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  },
  sub(text) {
    const el = this.el('cine-sub');
    el.textContent = text;
    el.classList.add('show');
  },
  subHide() { this.el('cine-sub').classList.remove('show'); },

  fadeToBlack(cb, holdMs) {
    const f = this.el('fade');
    f.classList.add('dark');
    setTimeout(() => {
      if (cb) cb();
      setTimeout(() => f.classList.remove('dark'), 150);
    }, holdMs || 500);
  }
};

/* ---------- Araf paralaksı ---------- */
function generateParallax(scene) {
  if (scene.textures.exists('bgRidge')) return;
  const g = scene.make.graphics({ add:false });

  /* uzak: yüzen adalar + asılı kayalar */
  g.clear();
  const r1 = mulberry(404);
  g.fillStyle(COLORS.DEEP,1);
  for (let i=0;i<7;i++) {
    const x = 40 + r1()*920, y = 60 + r1()*180;
    const w = 70 + r1()*150, h = 18 + r1()*26;
    g.fillEllipse(x,y,w,h);
    g.fillTriangle(x-w*0.2,y+h*0.3, x+w*0.2,y+h*0.3, x,y+h*0.3+30+r1()*50);
    if (r1() < 0.6) {
      const sx = x + (r1()-0.5)*w*0.5;
      g.fillRect(sx, y+h*0.3+8, 2, 16+r1()*22);
      g.fillEllipse(sx+1, y+h*0.3+30+r1()*16, 8+r1()*10, 6);
    }
  }
  // ufukta sivri kuleler
  for (let i=0;i<10;i++) {
    const x = r1()*1024, h = 60+r1()*160, w = 8+r1()*18;
    g.fillTriangle(x,320, x+w,320, x+w/2,320-h);
  }
  g.generateTexture('bgRidge',1024,320);

  /* orta: ölü ağaçlar + kemik kemerler + çan kuleleri */
  g.clear();
  const r2 = mulberry(808);
  for (let i=0;i<11;i++) {
    const x = 30 + r2()*964, h = 160 + r2()*220;
    g.fillStyle(COLORS.MID,1);
    g.fillTriangle(x-5,420, x+5,420, x+(r2()-0.5)*10,420-h);
    g.lineStyle(2.5,COLORS.MID,1);
    for (let b=0;b<5;b++) {
      const by = 420-h*(0.4+r2()*0.55);
      const dir = r2()>0.5?1:-1, bl = 16+r2()*40;
      g.lineBetween(x,by, x+dir*bl, by-bl*(0.2+r2()*0.5));
      if (r2() < 0.3) {
        const ex = x+dir*bl;
        g.lineBetween(ex, by-bl*0.3, ex, by-bl*0.3+14);
      }
    }
  }
  for (let i=0;i<3;i++) {
    const x = 100 + r2()*820, w = 90+r2()*60, h = 130+r2()*80;
    g.lineStyle(8,COLORS.MID,1);
    g.beginPath();
    g.arc(x, 420, h, Math.PI, 0, false);
    g.strokePath();
    g.fillStyle(COLORS.MID,1);
    g.fillRect(x-h-4,420-30,8,30); g.fillRect(x+h-4,420-30,8,30);
  }
  for (let i=0;i<2;i++) {
    const x = 150 + r2()*700;
    g.fillStyle(COLORS.MID,1);
    g.fillRect(x,420-260,34,260);
    g.fillTriangle(x-6,420-260, x+40,420-260, x+17,420-310);
    g.fillStyle(0x0A0A14,1);
    g.fillRect(x+10,420-250,14,20);
  }
  g.generateTexture('bgMid',1024,420);

  /* yakın ön: sis bankı + mezar taşları */
  g.clear();
  const r3 = mulberry(909);
  g.fillStyle(0x1B1B30,1);
  g.fillRect(0,110,1024,50);
  for (let i=0;i<8;i++) g.fillEllipse(r3()*1024,118,100+r3()*180,40+r3()*30);
  g.fillStyle(0x232038,1);
  for (let i=0;i<9;i++) {
    const x = r3()*1024, w = 14+r3()*12, h = 22+r3()*26;
    g.fillRoundedRect(x,112-h,w,h+10,4);
  }
  g.lineStyle(2,0x232038,1);
  for (let i=0;i<40;i++) {
    const x = r3()*1024, h = 6+r3()*14;
    g.lineBetween(x,114, x+(r3()-0.5)*8, 114-h);
  }
  g.generateTexture('bgFore',1024,160);

  g.destroy();
}
