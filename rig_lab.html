<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>RIG LAB</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;background:#13141a;}
  #game-container canvas{display:block;}
  .grid-label{position:fixed;color:#c9c5be;font:11px monospace;}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
function qTo(g, x0, y0, cx, cy, x1, y1, n = 10) {
  for (let i = 1; i <= n; i++) {
    const t = i / n, mt = 1 - t;
    g.lineTo(mt * mt * x0 + 2 * mt * t * cx + t * t * x1, mt * mt * y0 + 2 * mt * t * cy + t * t * y1);
  }
}
</script>
<script src="js/human.js"></script>
<script>
/* RIG LAB — karakteri farklı durumlarda dondurulmuş/animasyonlu olarak
   bir ızgarada yan yana gösterir. Phase değerlerini elle veririz ki
   yürüyüş/koşu döngüsünün ortasındaki kareyi (en bilgilendirici poz) görelim. */

const SCALE = 2.4;            // yakın inceleme için büyük
const COLS = 5, CW = 300, CH = 360;
const GROUND_OFF = 70;        // alttan yukarı zemin çizgisi

/* her hücre: { label, variant, build(rig, t) }
   build, rig.state'i kurar ve gerekirse phase'i set eder. */
const CELLS = [
  { label:'idle (kai)', variant:'kai', st:(r)=>({mode:'idle',vx:0,vy:0,grounded:true}) },
  { label:'walk mid (kai)', variant:'kai', ph:Math.PI*0.5, st:(r)=>({mode:'move',vx:90,vy:0,grounded:true,facing:1}) },
  { label:'run mid (kai)', variant:'kai', ph:Math.PI*0.5, st:(r)=>({mode:'move',vx:210,vy:0,grounded:true,facing:1}) },
  { label:'jump up (kai)', variant:'kai', st:(r)=>({mode:'air',vx:120,vy:-260,grounded:false,facing:1}) },
  { label:'fall (kai)', variant:'kai', st:(r)=>({mode:'air',vx:80,vy:420,grounded:false,facing:1}) },
  { label:'idle (maria)', variant:'maria', st:(r)=>({mode:'idle',vx:0,vy:0,grounded:true}) },
  { label:'walk mid (maria)', variant:'maria', ph:Math.PI*0.5, st:(r)=>({mode:'move',vx:90,vy:0,grounded:true,facing:1}) },
  { label:'run mid (maria)', variant:'maria', ph:Math.PI*0.5, st:(r)=>({mode:'move',vx:210,vy:0,grounded:true,facing:1}) },
  { label:'crouch (kai)', variant:'kai', st:(r)=>({mode:'idle',vx:0,vy:0,grounded:true,crouch:true}) },
  { label:'crouch walk', variant:'kai', ph:Math.PI*0.5, st:(r)=>({mode:'crawl',vx:60,vy:0,grounded:true,facing:1}) },
  { label:'push (kai)', variant:'kai', st:(r)=>{r.mode='push';return {mode:'push',vx:10,vy:0,grounded:true,facing:1};} },
  { label:'pry (kai)', variant:'kai', st:(r)=>{r.pryAnim=0.6;return {mode:'pry',vx:0,vy:0,grounded:true,facing:1};} },
  { label:'walk +π (kai)', variant:'kai', ph:Math.PI*1.5, st:(r)=>({mode:'move',vx:90,vy:0,grounded:true,facing:1}) },
  { label:'land impact', variant:'kai', st:(r)=>{r.landImpact=0.8;return {mode:'idle',vx:20,vy:0,grounded:true,facing:1};} },
  { label:'aim pistol', variant:'kai', st:(r)=>{r.holdItem='pistol';r.aimMode=true;r.aimAngle=-0.15;return {mode:'idle',vx:0,vy:0,grounded:true,facing:1};} },
];

class Lab extends Phaser.Scene {
  create() {
    this.add.rectangle(0,0,COLS*CW,4*CH,0x13141a).setOrigin(0);
    this.rigs = [];
    CELLS.forEach((c,i)=>{
      const col=i%COLS, row=Math.floor(i/COLS);
      const cx=col*CW+CW/2, cy=row*CH;
      const groundY=cy+CH-GROUND_OFF;
      // zemin çizgisi
      const gl=this.add.graphics().setDepth(1);
      gl.lineStyle(1,0x2e313e,1); gl.beginPath(); gl.moveTo(col*CW+20,groundY); gl.lineTo(col*CW+CW-20,groundY); gl.strokePath();
      // etiket
      this.add.text(col*CW+10,cy+8,c.label,{font:'13px monospace',color:'#9aa'}).setDepth(5);
      const rig=new HumanRig(this,{scale:SCALE,variant:c.variant,depth:10});
      const baseX=cx, baseY=groundY - rig.A.standH;
      this.rigs.push({rig,c,baseX,baseY,groundY});
    });
    this.t=0;
    // hazır sinyali
    window.__labReady=true;
  }
  update(_,dtMs){
    const dt=Math.min(0.033,dtMs/1000);
    this.t+=dt;
    for(const o of this.rigs){
      const st=o.c.st(o.rig)||{};
      st.x=o.baseX; st.y=o.baseY; st.groundY=o.groundY;
      if(st.facing==null)st.facing=1;
      o.rig.update(dt,st);
      // sabit faz isteyen hücrelerde phase'i kilitle (canlı yürüyüş yerine tek kare)
      if(o.c.ph!=null){ o.rig.phase=o.c.ph; o.rig.draw(); }
    }
  }
}

new Phaser.Game({
  type:Phaser.CANVAS,
  width:COLS*CW, height:3*CH,
  backgroundColor:'#13141a',
  parent:'game-container',
  scene:Lab,
  fps:{target:60},
});
</script>
</body>
</html>
