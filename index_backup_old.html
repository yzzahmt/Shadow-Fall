<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="SHADOW FALL — an atmospheric silhouette platformer. A child, a lantern, and the long dark between here and home.">
<title>SHADOW FALL</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">

<!-- Phaser.js -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

<style>
/* ==================================================================
   SHADOW FALL — Release build styles
   ================================================================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #08080D;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font-family: 'Inter', sans-serif;
}

button {
  font-family: inherit;
  -webkit-user-select: none;
  user-select: none;
}

#game-container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}
#game-container canvas {
  display: block;
}

/* ==================================================================
   Touch controls
   ================================================================== */
#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: none;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 18px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
  padding-left: calc(18px + env(safe-area-inset-left));
  padding-right: calc(18px + env(safe-area-inset-right));
  pointer-events: none;
  z-index: 20;
}
.cluster {
  display: flex;
  gap: 14px;
  pointer-events: auto;
}
.ctl {
  /* 64px preferred, but never let the control row exceed ~15% of screen height */
  width: clamp(48px, 11vh, 64px);
  height: clamp(48px, 11vh, 64px);
  border-radius: 16px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #D8D0C8;
  font-size: 26px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.35;
  touch-action: none;
  transition: opacity 0.08s;
  outline: none;
  position: relative;
}
.ctl.active {
  opacity: 0.65;
}

/* pulse button: cooldown ring + charge state */
#btn-pulse {
  overflow: visible;
}
#btn-pulse.cooldown {
  opacity: 0.18;
}
#btn-pulse.charging {
  opacity: 0.9;
  box-shadow: 0 0 24px rgba(232, 201, 122, 0.35);
}
#btn-pulse .ring {
  position: absolute;
  inset: -4px;
  border-radius: 20px;
  pointer-events: none;
}

/* ==================================================================
   Pause button (in-game, top right)
   ================================================================== */
#pause-btn {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top));
  right: calc(14px + env(safe-area-inset-right));
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: #D8D0C8;
  font-size: 15px;
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0.4;
  z-index: 21;
  cursor: pointer;
}
#pause-btn:active {
  opacity: 0.8;
}

/* ==================================================================
   Shared overlay panels
   ================================================================== */
.overlay {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 30;
  background: radial-gradient(ellipse at 50% 60%, rgba(8,8,13,0.55) 0%, rgba(8,8,13,0.92) 80%);
  opacity: 0;
  transition: opacity 0.6s ease;
}
.overlay.visible {
  display: flex;
  opacity: 1;
}
.overlay.fading {
  opacity: 0;
}

.panel-title {
  font-family: 'Playfair Display', serif;
  font-weight: 500;
  font-size: clamp(22px, 5.5vw, 34px);
  letter-spacing: 0.22em;
  margin-left: 0.22em;
  color: #D8D0C8;
  margin-bottom: 28px;
}

.text-btn {
  background: none;
  border: none;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.4em;
  margin-left: 0.4em;
  color: #C8B48C;
  padding: 13px 24px;
  cursor: pointer;
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s, color 0.3s;
}
.text-btn:hover, .text-btn:active {
  color: #FFF4D6;
  border-bottom-color: #C8B48C;
}
.text-btn.dim {
  color: #807870;
  font-size: 12px;
}
.text-btn.dim:hover {
  color: #C8B48C;
  border-bottom-color: transparent;
}

/* ==================================================================
   Main menu
   ================================================================== */
#menu {
  z-index: 32;
  background: radial-gradient(ellipse at 50% 65%, rgba(8,8,13,0.25) 0%, rgba(8,8,13,0.8) 78%);
}
#menu h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 500;
  font-size: clamp(36px, 9vw, 68px);
  letter-spacing: 0.32em;
  margin-left: 0.32em;
  color: #D8D0C8;
  text-shadow: 0 0 36px rgba(232, 201, 122, 0.22);
  animation: menuBreathe 5s ease-in-out infinite;
}
#menu .sub {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(14px, 3.4vw, 19px);
  color: #807870;
  margin-bottom: 40px;
}
#menu .menu-buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
#menu .version {
  position: absolute;
  bottom: calc(14px + env(safe-area-inset-bottom));
  font-size: 10px;
  letter-spacing: 0.2em;
  color: #4A4640;
}
@keyframes menuBreathe {
  0%, 100% { text-shadow: 0 0 36px rgba(232,201,122,0.18); }
  50%      { text-shadow: 0 0 52px rgba(232,201,122,0.34); }
}

/* ==================================================================
   Chapter select
   ================================================================== */
#chapters-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(420px, 86vw);
  margin-bottom: 26px;
}
.chapter-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 14px;
  padding: 16px 20px;
  cursor: pointer;
  transition: background 0.25s, border-color 0.25s;
  text-align: left;
}
.chapter-card:hover, .chapter-card:active {
  background: rgba(232,201,122,0.07);
  border-color: rgba(232,201,122,0.25);
}
.chapter-card.locked {
  opacity: 0.38;
  cursor: default;
}
.chapter-card.locked:hover {
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.09);
}
.chapter-card .ch-num {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: #807870;
  margin-bottom: 4px;
}
.chapter-card .ch-name {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: #D8D0C8;
  margin-bottom: 6px;
}
.chapter-card .ch-stats {
  font-size: 11px;
  letter-spacing: 0.06em;
  color: #807870;
  display: flex;
  gap: 14px;
}
.chapter-card .ch-stats .done {
  color: #C8B48C;
}

/* ==================================================================
   Options
   ================================================================== */
#options-body {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: min(360px, 84vw);
  margin-bottom: 28px;
}
.opt-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.opt-row label {
  font-size: 13px;
  letter-spacing: 0.12em;
  color: #D8D0C8;
}
.opt-row input[type=range] {
  width: 150px;
  accent-color: #C8B48C;
}
.opt-toggle {
  width: 46px;
  height: 26px;
  border-radius: 13px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.14);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
}
.opt-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #807870;
  transition: left 0.2s, background 0.2s;
}
.opt-toggle.on {
  background: rgba(232,201,122,0.25);
}
.opt-toggle.on::after {
  left: 22px;
  background: #E8C97A;
}

/* ==================================================================
   Story overlay & chapter end
   ================================================================== */
#story {
  z-index: 31;
  background: #050508;
  padding: 0 9vw;
  transition: opacity 1s ease;
}
#story-text {
  font-family: 'Playfair Display', serif;
  font-size: clamp(19px, 4.6vw, 30px);
  line-height: 1.6;
  color: #D8D0C8;
  text-align: center;
  opacity: 0;
  transition: opacity 1s ease;
}
#story-text.show {
  opacity: 1;
}
#story .skip-hint {
  position: absolute;
  bottom: calc(26px + env(safe-area-inset-bottom));
  font-size: 10px;
  letter-spacing: 0.3em;
  color: #4A4640;
}

#chapter-end {
  background: rgba(5,5,8,0.93);
  padding: 0 8vw;
}
#ce-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(22px, 5.5vw, 34px);
  letter-spacing: 0.18em;
  color: #E8C97A;
  margin-bottom: 18px;
  text-align: center;
}
#ce-text {
  font-family: 'Caveat', cursive;
  font-size: clamp(19px, 4.4vw, 27px);
  line-height: 1.55;
  color: #D8D0C8;
  text-align: center;
  max-width: 560px;
  margin-bottom: 22px;
}
#ce-stats {
  font-size: 12px;
  letter-spacing: 0.18em;
  color: #807870;
  margin-bottom: 26px;
  display: flex;
  gap: 22px;
}
#ce-buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

/* ==================================================================
   Pause
   ================================================================== */
#pause-panel {
  background: rgba(5,5,8,0.85);
}

/* ==================================================================
   HUD (DOM parts)
   ================================================================== */
#hud-fragments {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top));
  right: calc(68px + env(safe-area-inset-right));
  font-size: 13px;
  letter-spacing: 0.18em;
  color: #C8B48C;
  text-shadow: 0 1px 8px rgba(0,0,0,0.8);
  opacity: 0;
  transition: opacity 0.5s;
  z-index: 19;
  pointer-events: none;
}
#hud-fragments.show {
  opacity: 0.55;
}

#chapter-title-card {
  position: fixed;
  top: 24vh;
  left: 0;
  right: 0;
  text-align: center;
  pointer-events: none;
  z-index: 24;
  opacity: 0;
  transition: opacity 1.4s ease;
}
#chapter-title-card.show {
  opacity: 1;
}
#chapter-title-card .ct-num {
  font-size: 11px;
  letter-spacing: 0.5em;
  color: #807870;
  margin-bottom: 8px;
}
#chapter-title-card .ct-name {
  font-family: 'Playfair Display', serif;
  font-size: clamp(26px, 6.5vw, 42px);
  letter-spacing: 0.2em;
  color: #D8D0C8;
  text-shadow: 0 2px 22px rgba(0,0,0,0.9);
}

#monologue {
  position: fixed;
  left: 50%;
  bottom: calc(120px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  max-width: 80vw;
  font-family: 'Caveat', cursive;
  font-size: clamp(20px, 4.5vw, 27px);
  color: #D8D0C8;
  text-align: center;
  text-shadow: 0 1px 14px rgba(0,0,0,0.9);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
  z-index: 25;
}
#monologue.show {
  opacity: 0.92;
}

/* ==================================================================
   Achievement toast
   ================================================================== */
#ach-toast {
  position: fixed;
  top: calc(-90px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(12,12,20,0.92);
  border: 1px solid rgba(232,201,122,0.3);
  border-radius: 14px;
  padding: 12px 22px;
  z-index: 40;
  transition: top 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  pointer-events: none;
}
#ach-toast.show {
  top: calc(16px + env(safe-area-inset-top));
}
#ach-toast .ach-icon {
  font-size: 20px;
}
#ach-toast .ach-label {
  font-size: 10px;
  letter-spacing: 0.25em;
  color: #807870;
  margin-bottom: 2px;
}
#ach-toast .ach-name {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  color: #E8C97A;
}

/* ==================================================================
   Fade curtain (death, transitions)
   ================================================================== */
#fade {
  position: fixed;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  z-index: 28;
}
#fade.dark {
  opacity: 1;
}

#kb-hint {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  color: #807870;
  font-size: 12px;
  letter-spacing: 0.05em;
  z-index: 15;
  pointer-events: none;
  opacity: 0.7;
  display: none;
}
</style>
</head>
<body>

<div id="game-container"></div>

<!-- ============================ MAIN MENU ============================ -->
<div id="menu" class="overlay visible">
  <h1>SHADOW FALL</h1>
  <p class="sub">A story about what we carry</p>
  <div class="menu-buttons">
    <button class="text-btn" id="btn-menu-play">PLAY</button>
    <button class="text-btn" id="btn-menu-chapters">CHAPTERS</button>
    <button class="text-btn" id="btn-menu-options">OPTIONS</button>
  </div>
  <div class="version">SHADOW FALL · v1.0.0</div>
</div>

<!-- ========================= CHAPTER SELECT ========================== -->
<div id="chapters-panel" class="overlay">
  <div class="panel-title">CHAPTERS</div>
  <div id="chapters-list"></div>
  <button class="text-btn dim" id="btn-chapters-back">BACK</button>
</div>

<!-- ============================ OPTIONS ============================== -->
<div id="options-panel" class="overlay">
  <div class="panel-title">OPTIONS</div>
  <div id="options-body">
    <div class="opt-row">
      <label>MASTER VOLUME</label>
      <input type="range" id="opt-master" min="0" max="100" value="80">
    </div>
    <div class="opt-row">
      <label>MUSIC</label>
      <input type="range" id="opt-music" min="0" max="100" value="70">
    </div>
    <div class="opt-row">
      <label>SOUND EFFECTS</label>
      <input type="range" id="opt-sfx" min="0" max="100" value="100">
    </div>
    <div class="opt-row">
      <label>HAPTICS</label>
      <div class="opt-toggle on" id="opt-haptics"></div>
    </div>
    <div class="opt-row">
      <label>REDUCED MOTION</label>
      <div class="opt-toggle" id="opt-reduced"></div>
    </div>
  </div>
  <button class="text-btn dim" id="btn-options-reset">ERASE ALL PROGRESS</button>
  <button class="text-btn dim" id="btn-options-back">BACK</button>
</div>

<!-- ========================= STORY OVERLAY =========================== -->
<div id="story" class="overlay">
  <p id="story-text"></p>
  <div class="skip-hint">TAP TO SKIP</div>
</div>

<!-- ========================== CHAPTER END ============================ -->
<div id="chapter-end" class="overlay">
  <div id="ce-title"></div>
  <div id="ce-text"></div>
  <div id="ce-stats"></div>
  <div id="ce-buttons">
    <button class="text-btn" id="btn-ce-next">NEXT CHAPTER</button>
    <button class="text-btn dim" id="btn-ce-menu">RETURN TO MENU</button>
  </div>
</div>

<!-- ============================= PAUSE =============================== -->
<div id="pause-panel" class="overlay">
  <div class="panel-title">PAUSED</div>
  <div class="menu-buttons">
    <button class="text-btn" id="btn-pause-resume">RESUME</button>
    <button class="text-btn dim" id="btn-pause-restart">RESTART CHAPTER</button>
    <button class="text-btn dim" id="btn-pause-menu">RETURN TO MENU</button>
  </div>
</div>

<!-- ======================== HUD / FLOATERS =========================== -->
<button id="pause-btn" aria-label="pause">⏸</button>
<div id="hud-fragments"></div>
<div id="chapter-title-card">
  <div class="ct-num"></div>
  <div class="ct-name"></div>
</div>
<div id="monologue"></div>
<div id="ach-toast">
  <div class="ach-icon"></div>
  <div>
    <div class="ach-label">MEMORY KEPT</div>
    <div class="ach-name"></div>
  </div>
</div>
<div id="fade"></div>

<!-- ========================= TOUCH CONTROLS ========================== -->
<div id="controls">
  <div class="cluster">
    <button class="ctl" id="btn-left" aria-label="left">◀</button>
    <button class="ctl" id="btn-right" aria-label="right">▶</button>
  </div>
  <div class="cluster">
    <button class="ctl" id="btn-pulse" aria-label="pulse">💡<span class="ring"></span></button>
    <button class="ctl" id="btn-jump" aria-label="jump">▲</button>
  </div>
</div>

<div id="kb-hint">←/→ or A/D move · Space jump · Shift run · ↓/S crouch · E pulse · Esc pause</div>

<script>
/* ==================================================================
   SHADOW FALL — release build
   ------------------------------------------------------------------
   A complete atmospheric silhouette platformer in one file.
   Engine: Phaser 3.60 (CDN). All art and audio generated in code.

   Systems:
     - Kai: full movement (walk/run, variable jump, double jump,
       wall slide/jump, crouch, coyote time, jump buffering)
     - Memory Lantern: energy, light radius, color shift, the Pulse
     - The Hollow: Drifter, Crawler, Watcher enemy types
     - Checkpoints (Memory Anchors), poetic death & respawn
     - Memory Fragments + Echoes, lantern upgrade
     - 3 chapters with distinct atmosphere, parallax and ambience
     - Save system (localStorage), chapter select, options
     - Achievements with toast notifications
     - Procedural Web Audio: ambient beds + full SFX suite
     - Touch controls, swipe jump, haptics, pause, reduced motion
   ================================================================== */

'use strict';

/* ============================ CONSTANTS ============================ */

const PHYS = {
  GRAVITY: 1800,
  JUMP_FORCE: -620,
  WALK_SPEED: 180,
  RUN_SPEED: 290,
  WALL_SLIDE_SPEED: 60,
  COYOTE_TIME: 120,          // ms
  JUMP_BUFFER: 150,          // ms
  ACCEL_TIME: 0.15,          // s, 0 → max speed
  // Double jump: 70% of first jump's HEIGHT  →  v = v0 * sqrt(0.7)
  DOUBLE_JUMP_VY: -620 * Math.sqrt(0.7),
  // Wall jump: 55° away from wall, same launch speed as a jump
  WALL_JUMP_VX: 620 * Math.cos(Phaser.Math.DegToRad(55)),
  WALL_JUMP_VY: -620 * Math.sin(Phaser.Math.DegToRad(55)),
  WALL_COYOTE: 100,          // ms grace after leaving a wall
  WALL_JUMP_LOCK: 150,       // ms input lock after wall jump
  JUMP_CUT_VY: -240          // releasing jump early clamps vy here
};

const BALANCE = {
  ENERGY_START: 80,
  ENERGY_MAX: 100,
  DRAIN_PASSIVE: 1,          // units / second
  DRAIN_PROXIMITY: 3,        // extra units / second when a Hollow is near
  PROXIMITY_RANGE: 150,      // px
  HOLLOW_TOUCH_DAMAGE: 20,
  IFRAMES_MS: 1000,
  FRAGMENT_ENERGY: 15,
  ECHO_ENERGY: 5,
  PULSE_CHARGE_MS: 1500,
  PULSE_COST: 25,
  PULSE_RADIUS: 200,
  PULSE_PUSH: 300,
  PULSE_STUN_MS: 3000,
  PULSE_BLIND_MS: 4000,
  PULSE_COOLDOWN_MS: 4000,
  UPGRADE_FRAGMENTS: 5,      // total fragments for the first upgrade
  UPGRADE_DRAIN_MULT: 0.8,   // lantern drains 20% slower
  LIGHT_R_MIN: 40,
  LIGHT_R_MAX: 120
};

const COLORS = {
  VOID_BLACK:   0x08080D,
  SHADOW_DEEP:  0x0F0F18,
  SHADOW_MID:   0x161625,
  SHADOW_LIGHT: 0x22223A,
  SILHOUETTE:   0x05050A,
  KAI_RIM:      0x2A2A3E,
  LANTERN_CORE: 0xFFF4D6,
  LANTERN_WARM: 0xE8C97A,
  LANTERN_COLD: 0xB8C4D8,
  MEMORY_GLOW:  0xD4C4F0,
  MEMORY_BRIGHT:0xF0E8FF,
  HOLLOW_BODY:  0x0C0C16
};

/* Debug hooks for automated testing — all off in normal play */
window.SF_DEBUG = { noDrain: false, noDamage: false };

/* ========================== SAVE SYSTEM ============================ */

const SaveSystem = {
  KEY: 'shadowfall_save_v1',
  data: null,

  defaults() {
    return {
      version: '1.0.0',
      chapters: {
        1: { unlocked: true,  completed: false, bestTime: null, fragments: [false, false, false, false, false, false, false], deaths: 0 },
        2: { unlocked: false, completed: false, bestTime: null, fragments: [false, false, false, false, false, false, false], deaths: 0 },
        3: { unlocked: false, completed: false, bestTime: null, fragments: [false, false, false, false, false, false, false], deaths: 0 }
      },
      meta: {
        totalFragments: 0,
        upgrades: [],
        lanternColor: 'amber',
        totalPlayTime: 0,
        lastPlayed: 0
      },
      settings: {
        masterVolume: 0.8,
        sfxVolume: 1.0,
        musicVolume: 0.7,
        haptics: true,
        reducedMotion: false
      },
      achievements: {},
      stats: { pulseCount: 0, totalDeaths: 0 }
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        // shallow-merge over defaults so new fields appear after updates
        const d = this.defaults();
        this.data = Object.assign(d, parsed);
        this.data.chapters = Object.assign(d.chapters, parsed.chapters || {});
        this.data.meta = Object.assign(d.meta, parsed.meta || {});
        this.data.settings = Object.assign(d.settings, parsed.settings || {});
        this.data.stats = Object.assign(d.stats, parsed.stats || {});
        this.data.achievements = parsed.achievements || {};
      } else {
        this.data = this.defaults();
      }
    } catch (e) {
      this.data = this.defaults();
    }
    return this.data;
  },

  save() {
    try {
      this.data.meta.lastPlayed = Date.now();
      localStorage.setItem(this.KEY, JSON.stringify(this.data));
    } catch (e) { /* storage unavailable — play session continues unsaved */ }
  },

  erase() {
    try { localStorage.removeItem(this.KEY); } catch (e) {}
    this.data = this.defaults();
  },

  chapter(n) {
    return this.data.chapters[n];
  },

  collectFragment(chapterId, index) {
    const ch = this.chapter(chapterId);
    if (!ch.fragments[index]) {
      ch.fragments[index] = true;
      this.data.meta.totalFragments += 1;
      this.save();
      return true;
    }
    return false;
  },

  fragmentCount(chapterId) {
    return this.chapter(chapterId).fragments.filter(Boolean).length;
  },

  hasLanternUpgrade() {
    return this.data.meta.totalFragments >= BALANCE.UPGRADE_FRAGMENTS;
  },

  completeChapter(chapterId, timeMs) {
    const ch = this.chapter(chapterId);
    const first = !ch.completed;
    ch.completed = true;
    if (ch.bestTime === null || timeMs < ch.bestTime) ch.bestTime = timeMs;
    const next = this.chapter(chapterId + 1);
    if (next) next.unlocked = true;
    this.save();
    return first;
  }
};

SaveSystem.load();

/* ============================ HAPTICS ============================== */

const Haptics = {
  buzz(pattern) {
    if (!SaveSystem.data.settings.haptics) return;
    if (navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch (e) {}
    }
  },
  jump()       { this.buzz(15); },
  landHard()   { this.buzz(25); },
  fragment()   { this.buzz([10, 50, 10]); },
  hurt()       { this.buzz([20, 30, 20, 30, 20]); },
  death()      { this.buzz(100); },
  checkpoint() { this.buzz([10, 20, 40]); },
  pulse()      { this.buzz([10, 10, 30]); }
};

/* ========================= AUDIO MANAGER ===========================
   Everything synthesized with the Web Audio API. The context is
   created on the first user gesture (iOS requirement). Three buses:
   master → { music, sfx }.
   ================================================================== */

const AudioManager = {
  ctx: null,
  master: null,
  musicBus: null,
  sfxBus: null,
  ambientNodes: [],
  ambientTimers: [],
  humOsc: null,
  humGain: null,
  heartbeatTimer: null,
  chargeNodes: null,
  started: false,
  currentChapter: 0,

  start() {
    if (this.started) return;
    this.started = true;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new Ctx();
    if (this.ctx.state === 'suspended') this.ctx.resume();

    this.master = this.ctx.createGain();
    this.musicBus = this.ctx.createGain();
    this.sfxBus = this.ctx.createGain();
    this.musicBus.connect(this.master);
    this.sfxBus.connect(this.master);
    this.master.connect(this.ctx.destination);
    this.applyVolumes();

    // persistent hollow-proximity hum (gain driven per frame)
    this.humOsc = this.ctx.createOscillator();
    this.humOsc.type = 'sine';
    this.humOsc.frequency.value = 62;
    this.humGain = this.ctx.createGain();
    this.humGain.gain.value = 0;
    this.humOsc.connect(this.humGain).connect(this.sfxBus);
    this.humOsc.start();
  },

  applyVolumes() {
    if (!this.started) return;
    const s = SaveSystem.data.settings;
    this.master.gain.value = s.masterVolume;
    this.musicBus.gain.value = s.musicVolume;
    this.sfxBus.gain.value = s.sfxVolume;
  },

  now() {
    return this.ctx ? this.ctx.currentTime : 0;
  },

  /* --- tiny synth helpers --- */

  tone(freq, dur, { type = 'sine', vol = 0.1, bus = null, slideTo = null, delay = 0 } = {}) {
    if (!this.started) return;
    const t0 = this.now() + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + Math.min(0.015, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(bus || this.sfxBus);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  },

  noiseBuffer(seconds) {
    const len = Math.floor(this.ctx.sampleRate * seconds);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  },

  noiseHit(dur, { freq = 1000, q = 1, vol = 0.08, delay = 0 } = {}) {
    if (!this.started) return;
    const t0 = this.now() + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer(dur + 0.05);
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(this.sfxBus);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
  },

  /* --- gameplay SFX --- */

  jump()        { this.tone(200, 0.08, { vol: 0.05, slideTo: 400 }); },
  doubleJump()  { this.tone(300, 0.09, { vol: 0.06, slideTo: 600 }); },
  landSoft()    { this.tone(150, 0.06, { vol: 0.05, slideTo: 90 }); },
  landHard()    { this.tone(100, 0.1,  { vol: 0.09, slideTo: 55 }); },

  footstep(surface) {
    if (surface === 'stone') {
      this.noiseHit(0.05, { freq: 700, q: 2, vol: 0.025 });
      this.tone(140, 0.04, { vol: 0.02, slideTo: 100 });
    } else {
      this.noiseHit(0.06, { freq: 350, q: 1.2, vol: 0.03 });
    }
  },

  fragment() {
    this.tone(1200, 0.4, { type: 'triangle', vol: 0.07 });
    this.tone(1800, 0.5, { type: 'sine', vol: 0.035, delay: 0.07 });
    this.tone(2400, 0.6, { type: 'sine', vol: 0.02, delay: 0.16 });
  },

  echoPickup() {
    this.tone(800, 0.2, { type: 'triangle', vol: 0.04 });
    this.tone(1100, 0.25, { vol: 0.02, delay: 0.06 });
  },

  checkpoint() {
    const notes = [261.6, 329.6, 392.0, 523.3];   // C E G C
    notes.forEach((f, i) => this.tone(f, 0.32, { vol: 0.05, delay: i * 0.15 }));
  },

  hurt() {
    this.tone(220, 0.18, { type: 'sawtooth', vol: 0.05, slideTo: 90 });
    this.noiseHit(0.12, { freq: 500, q: 1, vol: 0.05 });
  },

  death() {
    this.tone(80, 2.0, { vol: 0.1, slideTo: 40 });
  },

  hollowTouch() {
    this.tone(120, 0.3, { vol: 0.05 });
    this.tone(127, 0.3, { vol: 0.05 });
  },

  uiTick()    { this.tone(600, 0.04, { type: 'triangle', vol: 0.03 }); },
  uiConfirm() { this.tone(500, 0.06, { vol: 0.04 }); this.tone(700, 0.06, { vol: 0.04, delay: 0.07 }); },
  chime()     { this.tone(1500, 0.3, { type: 'sine', vol: 0.02 }); },

  pulseChargeStart() {
    if (!this.started) return;
    this.pulseChargeStop();
    const t0 = this.now();
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, t0);
    osc.frequency.linearRampToValueAtTime(350, t0 + BALANCE.PULSE_CHARGE_MS / 1000);
    g.gain.setValueAtTime(0.001, t0);
    g.gain.linearRampToValueAtTime(0.06, t0 + BALANCE.PULSE_CHARGE_MS / 1000);
    osc.connect(g).connect(this.sfxBus);
    osc.start(t0);
    this.chargeNodes = { osc, g };
  },

  pulseChargeStop() {
    if (this.chargeNodes) {
      try {
        this.chargeNodes.g.gain.cancelScheduledValues(this.now());
        this.chargeNodes.g.gain.setValueAtTime(0.0001, this.now());
        this.chargeNodes.osc.stop(this.now() + 0.05);
      } catch (e) {}
      this.chargeNodes = null;
    }
  },

  pulseBoom() {
    this.tone(80, 0.35, { vol: 0.16, slideTo: 45 });
    this.noiseHit(0.3, { freq: 200, q: 0.7, vol: 0.07 });
  },

  /* --- proximity hum: level 0..1, set every frame --- */
  setHumLevel(level) {
    if (!this.started || !this.humGain) return;
    const target = Phaser.Math.Clamp(level, 0, 1) * 0.05;
    this.humGain.gain.setTargetAtTime(target, this.now(), 0.12);
  },

  /* --- heartbeat at low energy --- */
  setHeartbeat(active) {
    if (!this.started) return;
    if (active && !this.heartbeatTimer) {
      const beat = () => {
        this.tone(120, 0.09, { vol: 0.07, slideTo: 70 });
        this.tone(110, 0.08, { vol: 0.05, slideTo: 65, delay: 0.18 });
      };
      beat();
      this.heartbeatTimer = setInterval(beat, 1100);
    } else if (!active && this.heartbeatTimer) {
      clearInterval(this.heartbeatTimer);
      this.heartbeatTimer = null;
    }
  },

  /* --- per-chapter ambient beds --- */

  stopAmbient() {
    for (const n of this.ambientNodes) {
      try { n.stop ? n.stop() : n.disconnect(); } catch (e) {}
    }
    for (const t of this.ambientTimers) clearInterval(t);
    this.ambientNodes = [];
    this.ambientTimers = [];
  },

  setChapterAmbience(chapterId) {
    if (!this.started) return;
    if (this.currentChapter === chapterId && this.ambientNodes.length) return;
    this.currentChapter = chapterId;
    this.stopAmbient();
    const ctx = this.ctx;
    const t0 = this.now();

    const addDrone = (freq, vol, lfoFreq) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.value = vol;
      // slow breathing LFO on the drone volume
      const lfo = ctx.createOscillator();
      lfo.frequency.value = lfoFreq;
      const lfoG = ctx.createGain();
      lfoG.gain.value = vol * 0.45;
      lfo.connect(lfoG).connect(g.gain);
      osc.connect(g).connect(this.musicBus);
      osc.start(t0);
      lfo.start(t0);
      this.ambientNodes.push(osc, lfo, g);
    };

    const addNoiseBed = (filterType, freq, q, vol) => {
      const src = ctx.createBufferSource();
      src.buffer = this.noiseBuffer(3);
      src.loop = true;
      const f = ctx.createBiquadFilter();
      f.type = filterType;
      f.frequency.value = freq;
      f.Q.value = q;
      const g = ctx.createGain();
      g.gain.value = vol;
      src.connect(f).connect(g).connect(this.musicBus);
      src.start(t0);
      this.ambientNodes.push(src, g);
      return { f, g };
    };

    if (chapterId === 1) {
      // forest: deep drone + soundless-feeling thin rain
      addDrone(55, 0.05, 0.03);
      addDrone(110, 0.02, 0.05);
      const rain = addNoiseBed('bandpass', 2000, 0.4, 0.018);
      rain.f.frequency.value = 1800;
      // occasional distant high tones
      this.ambientTimers.push(setInterval(() => {
        if (Math.random() < 0.5) {
          this.tone(800 + Math.random() * 400, 1.4, { vol: 0.012, bus: this.musicBus });
        }
      }, 7000));
    } else if (chapterId === 2) {
      // river: lower drone + watery noise + a far-away music box
      addDrone(50, 0.05, 0.04);
      addNoiseBed('lowpass', 520, 0.6, 0.03);
      const melody = [523.3, 587.3, 659.3, 784.0, 880.0];   // C D E G A
      let mi = 0;
      this.ambientTimers.push(setInterval(() => {
        if (Math.random() < 0.75) {
          this.tone(melody[mi % melody.length], 1.3, { type: 'triangle', vol: 0.016, bus: this.musicBus });
          mi += 1 + Math.floor(Math.random() * 2);
        }
      }, 2300));
    } else {
      // drowned city: hollow wind + structural groans
      addDrone(45, 0.045, 0.025);
      addNoiseBed('bandpass', 420, 1.6, 0.03);
      this.ambientTimers.push(setInterval(() => {
        if (Math.random() < 0.4) {
          this.tone(48 + Math.random() * 14, 2.2, { vol: 0.035, slideTo: 36, bus: this.musicBus });
        }
      }, 9000));
    }
  }
};

/* ====================== UNIFIED INPUT STATE ======================== */

const Input = {
  tLeft: false, tRight: false, tJump: false, tPulse: false
};

function bindButton(id, prop, { onDown = null, onUp = null } = {}) {
  const el = document.getElementById(id);
  const on = (e) => {
    e.preventDefault();
    Input[prop] = true;
    el.classList.add('active');
    if (onDown) onDown();
  };
  const off = (e) => {
    e.preventDefault();
    if (!Input[prop]) return;
    Input[prop] = false;
    el.classList.remove('active');
    if (onUp) onUp();
  };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

bindButton('btn-left', 'tLeft');
bindButton('btn-right', 'tRight');
bindButton('btn-jump', 'tJump');
bindButton('btn-pulse', 'tPulse');

/* Swipe up on the game area = jump (secondary control). */
(() => {
  const area = document.getElementById('game-container');
  let startY = 0, startT = 0, tracking = false;
  area.addEventListener('pointerdown', (e) => {
    tracking = true;
    startY = e.clientY;
    startT = performance.now();
  });
  const end = (e) => {
    if (!tracking) return;
    tracking = false;
    const dy = startY - e.clientY;
    const dt = performance.now() - startT;
    if (dy > 40 && dt < 300) {
      Input.tJump = true;
      setTimeout(() => { Input.tJump = false; }, 120);
    }
  };
  area.addEventListener('pointerup', end);
  area.addEventListener('pointercancel', () => { tracking = false; });
})();

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ========================= ACHIEVEMENTS ============================ */

const ACHIEVEMENTS = {
  first_light:   { name: 'First Light',  icon: '🏮' },
  seeker:        { name: 'Seeker',       icon: '🔍' },
  ghost:         { name: 'Ghost',        icon: '🌫' },
  memory_rush:   { name: 'Memory Rush',  icon: '⏱' },
  pulse_master:  { name: 'Resonance',    icon: '◎' },
  completionist: { name: 'Everything',   icon: '✦' }
};

const Achievements = {
  queue: [],
  showing: false,

  unlock(id) {
    if (SaveSystem.data.achievements[id]) return;
    SaveSystem.data.achievements[id] = true;
    SaveSystem.save();
    this.queue.push(id);
    this.drain();
  },

  drain() {
    if (this.showing || this.queue.length === 0) return;
    this.showing = true;
    const id = this.queue.shift();
    const a = ACHIEVEMENTS[id];
    const toast = document.getElementById('ach-toast');
    toast.querySelector('.ach-icon').textContent = a.icon;
    toast.querySelector('.ach-name').textContent = a.name;
    AudioManager.chime();
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => { this.showing = false; this.drain(); }, 600);
    }, 3000);
  },

  checkFragmentMilestones() {
    if (SaveSystem.data.meta.totalFragments >= 10) this.unlock('seeker');
    if (SaveSystem.data.meta.totalFragments >= 21) this.unlock('completionist');
  }
};

/* ========================= UI CONTROLLER ===========================
   Owns every DOM overlay and the global game state machine:
   menu → story → play ⇄ paused, → chapterend, with chapters/options
   reachable from menu and pause.
   ================================================================== */

window.gameState = 'menu';

const UI = {
  el(id) { return document.getElementById(id); },

  optionsReturnTo: 'menu',
  storyTimer: null,
  monologueTimer: null,
  ctaTimer: null,

  setState(s) {
    window.gameState = s;
    const inPlay = s === 'play';
    this.el('controls').style.display = (inPlay && isTouch) ? 'flex' : 'none';
    this.el('kb-hint').style.display = (inPlay && !isTouch) ? 'block' : 'none';
    this.el('pause-btn').style.display = inPlay ? 'flex' : 'none';
    this.el('hud-fragments').classList.toggle('show', inPlay);
  },

  show(id) { this.el(id).classList.add('visible'); },

  hide(id) {
    const el = this.el(id);
    el.classList.remove('visible');
  },

  hideAllOverlays() {
    ['menu', 'chapters-panel', 'options-panel', 'story', 'chapter-end', 'pause-panel']
      .forEach((id) => this.hide(id));
  },

  /* ---------- menu ---------- */

  showMenu() {
    this.hideAllOverlays();
    this.setState('menu');
    this.show('menu');
    const scene = this.scene();
    if (scene) scene.enterAttractMode();
  },

  scene() {
    try { return window.game.scene.getScene('GameScene'); } catch (e) { return null; }
  },

  nextUnfinishedChapter() {
    for (let n = 1; n <= 3; n++) {
      const ch = SaveSystem.chapter(n);
      if (ch.unlocked && !ch.completed) return n;
    }
    return 1;
  },

  /* ---------- chapter select ---------- */

  openChapters(returnTo) {
    this.chaptersReturnTo = returnTo || 'menu';
    this.renderChapters();
    this.hide('menu');
    this.show('chapters-panel');
    this.setState('chapters');
  },

  renderChapters() {
    const list = this.el('chapters-list');
    list.innerHTML = '';
    for (let n = 1; n <= 3; n++) {
      const meta = LEVELS[n];
      const ch = SaveSystem.chapter(n);
      const card = document.createElement('div');
      card.className = 'chapter-card' + (ch.unlocked ? '' : ' locked');
      const frags = SaveSystem.fragmentCount(n);
      const best = ch.bestTime !== null ? this.formatTime(ch.bestTime) : '—';
      card.innerHTML =
        '<div class="ch-num">CHAPTER ' + n + (ch.unlocked ? '' : ' · LOCKED') + '</div>' +
        '<div class="ch-name">' + meta.name + '</div>' +
        '<div class="ch-stats">' +
          '<span class="' + (ch.completed ? 'done' : '') + '">' + (ch.completed ? 'COMPLETED' : 'UNFINISHED') + '</span>' +
          '<span>◈ ' + frags + '/7</span>' +
          '<span>BEST ' + best + '</span>' +
          '<span>DEATHS ' + ch.deaths + '</span>' +
        '</div>';
      if (ch.unlocked) {
        card.addEventListener('click', () => {
          AudioManager.uiConfirm();
          this.startChapter(n);
        });
      }
      list.appendChild(card);
    }
  },

  formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0');
  },

  /* ---------- options ---------- */

  openOptions(returnTo) {
    this.optionsReturnTo = returnTo || 'menu';
    const s = SaveSystem.data.settings;
    this.el('opt-master').value = Math.round(s.masterVolume * 100);
    this.el('opt-music').value = Math.round(s.musicVolume * 100);
    this.el('opt-sfx').value = Math.round(s.sfxVolume * 100);
    this.el('opt-haptics').classList.toggle('on', s.haptics);
    this.el('opt-reduced').classList.toggle('on', s.reducedMotion);
    this.resetEraseButton();
    this.hide('menu');
    this.hide('pause-panel');
    this.show('options-panel');
    this.setState('options');
  },

  closeOptions() {
    SaveSystem.save();
    this.hide('options-panel');
    if (this.optionsReturnTo === 'pause') {
      this.show('pause-panel');
      this.setState('paused');
    } else {
      this.showMenu();
    }
  },

  resetEraseButton() {
    const b = this.el('btn-options-reset');
    b.textContent = 'ERASE ALL PROGRESS';
    b.dataset.confirm = '';
  },

  /* ---------- starting a chapter ---------- */

  startChapter(n) {
    this.hideAllOverlays();
    this.currentChapter = n;
    const scene = this.scene();
    if (scene) scene.scene.restart({ chapter: n, attract: false });
    this.beginStory(n);
  },

  beginStory(n) {
    this.setState('story');
    this.show('story');
    const lines = LEVELS[n].intro;
    let i = 0;
    const textEl = this.el('story-text');
    textEl.classList.remove('show');
    const next = () => {
      if (window.gameState !== 'story') return;
      if (i >= lines.length) { this.startGameplay(); return; }
      textEl.textContent = lines[i];
      textEl.classList.add('show');
      i += 1;
      this.storyTimer = setTimeout(() => {
        textEl.classList.remove('show');
        this.storyTimer = setTimeout(next, 800);
      }, 2800);
    };
    this.storyTimer = setTimeout(next, 700);
  },

  startGameplay() {
    if (window.gameState === 'play') return;
    clearTimeout(this.storyTimer);
    this.hide('story');
    this.setState('play');
    const scene = this.scene();
    if (scene) scene.beginPlay();
    // chapter title card
    const card = this.el('chapter-title-card');
    card.querySelector('.ct-num').textContent = 'CHAPTER ' + this.currentChapter;
    card.querySelector('.ct-name').textContent = LEVELS[this.currentChapter].name.toUpperCase();
    card.classList.add('show');
    clearTimeout(this.ctaTimer);
    this.ctaTimer = setTimeout(() => card.classList.remove('show'), 3400);
  },

  /* ---------- pause ---------- */

  pause() {
    if (window.gameState !== 'play') return;
    this.setState('paused');
    this.show('pause-panel');
    const scene = this.scene();
    if (scene) scene.setPaused(true);
    AudioManager.uiTick();
  },

  resume() {
    this.hide('pause-panel');
    this.setState('play');
    const scene = this.scene();
    if (scene) scene.setPaused(false);
  },

  /* ---------- chapter completion ---------- */

  chapterComplete(chapterId, timeMs, fragmentsNow) {
    this.setState('chapterend');
    const meta = LEVELS[chapterId];
    this.el('ce-title').textContent = 'CHAPTER ' + chapterId + ' — ' + meta.name.toUpperCase();
    this.el('ce-text').textContent = meta.endText;
    this.el('ce-stats').innerHTML =
      '<span>TIME ' + this.formatTime(timeMs) + '</span>' +
      '<span>◈ ' + fragmentsNow + '/7</span>' +
      '<span>DEATHS ' + SaveSystem.chapter(chapterId).deaths + '</span>';
    const nextBtn = this.el('btn-ce-next');
    nextBtn.style.display = chapterId < 3 ? 'block' : 'none';
    if (chapterId >= 3) {
      this.el('ce-title').textContent = 'THE DROWNED CITY SLEEPS AGAIN';
    }
    this.show('chapter-end');

    // achievements
    if (chapterId === 1) {
      Achievements.unlock('first_light');
      if (timeMs < 4 * 60 * 1000) Achievements.unlock('memory_rush');
    }
    Achievements.checkFragmentMilestones();
  },

  /* ---------- HUD ---------- */

  updateFragmentCounter(n, total) {
    this.el('hud-fragments').textContent = '◈ ' + n + ' / ' + total;
  },

  showMonologue(text) {
    const el = this.el('monologue');
    el.textContent = text;
    el.classList.add('show');
    AudioManager.chime();
    clearTimeout(this.monologueTimer);
    this.monologueTimer = setTimeout(() => el.classList.remove('show'), 3500);
  },

  fadeToBlack(cb, holdMs) {
    const f = this.el('fade');
    f.classList.add('dark');
    setTimeout(() => {
      if (cb) cb();
      setTimeout(() => f.classList.remove('dark'), 120);
    }, holdMs || 500);
  },

  toastUpgrade() {
    const toast = this.el('ach-toast');
    toast.querySelector('.ach-icon').textContent = '🏮';
    toast.querySelector('.ach-name').textContent = 'Lantern burns longer';
    toast.querySelector('.ach-label').textContent = 'MEMORY RESTORED';
    AudioManager.chime();
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
      toast.querySelector('.ach-label').textContent = 'MEMORY KEPT';
    }, 3200);
  }
};

/* Esc pauses / resumes */
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (window.gameState === 'play') UI.pause();
    else if (window.gameState === 'paused') UI.resume();
  }
});

/* auto-pause when the tab is hidden mid-game */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && window.gameState === 'play') UI.pause();
});

/* ===================== PROCEDURAL TEXTURES =========================
   Every texture in the game is generated in code with a seeded RNG
   so the world looks identical on every run.
   ================================================================== */

function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function generateSharedTextures(scene) {
  const g = scene.make.graphics({ add: false });

  /* --- platform: stone with a faint top highlight --- */
  g.clear();
  g.fillStyle(COLORS.SHADOW_LIGHT, 1);
  g.fillRect(0, 0, 64, 64);
  g.fillStyle(0x2C2C4A, 1);
  g.fillRect(0, 0, 64, 3);
  g.fillStyle(0x1C1C30, 0.6);
  const rndP = makeRng(7);
  for (let i = 0; i < 10; i++) {
    g.fillRect(Math.floor(rndP() * 60), 4 + Math.floor(rndP() * 56), 2 + rndP() * 4, 1);
  }
  g.generateTexture('platTex', 64, 64);

  /* --- one-way platform: thinner, slightly lighter --- */
  g.clear();
  g.fillStyle(0x2A2A46, 1);
  g.fillRect(0, 0, 64, 14);
  g.fillStyle(0x383858, 1);
  g.fillRect(0, 0, 64, 2);
  g.generateTexture('onewayTex', 64, 14);

  /* --- moving platform: banded, slightly warm --- */
  g.clear();
  g.fillStyle(0x2E2A44, 1);
  g.fillRect(0, 0, 64, 18);
  g.fillStyle(0x3E3858, 1);
  g.fillRect(0, 0, 64, 2);
  g.fillStyle(0x241F38, 1);
  g.fillRect(0, 15, 64, 3);
  g.generateTexture('movTex', 64, 18);

  /* --- crumbling platform: visibly cracked --- */
  g.clear();
  g.fillStyle(0x262640, 1);
  g.fillRect(0, 0, 64, 18);
  g.fillStyle(0x303052, 1);
  g.fillRect(0, 0, 64, 2);
  g.lineStyle(1, 0x14142A, 1);
  const rndC = makeRng(99);
  for (let i = 0; i < 5; i++) {
    const x = 6 + rndC() * 52;
    g.lineBetween(x, 2, x + (rndC() - 0.5) * 10, 16);
  }
  g.generateTexture('crumbleTex', 64, 18);

  g.destroy();

  /* --- canvas textures: gradients --- */

  // lantern light spot — erased from the darkness layer
  const spot = scene.textures.createCanvas('spotTex', 512, 512);
  const sctx = spot.getContext();
  const sg = sctx.createRadialGradient(256, 256, 0, 256, 256, 256);
  sg.addColorStop(0,    'rgba(255,255,255,1)');
  sg.addColorStop(0.55, 'rgba(255,255,255,1)');
  sg.addColorStop(0.8,  'rgba(255,255,255,0.35)');
  sg.addColorStop(1,    'rgba(255,255,255,0)');
  sctx.fillStyle = sg;
  sctx.fillRect(0, 0, 512, 512);
  spot.refresh();

  // warm amber ring at the edge of the light hole
  const edge = scene.textures.createCanvas('lightEdgeTex', 512, 512);
  const ectx = edge.getContext();
  const eg2 = ectx.createRadialGradient(256, 256, 0, 256, 256, 256);
  eg2.addColorStop(0,    'rgba(255,200,100,0)');
  eg2.addColorStop(0.5,  'rgba(255,200,100,0)');
  eg2.addColorStop(0.75, 'rgba(255,200,100,0.5)');
  eg2.addColorStop(1,    'rgba(255,200,100,0)');
  ectx.fillStyle = eg2;
  ectx.fillRect(0, 0, 512, 512);
  edge.refresh();

  // low-energy vignette
  const vig = scene.textures.createCanvas('vignetteTex', 512, 512);
  const vctx = vig.getContext();
  const vg = vctx.createRadialGradient(256, 256, 120, 256, 256, 362);
  vg.addColorStop(0,   'rgba(58,21,24,0)');
  vg.addColorStop(0.6, 'rgba(58,21,24,0.25)');
  vg.addColorStop(1,   'rgba(58,21,24,0.9)');
  vctx.fillStyle = vg;
  vctx.fillRect(0, 0, 512, 512);
  vig.refresh();

  // warm lantern glow (drawn behind Kai, additive)
  const glow = scene.textures.createCanvas('glowTex', 256, 256);
  const gctx = glow.getContext();
  const gg = gctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gg.addColorStop(0,    'rgba(255,236,190,0.55)');
  gg.addColorStop(0.25, 'rgba(232,201,122,0.28)');
  gg.addColorStop(0.6,  'rgba(180,150,90,0.08)');
  gg.addColorStop(1,    'rgba(0,0,0,0)');
  gctx.fillStyle = gg;
  gctx.fillRect(0, 0, 256, 256);
  glow.refresh();

  // soft purple memory glow (fragments & echoes)
  const mem = scene.textures.createCanvas('memGlowTex', 128, 128);
  const mctx = mem.getContext();
  const mg = mctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  mg.addColorStop(0,   'rgba(212,196,240,0.5)');
  mg.addColorStop(0.5, 'rgba(212,196,240,0.16)');
  mg.addColorStop(1,   'rgba(212,196,240,0)');
  mctx.fillStyle = mg;
  mctx.fillRect(0, 0, 128, 128);
  mem.refresh();

  // small warm glow (checkpoints, env lights)
  const warm = scene.textures.createCanvas('warmGlowTex', 128, 128);
  const wctx = warm.getContext();
  const wg = wctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  wg.addColorStop(0,   'rgba(232,201,122,0.5)');
  wg.addColorStop(0.5, 'rgba(232,201,122,0.14)');
  wg.addColorStop(1,   'rgba(232,201,122,0)');
  wctx.fillStyle = wg;
  wctx.fillRect(0, 0, 128, 128);
  warm.refresh();
}

/* --- per-chapter parallax sets ---
   Theme shapes: 'forest' (needled trees), 'river' (low hills, reeds),
   'city' (leaning towers, window holes). Keys: bg{layer}{chapterId}. */

function generateChapterTextures(scene, chapterId) {
  if (scene.textures.exists('bgRidge' + chapterId)) return;
  const g = scene.make.graphics({ add: false });
  const theme = LEVELS[chapterId].theme;

  /* ---------- ridge / skyline (farthest) ---------- */
  g.clear();
  if (theme === 'city') {
    const rnd = makeRng(300 + chapterId);
    g.fillStyle(COLORS.SHADOW_DEEP, 1);
    let x = 0;
    while (x < 1024) {
      const w = 50 + rnd() * 110;
      const h = 90 + rnd() * 200;
      const tilt = (rnd() - 0.5) * 14;
      g.fillRect(x, 320 - h + tilt, w, h + 20);
      x += w + 8 + rnd() * 30;
    }
  } else {
    const rnd = makeRng(42 + chapterId);
    g.fillStyle(COLORS.SHADOW_DEEP, 1);
    const pts = [{ x: 0, y: 320 }];
    let mx = 0, my = theme === 'river' ? 230 : 170;
    while (mx < 1024) {
      mx += 60 + rnd() * 90;
      const range = theme === 'river' ? 40 : 120;
      const minY = theme === 'river' ? 190 : 60;
      my = Phaser.Math.Clamp(my + (rnd() - 0.5) * range, minY, 260);
      pts.push({ x: Math.min(mx, 1024), y: my });
    }
    pts.push({ x: 1024, y: 320 });
    g.fillPoints(pts, true);
  }
  g.generateTexture('bgRidge' + chapterId, 1024, 320);

  /* ---------- far details ---------- */
  g.clear();
  const rndF = makeRng(99 + chapterId * 7);
  if (theme === 'forest') {
    for (let i = 0; i < 42; i++) {
      const x = rndF() * 1024;
      const h = 90 + rndF() * 190;
      const w = 2 + rndF() * 3;
      g.fillStyle(0x12121E, 1);
      g.fillRect(x, 300 - h, w, h);
      for (let b = 0; b < 3; b++) {
        const by = 300 - h + rndF() * h * 0.5;
        const bl = 6 + rndF() * 14;
        g.fillRect(rndF() > 0.5 ? x + w : x - bl, by, bl, 1.5);
      }
    }
  } else if (theme === 'river') {
    // reeds along the far bank
    g.lineStyle(2, 0x12121E, 1);
    for (let i = 0; i < 70; i++) {
      const x = rndF() * 1024;
      const h = 30 + rndF() * 80;
      g.lineBetween(x, 300, x + (rndF() - 0.5) * 14, 300 - h);
    }
    // broken bridge stumps
    g.fillStyle(0x12121E, 1);
    for (let i = 0; i < 4; i++) {
      const x = 120 + rndF() * 800;
      g.fillRect(x, 180 + rndF() * 60, 16 + rndF() * 10, 120);
    }
  } else {
    // thin distant towers with sparse lit windows
    for (let i = 0; i < 16; i++) {
      const x = rndF() * 1024;
      const w = 18 + rndF() * 30;
      const h = 110 + rndF() * 170;
      g.fillStyle(0x12121E, 1);
      g.fillRect(x, 300 - h, w, h);
      g.fillStyle(0x222238, 1);
      for (let wy = 0; wy < 4; wy++) {
        if (rndF() < 0.4) g.fillRect(x + 4 + rndF() * (w - 10), 300 - h + 14 + wy * 26, 3, 4);
      }
    }
  }
  g.generateTexture('bgFar' + chapterId, 1024, 300);

  /* ---------- mid details ---------- */
  g.clear();
  const rndT = makeRng(1234 + chapterId * 13);
  if (theme === 'forest') {
    for (let i = 0; i < 13; i++) {
      const x = 30 + rndT() * 964;
      const h = 200 + rndT() * 210;
      const w = 8 + rndT() * 10;
      g.fillStyle(COLORS.SHADOW_MID, 1);
      g.fillTriangle(x - w / 2, 420, x + w / 2, 420, x + (rndT() - 0.5) * 8, 420 - h);
      g.lineStyle(2.5, COLORS.SHADOW_MID, 1);
      for (let b = 0; b < 4; b++) {
        const by = 420 - h * (0.45 + rndT() * 0.5);
        const dir = rndT() > 0.5 ? 1 : -1;
        const bl = 18 + rndT() * 38;
        g.lineBetween(x, by, x + dir * bl, by - bl * (0.3 + rndT() * 0.4));
      }
    }
  } else if (theme === 'river') {
    // leaning mooring posts and ropes
    for (let i = 0; i < 12; i++) {
      const x = 40 + rndT() * 944;
      const h = 60 + rndT() * 130;
      g.fillStyle(COLORS.SHADOW_MID, 1);
      g.fillRect(x, 420 - h, 8 + rndT() * 6, h);
    }
    g.lineStyle(2, COLORS.SHADOW_MID, 0.8);
    for (let i = 0; i < 5; i++) {
      const x1 = rndT() * 900;
      g.lineBetween(x1, 320 + rndT() * 60, x1 + 90 + rndT() * 90, 350 + rndT() * 50);
    }
  } else {
    // leaning mid-distance buildings with dark window holes
    for (let i = 0; i < 8; i++) {
      const x = 20 + rndT() * 940;
      const w = 60 + rndT() * 90;
      const h = 180 + rndT() * 200;
      const tilt = (rndT() - 0.5) * 30;
      g.fillStyle(COLORS.SHADOW_MID, 1);
      g.beginPath();
      g.moveTo(x, 420);
      g.lineTo(x + w, 420);
      g.lineTo(x + w + tilt, 420 - h);
      g.lineTo(x + tilt, 420 - h + 10);
      g.closePath();
      g.fillPath();
      g.fillStyle(0x0D0D16, 1);
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 3; c++) {
          if (rndT() < 0.7) {
            g.fillRect(x + 10 + c * (w / 3.4) + tilt * (r / 6), 420 - h + 24 + r * 32, 9, 13);
          }
        }
      }
    }
  }
  g.generateTexture('bgMid' + chapterId, 1024, 420);

  /* ---------- near foreground ---------- */
  g.clear();
  const rndN = makeRng(555 + chapterId * 5);
  g.fillStyle(0x1B1B30, 1);
  g.fillRect(0, 110, 1024, 50);
  if (theme === 'forest') {
    for (let i = 0; i < 9; i++) {
      g.fillEllipse(rndN() * 1024, 122, 90 + rndN() * 160, 50 + rndN() * 40);
    }
    g.lineStyle(2, 0x20203A, 1);
    for (let i = 0; i < 60; i++) {
      const x = rndN() * 1024;
      const h = 6 + rndN() * 16;
      g.lineBetween(x, 116, x + (rndN() - 0.5) * 8, 116 - h);
    }
  } else if (theme === 'river') {
    // smooth bank stones
    for (let i = 0; i < 14; i++) {
      g.fillEllipse(rndN() * 1024, 124 + rndN() * 14, 30 + rndN() * 70, 18 + rndN() * 16);
    }
  } else {
    // rubble blocks
    for (let i = 0; i < 16; i++) {
      const x = rndN() * 1024;
      const w = 18 + rndN() * 50;
      g.fillRect(x, 112 - rndN() * 18, w, 26 + rndN() * 22);
    }
  }
  g.generateTexture('bgFore' + chapterId, 1024, 160);

  g.destroy();
}
